name: DCE Kconfig Diagnostic

"on":
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev

      - name: Verify Branch
        run: |
          echo "=== Branch ==="
          git branch --show-current

          echo "=== Commit ==="
          git rev-parse --short HEAD

      - name: Run Defconfig
        run: |
          echo "=========================================="
          echo " RUN DEFCONFIG"
          echo "=========================================="

          make O=arm64-test ARCH=arm64 vendor/violet-perf_defconfig

      - name: Check Defconfig
        run: |
          echo "=========================================="
          echo " SOURCE DEFCONFIG"
          echo "=========================================="

          grep -n \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            || echo "DCE: NOT FOUND"

      - name: Check Generated Config
        run: |
          echo "=========================================="
          echo " GENERATED .CONFIG"
          echo "=========================================="

          if grep -n \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arm64-test/.config; then
            echo
            echo "DCE in .config: FOUND"
          else
            echo
            echo "DCE in .config: ABSENT"
          fi

      - name: Check Autoconf
        run: |
          echo "=========================================="
          echo " AUTOCONF"
          echo "=========================================="

          FOUND=0

          for FILE in \
            arm64-test/include/generated/autoconf.h \
            arm64-test/include/config/auto.conf \
            arm64-test/include/config/auto.conf.cmd
          do
            if [ -f "$FILE" ]; then
              echo
              echo "FILE: $FILE"

              if grep -n \
                "LD_DEAD_CODE_DATA_ELIMINATION" \
                "$FILE"; then
                FOUND=1
              else
                echo "DCE: NOT FOUND"
              fi
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo
            echo "DCE in generated config files: ABSENT"
          fi

      - name: Check Kconfig Definition
        run: |
          echo "=========================================="
          echo " KCONFIG DEFINITION"
          echo "=========================================="

          grep -n -A8 -B2 \
            "config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            || echo "DCE definition: NOT FOUND"

      - name: Check Kconfig Selects
        run: |
          echo "=========================================="
          echo " KCONFIG SELECTS"
          echo "=========================================="

          if grep -Rns \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch kernel drivers fs mm include \
            2>/dev/null; then
            echo
            echo "DCE select: FOUND"
          else
            echo
            echo "DCE select: NONE"
          fi

      - name: Final DCE Report
        run: |
          echo
          echo "=========================================="
          echo " FINAL DCE REPORT"
          echo "=========================================="

          DEFCONFIG="ABSENT"
          CONFIG="ABSENT"
          AUTOCONF="ABSENT"
          SELECT="NONE"

          if grep -q \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/configs/vendor/violet-perf_defconfig; then
            DEFCONFIG="PRESENT"
          fi

          if grep -q \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arm64-test/.config; then
            CONFIG="PRESENT"
          fi

          if grep -Rqs \
            "LD_DEAD_CODE_DATA_ELIMINATION" \
            arm64-test/include/generated \
            arm64-test/include/config \
            2>/dev/null; then
            AUTOCONF="PRESENT"
          fi

          if grep -Rqs \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch kernel drivers fs mm include \
            2>/dev/null; then
            SELECT="FOUND"
          fi

          echo
          echo "DCE in defconfig : $DEFCONFIG"
          echo "DCE in .config   : $CONFIG"
          echo "DCE in generated : $AUTOCONF"
          echo "DCE select       : $SELECT"

          echo
          echo "=========================================="

          if [ "$DEFCONFIG" = "PRESENT" ] &&
             [ "$CONFIG" = "ABSENT" ]; then

            echo "CONCLUSION:"
            echo "DCE is present in defconfig but absent after Kconfig processing."

          elif [ "$DEFCONFIG" = "PRESENT" ] &&
               [ "$CONFIG" = "PRESENT" ]; then

            echo "CONCLUSION:"
            echo "DCE is preserved in the generated configuration."

          else

            echo "CONCLUSION:"
            echo "Further Kconfig investigation is required."

          fi

          echo "=========================================="
