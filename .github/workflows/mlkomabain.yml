name: Check DCE Kconfig Result vv

"on":
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev

      - name: Verify Branch
        run: |
          echo "=== Branch ==="
          git branch --show-current
          echo "=== Commit ==="
          git rev-parse --short HEAD

      - name: Run Defconfig
        run: |
          make O=arm64-test ARCH=arm64 vendor/violet-perf_defconfig

      - name: Check Generated Config
        run: |
          echo "=========================================="
          echo " GENERATED .CONFIG"
          echo "=========================================="

          if grep -n "LD_DEAD_CODE_DATA_ELIMINATION" arm64-test/.config; then
            echo
            echo "[FOUND] LD_DEAD_CODE_DATA_ELIMINATION"
          else
            echo
            echo "[NOT FOUND] LD_DEAD_CODE_DATA_ELIMINATION"
          fi

      - name: Run Kconfig Conf
        run: |
          echo "=========================================="
          echo " KCONFIG CONF"
          echo "=========================================="

          scripts/kconfig/conf \
            --defconfig=vendor/violet-perf_defconfig \
            Kconfig

      - name: Final DCE Report
        run: |
          echo
          echo "=========================================="
          echo " FINAL DCE REPORT"
          echo "=========================================="

          echo
          echo "Source defconfig:"
          grep -n "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            || echo "  NOT PRESENT"

          echo
          echo "Generated .config:"
          if grep -n "LD_DEAD_CODE_DATA_ELIMINATION" arm64-test/.config; then
            echo
            echo "RESULT: DCE symbol exists in .config"
          else
            echo "  NOT PRESENT"
            echo
            echo "RESULT: DCE symbol is absent from .config"
          fi

          echo
          echo "Kconfig definition:"
          grep -n -A3 -B1 \
            "config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            || echo "  NOT FOUND"

          echo
          echo "=========================================="
          echo " END"
          echo "=========================================="
