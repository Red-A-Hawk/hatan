name: Compare Kernel With OpenELA 4.14.357

on:
  workflow_dispatch:

jobs:
  compare-openela:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 16
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURATION
      # ============================================================
      - name: Configure OpenELA
        continue-on-error: true
        run: |
          set +e

          OPENELA_REPO="https://github.com/openela/kernel-lts.git"
          OPENELA_TAG="v4.14.357-openela"

          echo "OPENELA_REPO=$OPENELA_REPO" >> "$GITHUB_ENV"
          echo "OPENELA_TAG=$OPENELA_TAG" >> "$GITHUB_ENV"

          echo "============================================================"
          echo " OPENELA 4.14.357 COMPARISON"
          echo "============================================================"
          echo "Target branch : 16"
          echo "OpenELA tag   : $OPENELA_TAG"
          echo "============================================================"

      # ============================================================
      # 3. FETCH OPENELA TAG
      # ============================================================
      - name: Fetch OpenELA
        continue-on-error: true
        run: |
          set +e

          git remote remove openela 2>/dev/null || true

          git remote add openela "$OPENELA_REPO"

          git fetch --no-tags openela \
            "refs/tags/$OPENELA_TAG:refs/tags/$OPENELA_TAG"

          FETCH_RC=$?

          echo "Fetch exit code: $FETCH_RC"

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "ERROR: Failed to fetch OpenELA tag."
            exit 0
          fi

          OPENELA_COMMIT="$(git rev-parse "$OPENELA_TAG")"

          echo "OPENELA_COMMIT=$OPENELA_COMMIT" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " OPENELA TAG"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$OPENELA_TAG"

      # ============================================================
      # 4. DETECT TARGET
      # ============================================================
      - name: Detect Target
        continue-on-error: true
        run: |
          set +e

          TARGET="$(git rev-parse HEAD)"

          TARGET_VERSION="$(
            make -s kernelversion 2>/dev/null || true
          )"

          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION="unknown"
          fi

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " TARGET"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$TARGET"

          echo
          echo "Kernel version: $TARGET_VERSION"

      # ============================================================
      # 5. FIND COMMON ANCESTOR
      # ============================================================
      - name: Find Common Ancestor
        continue-on-error: true
        run: |
          set +e

          MERGE_BASE="$(
            git merge-base \
              "$TARGET" \
              "$OPENELA_COMMIT"
          )"

          if [ -z "$MERGE_BASE" ]; then
            echo "ERROR: Could not find common ancestor."
            exit 0
          fi

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " COMMON ANCESTOR"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$MERGE_BASE"

      # ============================================================
      # 6. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare Analysis Directories
        continue-on-error: true
        run: |
          set +e

          rm -rf openela-analysis

          mkdir -p \
            openela-analysis/missing-patches \
            openela-analysis/logs \
            openela-analysis/patch-id

          touch openela-analysis/missing.txt
          touch openela-analysis/already-present.txt
          touch openela-analysis/errors.txt
          touch openela-analysis/skipped.txt

      # ============================================================
      # 7. COLLECT ALL OPENELA COMMITS
      #
      # IMPORTANT:
      # NO --no-merges
      #
      # This includes merge commits.
      #
      # ORDER:
      # OLDEST -> NEWEST
      # ============================================================
      - name: Collect OpenELA Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"

          git rev-list \
            --reverse \
            "$MERGE_BASE..$OPENELA_COMMIT" \
            > "$COMMITS_FILE"

          TOTAL="$(
            wc -l < "$COMMITS_FILE"
          )"

          echo "OPENELA_COMMIT_COUNT=$TOTAL" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " OPENELA COMMITS"
          echo "============================================================"

          echo "Total commits: $TOTAL"
          echo "Order: OLDEST -> NEWEST"
          echo "Merge commits: INCLUDED"
          echo

          nl -ba "$COMMITS_FILE"

      # ============================================================
      # 8. BUILD TARGET PATCH-ID DATABASE
      #
      # Used to detect equivalent changes even when SHA differs.
      # ============================================================
      - name: Build Target Patch-ID Database
        continue-on-error: true
        run: |
          set +e

          TARGET_PATCH_IDS="openela-analysis/patch-id/target.patchids"

          : > "$TARGET_PATCH_IDS"

          echo "Building target patch-id database..."

          git log \
            --all \
            --format='%H' |
          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            # ------------------------------------------------------
            # Normal commit
            # ------------------------------------------------------
            if [ "$PARENT_COUNT" -eq 1 ]; then

              PATCH_ID="$(
                git diff \
                  "$SHA^" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

              if [ -n "$PATCH_ID" ]; then
                echo "$PATCH_ID $SHA" >> "$TARGET_PATCH_IDS"
              fi

            fi

          done

          sort -u \
            "$TARGET_PATCH_IDS" \
            -o "$TARGET_PATCH_IDS"

          TARGET_PATCH_COUNT="$(
            wc -l < "$TARGET_PATCH_IDS"
          )"

          echo "TARGET_PATCH_ID_COUNT=$TARGET_PATCH_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Target patch IDs: $TARGET_PATCH_COUNT"

      # ============================================================
      # 9. ANALYZE OPENELA COMMITS
      # ============================================================
      - name: Analyze OpenELA Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"
          TARGET_PATCH_IDS="openela-analysis/patch-id/target.patchids"

          REPORT="openela-analysis/report.md"

          cat > "$REPORT" <<EOF
          # OpenELA 4.14.357 Comparison

          ## Target

          Repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          HEAD:
          $TARGET

          Kernel version:
          $TARGET_VERSION

          ## OpenELA

          Repository:
          openela/kernel-lts

          Tag:
          $OPENELA_TAG

          Commit:
          $OPENELA_COMMIT

          ## Range

          Common ancestor:
          $MERGE_BASE

          OpenELA endpoint:
          $OPENELA_COMMIT

          Order:
          OLDEST -> NEWEST

          Merge commits:
          INCLUDED

          ## Safety

          Analysis only.

          No cherry-pick.

          No commit.

          No push.

          No reset.

          No source modification.

          EOF

          INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            INDEX=$((INDEX + 1))

            echo
            echo "============================================================"
            echo " OPENELA COMMIT $INDEX / $OPENELA_COMMIT_COUNT"
            echo "============================================================"
            echo "SHA: $SHA"

            SUBJECT="$(
              git show -s \
                --format='%s' \
                "$SHA" 2>/dev/null
            )"

            DATE="$(
              git show -s \
                --format='%ad' \
                --date=iso-strict \
                "$SHA" 2>/dev/null
            )"

            AUTHOR="$(
              git show -s \
                --format='%an <%ae>' \
                "$SHA" 2>/dev/null
            )"

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            echo "Subject : $SUBJECT"
            echo "Date    : $DATE"
            echo "Author  : $AUTHOR"
            echo "Parents : $PARENT_COUNT"

            # ======================================================
            # DETERMINE COMMIT TYPE
            # ======================================================
            if [ "$PARENT_COUNT" -gt 1 ]; then

              COMMIT_TYPE="MERGE"

            elif [ "$PARENT_COUNT" -eq 1 ]; then

              COMMIT_TYPE="NORMAL"

            else

              COMMIT_TYPE="ROOT"

            fi

            echo "Type    : $COMMIT_TYPE"

            # ======================================================
            # GET CHANGED FILES
            # ======================================================
            FILES="$(
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" 2>/dev/null
            )"

            # ======================================================
            # SUBSYSTEM CLASSIFICATION
            # ======================================================
            SUBSYSTEM="OTHER"

            if echo "$FILES" | grep -q 'arch/'; then
              SUBSYSTEM="ARCH"

            elif echo "$FILES" | grep -q 'drivers/'; then
              SUBSYSTEM="DRIVERS"

            elif echo "$FILES" | grep -q 'fs/'; then
              SUBSYSTEM="FILESYSTEM"

            elif echo "$FILES" | grep -q 'mm/'; then
              SUBSYSTEM="MM"

            elif echo "$FILES" | grep -q 'net/'; then
              SUBSYSTEM="NETWORK"

            elif echo "$FILES" | grep -q 'kernel/'; then
              SUBSYSTEM="KERNEL"

            elif echo "$FILES" | grep -q 'include/'; then
              SUBSYSTEM="INCLUDE"

            elif echo "$FILES" | grep -q 'security/'; then
              SUBSYSTEM="SECURITY"

            elif echo "$FILES" | grep -q 'crypto/'; then
              SUBSYSTEM="CRYPTO"

            elif echo "$FILES" | grep -q 'block/'; then
              SUBSYSTEM="BLOCK"

            elif echo "$FILES" | grep -q 'ipc/'; then
              SUBSYSTEM="IPC"

            elif echo "$FILES" | grep -q 'scripts/'; then
              SUBSYSTEM="SCRIPTS"
            fi

            # ======================================================
            # NORMAL COMMIT
            # ======================================================
            if [ "$PARENT_COUNT" -eq 1 ]; then

              PATCH_ID="$(
                git diff \
                  "$SHA^" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

              echo "Patch ID: $PATCH_ID"

              if [ -z "$PATCH_ID" ]; then

                echo "STATUS: PATCH-ID UNAVAILABLE"

                printf '%s | %s | patch-id unavailable | %s\n' \
                  "$SHA" \
                  "$DATE" \
                  "$SUBJECT" \
                  >> openela-analysis/errors.txt

                continue
              fi

              MATCH_SHA="$(
                awk \
                  -v id="$PATCH_ID" \
                  '$1 == id {print $2; exit}' \
                  "$TARGET_PATCH_IDS"
              )"

              if [ -n "$MATCH_SHA" ]; then

                echo "STATUS: ALREADY PRESENT / EQUIVALENT"
                echo "Equivalent target SHA: $MATCH_SHA"

                printf '%s | %s | %s | equivalent=%s\n' \
                  "$SHA" \
                  "$DATE" \
                  "$SUBJECT" \
                  "$MATCH_SHA" \
                  >> openela-analysis/already-present.txt

                continue
              fi

            # ======================================================
            # MERGE COMMIT
            #
            # A merge commit is compared against its FIRST parent.
            #
            # We do NOT exclude it.
            # ======================================================
            elif [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" |
                awk '{print $1}'
              )"

              MERGE_DIFF="$(
                git diff \
                  "$FIRST_PARENT" \
                  "$SHA" 2>/dev/null
              )"

              if [ -z "$MERGE_DIFF" ]; then

                echo "STATUS: MERGE HAS NO FIRST-PARENT DIFF"

                printf '%s | %s | merge has no first-parent diff | %s\n' \
                  "$SHA" \
                  "$DATE" \
                  "$SUBJECT" \
                  >> openela-analysis/skipped.txt

                continue
              fi

              PATCH_ID="$(
                printf '%s\n' "$MERGE_DIFF" |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

              echo "Merge patch ID: $PATCH_ID"

              if [ -n "$PATCH_ID" ]; then

                MATCH_SHA="$(
                  awk \
                    -v id="$PATCH_ID" \
                    '$1 == id {print $2; exit}' \
                    "$TARGET_PATCH_IDS"
                )"

                if [ -n "$MATCH_SHA" ]; then

                  echo "STATUS: MERGE EQUIVALENT PRESENT"
                  echo "Equivalent target SHA: $MATCH_SHA"

                  printf '%s | %s | %s | equivalent=%s\n' \
                    "$SHA" \
                    "$DATE" \
                    "$SUBJECT" \
                    "$MATCH_SHA" \
                    >> openela-analysis/already-present.txt

                  continue
                fi

              fi

            else

              echo "STATUS: ROOT COMMIT"

            fi

            # ======================================================
            # MISSING COMMIT
            # ======================================================
            INDEX_PADDED="$(
              printf "%04d" "$INDEX"
            )"

            SAFE_SUBJECT="$(
              echo "$SUBJECT" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//;s/-$//' |
              cut -c1-100
            )"

            if [ -z "$SAFE_SUBJECT" ]; then
              SAFE_SUBJECT="openela-commit"
            fi

            PATCH_FILE="openela-analysis/missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch"

            echo "STATUS: MISSING"
            echo "Patch: $PATCH_FILE"

            # ======================================================
            # GENERATE PATCH
            # ======================================================
            if [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" |
                awk '{print $1}'
              )"

              git diff \
                --binary \
                --full-index \
                "$FIRST_PARENT" \
                "$SHA" \
                > "$PATCH_FILE"

              PATCH_RC=$?

              if [ "$PATCH_RC" -eq 0 ]; then

                PATCH_HEADER="$(
                  git show \
                    --format=email \
                    --no-patch \
                    "$SHA" 2>/dev/null
                )"

                if [ -n "$PATCH_HEADER" ]; then

                  {
                    echo "$PATCH_HEADER"
                    echo
                    cat "$PATCH_FILE"
                  } > "${PATCH_FILE}.tmp"

                  mv \
                    "${PATCH_FILE}.tmp" \
                    "$PATCH_FILE"

                fi

              fi

            else

              git format-patch \
                --stdout \
                --full-index \
                --binary \
                -1 "$SHA" \
                > "$PATCH_FILE"

              PATCH_RC=$?

            fi

            # ======================================================
            # PATCH GENERATION ERROR
            # ======================================================
            if [ "$PATCH_RC" -ne 0 ]; then

              echo "ERROR: Patch generation failed."

              printf '%s | %s | patch generation failed | %s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                >> openela-analysis/errors.txt

              rm -f "$PATCH_FILE"

              continue
            fi

            # ======================================================
            # APPLY CHECK
            #
            # IMPORTANT:
            # This DOES NOT modify the kernel.
            # ======================================================
            APPLY_LOG="openela-analysis/logs/${INDEX_PADDED}-apply.log"

            git apply \
              --check \
              "$PATCH_FILE" \
              > "$APPLY_LOG" \
              2>&1

            APPLY_RC=$?

            if [ "$APPLY_RC" -eq 0 ]; then
              APPLY_STATUS="CLEAN_APPLY"
            else
              APPLY_STATUS="CONFLICT"
            fi

            # ======================================================
            # RECORD MISSING
            # ======================================================
            printf '%s | %s | %s | %s | %s | %s | %s\n' \
              "$SHA" \
              "$DATE" \
              "$COMMIT_TYPE" \
              "$SUBSYSTEM" \
              "$APPLY_STATUS" \
              "$PATCH_ID" \
              "$SUBJECT" \
              >> openela-analysis/missing.txt

            # ======================================================
            # REPORT
            # ======================================================
            cat >> "$REPORT" <<EOF

          ---

          ## $INDEX_PADDED — $SHA

          **Subject**

          $SUBJECT

          **Date**

          $DATE

          **Author**

          $AUTHOR

          **Commit type**

          $COMMIT_TYPE

          **Parent count**

          $PARENT_COUNT

          **Subsystem**

          $SUBSYSTEM

          **Patch ID**

          $PATCH_ID

          **Apply check**

          $APPLY_STATUS

          **Patch**

          \`missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch\`

          ### Changed files

          \`\`\`
          $FILES
          \`\`\`

          EOF

            if [ "$APPLY_RC" -ne 0 ]; then

              cat >> "$REPORT" <<EOF

          ### Apply check output

          \`\`\`
          $(cat "$APPLY_LOG")
          \`\`\`

          EOF

            fi

          done < "$COMMITS_FILE"

      # ============================================================
      # 10. FINAL SUMMARY
      # ============================================================
      - name: Generate Final Metadata
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            openela-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            openela-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            openela-analysis/errors.txt \
            2>/dev/null || true
          )"

          SKIPPED_COUNT="$(
            grep -c . \
            openela-analysis/skipped.txt \
            2>/dev/null || true
          )"

          cat > openela-analysis/metadata.txt <<EOF
          OpenELA Comparison Metadata
          ============================

          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Target HEAD:
          $TARGET

          Target kernel version:
          $TARGET_VERSION

          OpenELA repository:
          https://github.com/openela/kernel-lts

          OpenELA tag:
          $OPENELA_TAG

          OpenELA commit:
          $OPENELA_COMMIT

          Common ancestor:
          $MERGE_BASE

          Total OpenELA commits analyzed:
          $OPENELA_COMMIT_COUNT

          Missing commits:
          $MISSING_COUNT

          Already present/equivalent:
          $PRESENT_COUNT

          Errors:
          $ERROR_COUNT

          Skipped:
          $SKIPPED_COUNT

          Order:
          OLDEST -> NEWEST

          Merge commits:
          INCLUDED

          Actions performed:
          ANALYSIS ONLY

          Cherry-pick:
          NO

          Commit:
          NO

          Push:
          NO

          Reset:
          NO

          Source modification:
          NO
          EOF

          cat > openela-analysis/README.txt <<EOF
          OpenELA 4.14.357 Comparison
          ===========================

          Target:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          Reference:
          openela/kernel-lts

          Tag:
          $OPENELA_TAG

          Start:
          $MERGE_BASE

          End:
          $OPENELA_COMMIT

          All commits between the common ancestor and the
          OpenELA 4.14.357 tag are analyzed.

          Merge commits are INCLUDED.

          Commits are processed oldest to newest.

          Equivalent patches already present in the target
          are excluded from the missing-patch list.

          Missing commits are exported individually.

          No patches were applied.

          No source files were modified.

          No commits were created.

          No push was performed.
          EOF

          echo
          echo "============================================================"
          echo " FINAL OPENELA RESULT"
          echo "============================================================"
          echo "Target HEAD       : $TARGET"
          echo "Kernel version    : $TARGET_VERSION"
          echo "OpenELA tag       : $OPENELA_TAG"
          echo "OpenELA commit    : $OPENELA_COMMIT"
          echo "Common ancestor   : $MERGE_BASE"
          echo "Analyzed          : $OPENELA_COMMIT_COUNT"
          echo "Missing           : $MISSING_COUNT"
          echo "Already present   : $PRESENT_COUNT"
          echo "Errors            : $ERROR_COUNT"
          echo "Skipped           : $SKIPPED_COUNT"
          echo "============================================================"

      # ============================================================
      # 11. GITHUB STEP SUMMARY
      # ============================================================
      - name: GitHub Summary
        if: always()
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            openela-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            openela-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            openela-analysis/errors.txt \
            2>/dev/null || true
          )"

          SKIPPED_COUNT="$(
            grep -c . \
            openela-analysis/skipped.txt \
            2>/dev/null || true
          )"

          {
            echo "## OpenELA 4.14.357 Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Target branch | \`16\` |"
            echo "| Target version | \`$TARGET_VERSION\` |"
            echo "| OpenELA tag | \`$OPENELA_TAG\` |"
            echo "| OpenELA commit | \`$OPENELA_COMMIT\` |"
            echo "| Common ancestor | \`$MERGE_BASE\` |"
            echo "| Commits analyzed | $OPENELA_COMMIT_COUNT |"
            echo "| Missing | $MISSING_COUNT |"
            echo "| Already present/equivalent | $PRESENT_COUNT |"
            echo "| Errors | $ERROR_COUNT |"
            echo "| Skipped | $SKIPPED_COUNT |"
            echo
            echo "### Analysis"
            echo
            echo "- Merge commits included"
            echo "- Oldest -> newest"
            echo "- Patch-ID equivalence check"
            echo
            echo "### Safety"
            echo
            echo "- No cherry-pick"
            echo "- No commit"
            echo "- No push"
            echo "- No reset"
            echo "- No source modification"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 12. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload OpenELA Analysis
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openela-4.14.357-analysis
          path: openela-analysis/
          if-no-files-found: warn
          retention-days: 30
