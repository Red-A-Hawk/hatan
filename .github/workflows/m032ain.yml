name: Analyze OpenELA 4.14.356 Backport Candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 0
          persist-credentials: false

      # ============================================================
      # 2. FETCH ONLY OPENELA 4.14.y
      # ============================================================
      - name: Fetch OpenELA linux-4.14.y
        continue-on-error: true
        run: |
          set +e

          git remote remove openela 2>/dev/null || true

          git remote add openela \
            https://github.com/openela/kernel-lts.git

          git fetch \
            --no-tags \
            --prune \
            openela \
            linux-4.14.y

          exit 0

      # ============================================================
      # 3. ANALYZE UP TO 4.14.356
      # ============================================================
      - name: Analyze OpenELA through 4.14.356
        continue-on-error: true
        shell: bash
        run: |
          set +e

          OUT="$GITHUB_WORKSPACE/openela-4.14-analysis"
          PATCH_DIR="$OUT/candidates"

          rm -rf "$OUT"

          mkdir -p "$PATCH_DIR"

          REPORT="$OUT/report.md"
          CANDIDATES="$OUT/candidates.txt"
          PRESENT="$OUT/already-present.txt"
          SKIPPED="$OUT/skipped.txt"
          ERRORS="$OUT/errors.txt"

          TARGET="HEAD"
          OPENELA="openela/linux-4.14.y"

          TARGET_RELEASE="4.14.357"
          ANALYZE_UNTIL="4.14.356"

          # --------------------------------------------------------
          # INITIAL FILES
          # --------------------------------------------------------

          cat > "$REPORT" <<EOF
          # OpenELA Linux 4.14 Backport Analysis

          ## Target

          - Repository: Red-A-Hawk/los_kernel_xiaomi_sm6150
          - Branch: 16
          - Target kernel: $TARGET_RELEASE

          ## OpenELA Source

          - Repository: openela/kernel-lts
          - Branch: linux-4.14.y
          - Analysis endpoint: $ANALYZE_UNTIL

          ## Rules

          - Analysis is READ-ONLY.
          - No cherry-pick.
          - No commit.
          - No push.
          - No source modification.
          - Every candidate is exported as an individual patch.
          - Patch order is OLDEST -> NEWEST.
          - Analysis stops exactly at OpenELA 4.14.356.

          EOF

          cat > "$CANDIDATES" <<'EOF'
          # Candidates
          #
          # NUMBER | SHA | DATE | SUBSYSTEM | APPLY_STATUS | PATH_STATUS | SUBJECT

          EOF

          cat > "$PRESENT" <<'EOF'
          # Already Present / Equivalent

          EOF

          cat > "$SKIPPED" <<'EOF'
          # Skipped

          EOF

          cat > "$ERRORS" <<'EOF'
          # Non-Fatal Errors

          EOF

          # --------------------------------------------------------
          # CHECK OPENELA
          # --------------------------------------------------------

          if ! git rev-parse "$OPENELA" >/dev/null 2>&1; then

            echo "OpenELA reference unavailable."

            echo \
              "OpenELA linux-4.14.y could not be fetched." \
              >> "$ERRORS"

            cat >> "$REPORT" <<'EOF'

          ## ERROR

          OpenELA `linux-4.14.y` was unavailable.

          The workflow intentionally exits successfully so that
          the diagnostic artifact can still be uploaded.
          EOF

            exit 0
          fi

          # --------------------------------------------------------
          # FIND EXACT 4.14.356 RELEASE COMMIT
          # --------------------------------------------------------

          END_COMMIT="$(
            git log "$OPENELA" \
              --format='%H' \
              --grep='^LTS: Update to 4\.14\.356$' \
              -n 1 \
              2>/dev/null \
              || true
          )"

          # --------------------------------------------------------
          # FALLBACK RELEASE SEARCH
          # --------------------------------------------------------

          if [ -z "$END_COMMIT" ]; then

            END_COMMIT="$(
              git log "$OPENELA" \
                --format='%H%x09%s' \
                2>/dev/null |
              awk -F '\t' '
                $2 == "LTS: Update to 4.14.356" {
                  print $1
                  exit
                }
              '
            )"

          fi

          # --------------------------------------------------------
          # IF 4.14.356 DOES NOT EXIST
          # --------------------------------------------------------

          if [ -z "$END_COMMIT" ]; then

            echo \
              "4.14.356 release commit was not found." \
              >> "$ERRORS"

            cat >> "$REPORT" <<'EOF'

          ## ERROR

          The exact OpenELA release commit:

          `LTS: Update to 4.14.356`

          could not be found.

          No commits were guessed or substituted.
          EOF

            exit 0
          fi

          echo "OpenELA 4.14.356 commit:"
          echo "$END_COMMIT"

          # --------------------------------------------------------
          # FIND COMMON ANCESTOR
          # --------------------------------------------------------

          MERGE_BASE="$(
            git merge-base "$TARGET" "$OPENELA" \
              2>/dev/null \
              || true
          )"

          if [ -z "$MERGE_BASE" ]; then

            echo \
              "WARNING: No common ancestor detected." \
              >> "$ERRORS"

          fi

          # --------------------------------------------------------
          # SELECT COMMITS
          #
          # IMPORTANT:
          #
          # --reverse
          #
          # means:
          #
          # OLDEST -> NEWEST
          #
          # The endpoint is exactly 4.14.356.
          # --------------------------------------------------------

          mapfile -t OPENELA_COMMITS < <(

            git rev-list \
              --reverse \
              --no-merges \
              "$END_COMMIT" \
              2>/dev/null \
              || true

          )

          TOTAL="${#OPENELA_COMMITS[@]}"

          echo "Commits selected: $TOTAL"

          # --------------------------------------------------------
          # PATCH EQUIVALENCE
          # --------------------------------------------------------

          declare -A PRESENT_MAP

          if [ -n "$MERGE_BASE" ]; then

            while IFS= read -r LINE; do

              [ -z "$LINE" ] && continue

              STATUS="${LINE:0:1}"
              REST="${LINE:2}"

              SHA="${REST%% *}"

              if [ "$STATUS" = "-" ] &&
                 [ -n "$SHA" ]; then

                PRESENT_MAP["$SHA"]=1

              fi

            done < <(

              git cherry \
                -v \
                "$TARGET" \
                "$END_COMMIT" \
                2>/dev/null \
                || true

            )

          fi

          # --------------------------------------------------------
          # COUNTERS
          # --------------------------------------------------------

          PATCH_NUMBER=0

          ANALYZED=0
          ALREADY=0
          SKIPPED_COUNT=0
          CANDIDATE_COUNT=0
          CLEAN_COUNT=0
          CONFLICT_COUNT=0
          ERROR_COUNT=0

          # --------------------------------------------------------
          # PROCESS COMMITS
          # --------------------------------------------------------

          for SHA in "${OPENELA_COMMITS[@]}"; do

            ANALYZED=$((ANALYZED + 1))

            # ------------------------------------------------------
            # SUBJECT
            # ------------------------------------------------------

            SUBJECT="$(
              git show \
                -s \
                --format='%s' \
                "$SHA" \
                2>/dev/null \
                || echo "UNKNOWN SUBJECT"
            )"

            DATE="$(
              git show \
                -s \
                --format='%ad' \
                --date=iso-strict \
                "$SHA" \
                2>/dev/null \
                || echo "UNKNOWN DATE"
            )"

            AUTHOR="$(
              git show \
                -s \
                --format='%an <%ae>' \
                "$SHA" \
                2>/dev/null \
                || echo "UNKNOWN AUTHOR"
            )"

            # ------------------------------------------------------
            # SKIP RELEASE COMMITS
            # ------------------------------------------------------

            if echo "$SUBJECT" | grep -Eq \
              '^LTS: Update to 4\.14\.[0-9]+$'; then

              echo \
                "$SHA | $DATE | RELEASE | $SUBJECT" \
                >> "$SKIPPED"

              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

              continue
            fi

            # ------------------------------------------------------
            # ALREADY PRESENT
            # ------------------------------------------------------

            if [ "${PRESENT_MAP[$SHA]:-0}" = "1" ]; then

              echo \
                "$SHA | $DATE | ALREADY PRESENT | $SUBJECT" \
                >> "$PRESENT"

              ALREADY=$((ALREADY + 1))

              continue
            fi

            # ------------------------------------------------------
            # FILES
            # ------------------------------------------------------

            FILES="$(
              git diff-tree \
                --no-commit-id \
                --name-only \
                -r \
                "$SHA" \
                2>/dev/null \
                || true
            )"

            FILE_COUNT="$(
              printf '%s\n' "$FILES" |
              sed '/^$/d' |
              wc -l |
              tr -d ' '
            )"

            # ------------------------------------------------------
            # SUBSYSTEM
            # ------------------------------------------------------

            SUBSYSTEM="OTHER"

            while IFS= read -r FILE; do

              case "$FILE" in

                arch/*)
                  SUBSYSTEM="ARCH"
                  break
                  ;;

                drivers/*)
                  SUBSYSTEM="DRIVERS"
                  break
                  ;;

                fs/*)
                  SUBSYSTEM="FS"
                  break
                  ;;

                mm/*)
                  SUBSYSTEM="MM"
                  break
                  ;;

                kernel/*)
                  SUBSYSTEM="KERNEL"
                  break
                  ;;

                net/*)
                  SUBSYSTEM="NET"
                  break
                  ;;

                security/*)
                  SUBSYSTEM="SECURITY"
                  break
                  ;;

                block/*)
                  SUBSYSTEM="BLOCK"
                  break
                  ;;

                ipc/*)
                  SUBSYSTEM="IPC"
                  break
                  ;;

                lib/*)
                  SUBSYSTEM="LIB"
                  break
                  ;;

                include/*)
                  SUBSYSTEM="INCLUDE"
                  break
                  ;;

                scripts/*)
                  SUBSYSTEM="SCRIPTS"
                  break
                  ;;

              esac

            done <<< "$FILES"

            # ------------------------------------------------------
            # NUMBER
            # ------------------------------------------------------

            PATCH_NUMBER=$((PATCH_NUMBER + 1))

            NUM="$(
              printf '%04d' "$PATCH_NUMBER"
            )"

            # ------------------------------------------------------
            # SAFE PATCH NAME
            # ------------------------------------------------------

            SAFE_SUBJECT="$(
              echo "$SUBJECT" |
              tr '[:upper:]' '[:lower:]' |
              sed \
                -e 's/[^a-z0-9._-]/-/g' \
                -e 's/-\+/-/g' \
                -e 's/^-//' \
                -e 's/-$//' |
              cut -c1-100
            )"

            if [ -z "$SAFE_SUBJECT" ]; then
              SAFE_SUBJECT="unknown-commit"
            fi

            PATCH_FILE="$PATCH_DIR/${NUM}-${SAFE_SUBJECT}.patch"

            # ------------------------------------------------------
            # EXPORT PATCH
            # ------------------------------------------------------

            if ! git format-patch \
                --stdout \
                --full-index \
                --binary \
                -1 "$SHA" \
                > "$PATCH_FILE" \
                2>/dev/null; then

              echo \
                "$SHA | PATCH_GENERATION_FAILED | $SUBJECT" \
                >> "$ERRORS"

              ERROR_COUNT=$((ERROR_COUNT + 1))

              rm -f "$PATCH_FILE"

              continue
            fi

            # ------------------------------------------------------
            # APPLY CHECK
            #
            # DOES NOT MODIFY SOURCE.
            # ------------------------------------------------------

            if git apply \
                --check \
                --whitespace=nowarn \
                "$PATCH_FILE" \
                >/dev/null \
                2>&1; then

              APPLY_STATUS="CLEAN_APPLY"

              CLEAN_COUNT=$((CLEAN_COUNT + 1))

            else

              APPLY_STATUS="CONFLICT"

              CONFLICT_COUNT=$((CONFLICT_COUNT + 1))

            fi

            # ------------------------------------------------------
            # PATH CHECK
            # ------------------------------------------------------

            MISSING_FILES=""

            while IFS= read -r FILE; do

              [ -z "$FILE" ] && continue

              if [ ! -e "$FILE" ]; then

                MISSING_FILES="${MISSING_FILES}${FILE}"$'\n'

              fi

            done <<< "$FILES"

            if [ -n "$MISSING_FILES" ]; then
              PATH_STATUS="PATH_MISSING"
            else
              PATH_STATUS="PATH_OK"
            fi

            # ------------------------------------------------------
            # CANDIDATE
            # ------------------------------------------------------

            CANDIDATE_COUNT=$((CANDIDATE_COUNT + 1))

            echo \
              "$NUM | $SHA | $DATE | $SUBSYSTEM | $APPLY_STATUS | $PATH_STATUS | $SUBJECT" \
              >> "$CANDIDATES"

            # ------------------------------------------------------
            # REPORT ENTRY
            # ------------------------------------------------------

            {
              echo
              echo "### $NUM — $SUBJECT"
              echo
              echo "- **Commit:** \`$SHA\`"
              echo "- **Date:** $DATE"
              echo "- **Author:** $AUTHOR"
              echo "- **Subsystem:** $SUBSYSTEM"
              echo "- **Files changed:** $FILE_COUNT"
              echo "- **Apply check:** $APPLY_STATUS"
              echo "- **Path check:** $PATH_STATUS"
              echo "- **Patch:** \`candidates/$(basename "$PATCH_FILE")\`"
              echo
              echo "**Changed files:**"
              echo
              echo '```text'
              echo "$FILES"
              echo '```'
              echo

              if [ -n "$MISSING_FILES" ]; then

                echo "**Missing paths in target:**"
                echo
                echo '```text'
                echo "$MISSING_FILES"
                echo '```'
                echo

              fi

              echo "---"

            } >> "$REPORT"

          done

          # --------------------------------------------------------
          # SUMMARY
          # --------------------------------------------------------

          {
            echo
            echo "## Summary"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Commits analyzed | $ANALYZED |"
            echo "| Candidates | $CANDIDATE_COUNT |"
            echo "| Already present/equivalent | $ALREADY |"
            echo "| Skipped release commits | $SKIPPED_COUNT |"
            echo "| Clean textual apply | $CLEAN_COUNT |"
            echo "| Conflicting patches | $CONFLICT_COUNT |"
            echo "| Non-fatal errors | $ERROR_COUNT |"
            echo
            echo "## Analysis Range"
            echo
            echo "**Endpoint:** OpenELA Linux 4.14.356"
            echo
            echo "**Order:** OLDEST -> NEWEST"
            echo
            echo "The analysis does not include commits after 4.14.356."
            echo
            echo "## Important"
            echo
            echo "\`CLEAN_APPLY\` only means the patch applies textually."
            echo "It does not prove semantic compatibility with the Xiaomi/vendor kernel."
            echo
            echo "\`CONFLICT\` means the original OpenELA patch does not apply cleanly."
            echo "Such a patch may require manual backporting."
          } >> "$REPORT"

          # --------------------------------------------------------
          # METADATA
          # --------------------------------------------------------

          cat > "$OUT/metadata.txt" <<EOF
          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Target kernel:
          $TARGET_RELEASE

          OpenELA repository:
          https://github.com/openela/kernel-lts

          OpenELA branch:
          linux-4.14.y

          Analysis endpoint:
          LTS: Update to 4.14.356

          Endpoint commit:
          $END_COMMIT

          Common ancestor:
          ${MERGE_BASE:-NONE}

          Order:
          OLDEST -> NEWEST

          Source modified:
          NO

          Cherry-pick:
          NO

          Push:
          NO
          EOF

          # --------------------------------------------------------
          # FINAL RESULT
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "OPENELA 4.14.356 ANALYSIS COMPLETE"
          echo "============================================================"
          echo
          echo "Commits analyzed : $ANALYZED"
          echo "Candidates       : $CANDIDATE_COUNT"
          echo "Already present  : $ALREADY"
          echo "Skipped          : $SKIPPED_COUNT"
          echo "Clean apply      : $CLEAN_COUNT"
          echo "Conflicts        : $CONFLICT_COUNT"
          echo "Errors           : $ERROR_COUNT"
          echo
          echo "Order: OLDEST -> NEWEST"
          echo
          echo "============================================================"

          exit 0

      # ============================================================
      # 4. SHOW RESULTS
      # ============================================================
      - name: Show analysis result
        if: always()
        continue-on-error: true
        run: |
          echo "============================================================"
          echo "OPENELA ANALYSIS FILES"
          echo "============================================================"

          if [ -d "openela-4.14-analysis" ]; then

            find openela-4.14-analysis \
              -type f \
              -printf '%p\n' |
              sort

          else

            echo "Analysis directory does not exist."

          fi

      # ============================================================
      # 5. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload OpenELA analysis artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: openela-4.14-analysis
          path: openela-4.14-analysis/
          if-no-files-found: warn
          compression-level: 6
