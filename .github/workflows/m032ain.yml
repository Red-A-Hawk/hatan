name: Compare Kernel With OpenELA 4.14.357

on:
  workflow_dispatch:

jobs:
  compare-openela:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 16
          fetch-depth: 0

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      # ============================================================
      # 3. CONFIGURATION
      # ============================================================
      - name: Configure OpenELA Reference
        continue-on-error: true
        run: |
          set +e

          OPENELA_REPO="https://github.com/openela/kernel-lts.git"
          OPENELA_TAG="v4.14.357-openela"

          echo "OPENELA_REPO=$OPENELA_REPO" >> "$GITHUB_ENV"
          echo "OPENELA_TAG=$OPENELA_TAG" >> "$GITHUB_ENV"

          echo "=============================================="
          echo " OpenELA Comparison"
          echo "=============================================="
          echo "Target branch : 16"
          echo "OpenELA tag   : $OPENELA_TAG"
          echo "=============================================="

      # ============================================================
      # 4. FETCH OPENELA TAG
      # ============================================================
      - name: Fetch OpenELA
        continue-on-error: true
        run: |
          set +e

          git remote remove openela 2>/dev/null || true

          git remote add openela "$OPENELA_REPO"

          git fetch --no-tags openela \
            "refs/tags/$OPENELA_TAG:refs/tags/$OPENELA_TAG"

          FETCH_RC=$?

          echo "OpenELA fetch exit code: $FETCH_RC"

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "ERROR: Failed to fetch OpenELA tag."
            exit 0
          fi

          echo
          echo "OpenELA tag:"
          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$OPENELA_TAG"

      # ============================================================
      # 5. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare Analysis Directories
        continue-on-error: true
        run: |
          set +e

          rm -rf openela-analysis

          mkdir -p openela-analysis/missing-patches

          touch openela-analysis/missing.txt
          touch openela-analysis/already-present.txt
          touch openela-analysis/skipped.txt
          touch openela-analysis/errors.txt

      # ============================================================
      # 6. DETECT TARGET / OPENELA COMMITS
      # ============================================================
      - name: Detect Kernel Versions And Base
        continue-on-error: true
        run: |
          set +e

          TARGET="$(git rev-parse HEAD)"
          OPENELA="$(git rev-parse "$OPENELA_TAG")"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "OPENELA=$OPENELA" >> "$GITHUB_ENV"

          TARGET_VERSION="$(make -s kernelversion 2>/dev/null || true)"

          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION="unknown"
          fi

          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"

          MERGE_BASE="$(git merge-base "$TARGET" "$OPENELA")"

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "TARGET HEAD"
          echo "=============================================="
          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$TARGET"

          echo
          echo "=============================================="
          echo "OPENELA TAG"
          echo "=============================================="
          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$OPENELA"

          echo
          echo "=============================================="
          echo "COMMON ANCESTOR"
          echo "=============================================="
          echo "$MERGE_BASE"

          echo
          echo "=============================================="
          echo "TARGET KERNEL VERSION"
          echo "=============================================="
          echo "$TARGET_VERSION"

      # ============================================================
      # 7. COLLECT OPENELA COMMITS
      #    OLDEST -> NEWEST
      # ============================================================
      - name: Collect OpenELA Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"

          git rev-list \
            --reverse \
            --no-merges \
            "$MERGE_BASE..$OPENELA" \
            > "$COMMITS_FILE"

          COUNT=$(wc -l < "$COMMITS_FILE")

          echo "OPENELA_COMMIT_COUNT=$COUNT" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "OPENELA COMMITS"
          echo "=============================================="
          echo "Count: $COUNT"
          echo "Order: OLDEST -> NEWEST"
          echo

          cat "$COMMITS_FILE"

      # ============================================================
      # 8. BUILD PRESENT PATCH MAP
      # ============================================================
      - name: Build Equivalent Commit Map
        continue-on-error: true
        run: |
          set +e

          PRESENT_MAP="openela-analysis/present-map.txt"

          git cherry -v "$TARGET" "$OPENELA" \
            > "$PRESENT_MAP"

          echo
          echo "=============================================="
          echo "PATCH EQUIVALENCE MAP"
          echo "=============================================="

          cat "$PRESENT_MAP"

      # ============================================================
      # 9. ANALYZE EACH OPENELA COMMIT
      # ============================================================
      - name: Analyze Missing OpenELA Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"
          PRESENT_MAP="openela-analysis/present-map.txt"

          REPORT="openela-analysis/report.md"

          cat > "$REPORT" <<EOF
          # OpenELA 4.14.357 Comparison

          ## Reference

          - Target repository: Red-A-Hawk/los_kernel_xiaomi_sm6150
          - Target branch: 16
          - OpenELA repository: openela/kernel-lts
          - OpenELA tag: $OPENELA_TAG
          - Target HEAD: $TARGET
          - OpenELA HEAD: $OPENELA
          - Common ancestor: $MERGE_BASE
          - Target kernel version: $TARGET_VERSION

          ## Analysis

          Commits are processed from **oldest to newest**.

          Only commits which are not patch-equivalent to the target
          branch are exported.

          No cherry-pick, commit, push, reset, or source modification
          is performed by this workflow.

          EOF

          INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            INDEX=$((INDEX + 1))

            echo
            echo "============================================================"
            echo "OPENELA COMMIT $INDEX"
            echo "SHA: $SHA"
            echo "============================================================"

            SUBJECT="$(git show -s --format='%s' "$SHA" 2>/dev/null)"
            DATE="$(git show -s --format='%ad' --date=iso-strict "$SHA" 2>/dev/null)"
            AUTHOR="$(git show -s --format='%an <%ae>' "$SHA" 2>/dev/null)"

            echo "Subject: $SUBJECT"
            echo "Date:    $DATE"
            echo "Author:  $AUTHOR"

            # ------------------------------------------------------
            # Check if patch-equivalent already exists
            # ------------------------------------------------------
            if grep -q "^-.*$SHA" "$PRESENT_MAP"; then

              echo "STATUS: ALREADY PRESENT"

              printf '%s | %s\n' \
                "$SHA" \
                "$SUBJECT" \
                >> openela-analysis/already-present.txt

              continue
            fi

            # ------------------------------------------------------
            # Find patch-equivalent by subject-independent cherry map
            # ------------------------------------------------------
            EQUIVALENT=""

            while IFS= read -r LINE; do

              PREFIX="${LINE:0:1}"

              if [ "$PREFIX" = "-" ]; then

                OTHER_SHA="$(echo "$LINE" | awk '{print $2}')"

                if [ -n "$OTHER_SHA" ]; then

                  PATCH_A="$(git diff-tree --no-commit-id --name-only -r "$SHA" 2>/dev/null | sort)"
                  PATCH_B="$(git diff-tree --no-commit-id --name-only -r "$OTHER_SHA" 2>/dev/null | sort)"

                  if [ "$PATCH_A" = "$PATCH_B" ]; then
                    EQUIVALENT="$OTHER_SHA"
                    break
                  fi

                fi
              fi

            done < "$PRESENT_MAP"

            if [ -n "$EQUIVALENT" ]; then

              echo "STATUS: ALREADY PRESENT / EQUIVALENT"
              echo "Equivalent commit: $EQUIVALENT"

              printf '%s | %s | equivalent=%s\n' \
                "$SHA" \
                "$SUBJECT" \
                "$EQUIVALENT" \
                >> openela-analysis/already-present.txt

              continue
            fi

            # ------------------------------------------------------
            # Missing commit
            # ------------------------------------------------------
            INDEX_PADDED=$(printf "%04d" "$INDEX")

            SAFE_SUBJECT="$(echo "$SUBJECT" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9._-]/-/g' \
              | sed 's/-\+/-/g' \
              | sed 's/^-//;s/-$//' \
              | cut -c1-100)"

            if [ -z "$SAFE_SUBJECT" ]; then
              SAFE_SUBJECT="openela-commit"
            fi

            PATCH_FILE="openela-analysis/missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch"

            echo "STATUS: MISSING"
            echo "Patch: $PATCH_FILE"

            # ------------------------------------------------------
            # Get changed files
            # ------------------------------------------------------
            FILES="$(git diff-tree \
              --no-commit-id \
              --name-status \
              -r \
              "$SHA" 2>/dev/null)"

            # ------------------------------------------------------
            # Subsystem classification
            # ------------------------------------------------------
            SUBSYSTEM="OTHER"

            if echo "$FILES" | grep -q '^.*arch/'; then
              SUBSYSTEM="ARCH"
            elif echo "$FILES" | grep -q '^.*drivers/'; then
              SUBSYSTEM="DRIVERS"
            elif echo "$FILES" | grep -q '^.*fs/'; then
              SUBSYSTEM="FILESYSTEM"
            elif echo "$FILES" | grep -q '^.*mm/'; then
              SUBSYSTEM="MM"
            elif echo "$FILES" | grep -q '^.*net/'; then
              SUBSYSTEM="NETWORK"
            elif echo "$FILES" | grep -q '^.*kernel/'; then
              SUBSYSTEM="KERNEL"
            elif echo "$FILES" | grep -q '^.*include/'; then
              SUBSYSTEM="INCLUDE"
            elif echo "$FILES" | grep -q '^.*security/'; then
              SUBSYSTEM="SECURITY"
            elif echo "$FILES" | grep -q '^.*crypto/'; then
              SUBSYSTEM="CRYPTO"
            elif echo "$FILES" | grep -q '^.*block/'; then
              SUBSYSTEM="BLOCK"
            elif echo "$FILES" | grep -q '^.*ipc/'; then
              SUBSYSTEM="IPC"
            elif echo "$FILES" | grep -q '^.*scripts/'; then
              SUBSYSTEM="SCRIPTS"
            fi

            # ------------------------------------------------------
            # Generate patch
            # ------------------------------------------------------
            git format-patch \
              --stdout \
              --full-index \
              --binary \
              -1 "$SHA" \
              > "$PATCH_FILE"

            FORMAT_RC=$?

            if [ "$FORMAT_RC" -ne 0 ]; then

              echo "ERROR: format-patch failed for $SHA"

              printf '%s | %s | format-patch failed\n' \
                "$SHA" \
                "$SUBJECT" \
                >> openela-analysis/errors.txt

              rm -f "$PATCH_FILE"

              continue
            fi

            # ------------------------------------------------------
            # Patch applicability test
            # IMPORTANT:
            # This does NOT apply the patch.
            # ------------------------------------------------------
            git apply \
              --check \
              --unsafe-paths \
              "$PATCH_FILE" \
              > /tmp/openela-apply-check.log 2>&1

            APPLY_RC=$?

            if [ "$APPLY_RC" -eq 0 ]; then
              APPLY_STATUS="CLEAN_APPLY"
            else
              APPLY_STATUS="CONFLICT"
            fi

            # ------------------------------------------------------
            # Check paths
            # ------------------------------------------------------
            PATH_STATUS="OK"

            while IFS=$'\t' read -r STATUS FILE; do

              [ -z "$FILE" ] && continue

              if [ ! -e "$FILE" ]; then
                PATH_STATUS="PATH_MISSING"
                break
              fi

            done < <(
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" 2>/dev/null
            )

            # ------------------------------------------------------
            # Write missing record
            # ------------------------------------------------------
            printf '%s | %s | %s | %s | %s\n' \
              "$SHA" \
              "$DATE" \
              "$SUBSYSTEM" \
              "$APPLY_STATUS" \
              "$SUBJECT" \
              >> openela-analysis/missing.txt

            # ------------------------------------------------------
            # Write detailed report
            # ------------------------------------------------------
            cat >> "$REPORT" <<EOF

          ---

          ## $INDEX_PADDED — $SHA

          - Subject: $SUBJECT
          - Date: $DATE
          - Author: $AUTHOR
          - Subsystem: $SUBSYSTEM
          - Apply check: $APPLY_STATUS
          - Path check: $PATH_STATUS
          - Patch: \`missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch\`

          ### Changed files

          \`\`\`
          $FILES
          \`\`\`

          EOF

            if [ "$APPLY_RC" -ne 0 ]; then

              cat >> "$REPORT" <<EOF

          ### Apply check output

          \`\`\`
          $(cat /tmp/openela-apply-check.log)
          \`\`\`

          EOF

            fi

          done < "$COMMITS_FILE"

      # ============================================================
      # 10. GENERATE SUMMARY FILES
      # ============================================================
      - name: Generate Summary
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT=$(grep -c . \
            openela-analysis/missing.txt 2>/dev/null || true)

          PRESENT_COUNT=$(grep -c . \
            openela-analysis/already-present.txt 2>/dev/null || true)

          ERROR_COUNT=$(grep -c . \
            openela-analysis/errors.txt 2>/dev/null || true)

          SKIPPED_COUNT=$(grep -c . \
            openela-analysis/skipped.txt 2>/dev/null || true)

          cat > openela-analysis/metadata.txt <<EOF
          OpenELA Comparison Metadata
          ============================

          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Target HEAD:
          $TARGET

          Target kernel version:
          $TARGET_VERSION

          OpenELA repository:
          https://github.com/openela/kernel-lts

          OpenELA tag:
          $OPENELA_TAG

          OpenELA commit:
          $OPENELA

          Common ancestor:
          $MERGE_BASE

          Total OpenELA commits analyzed:
          $OPENELA_COMMIT_COUNT

          Missing commits:
          $MISSING_COUNT

          Already present/equivalent:
          $PRESENT_COUNT

          Errors:
          $ERROR_COUNT

          Skipped:
          $SKIPPED_COUNT

          Order:
          OLDEST -> NEWEST

          Actions performed:
          ANALYSIS ONLY

          Cherry-pick:
          NO

          Commit:
          NO

          Push:
          NO

          Reset:
          NO

          Source modification:
          NO
          EOF

          cat > openela-analysis/README.txt <<EOF
          OpenELA 4.14.357 Comparison
          ===========================

          Reference:
          v4.14.357-openela

          This artifact contains commits from OpenELA that are not
          patch-equivalent to the target kernel branch.

          Patches are numbered from oldest to newest.

          No patches were applied.

          No source files were modified.

          No commits were created.

          No push was performed.
          EOF

          echo
          echo "============================================================"
          echo "FINAL SUMMARY"
          echo "============================================================"
          echo "OpenELA tag       : $OPENELA_TAG"
          echo "OpenELA commit    : $OPENELA"
          echo "Target HEAD       : $TARGET"
          echo "Target version    : $TARGET_VERSION"
          echo "Common ancestor   : $MERGE_BASE"
          echo "Analyzed          : $OPENELA_COMMIT_COUNT"
          echo "Missing           : $MISSING_COUNT"
          echo "Already present   : $PRESENT_COUNT"
          echo "Errors            : $ERROR_COUNT"
          echo "Skipped           : $SKIPPED_COUNT"
          echo "============================================================"

      # ============================================================
      # 11. GITHUB STEP SUMMARY
      # ============================================================
      - name: GitHub Summary
        if: always()
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT=$(grep -c . \
            openela-analysis/missing.txt 2>/dev/null || true)

          PRESENT_COUNT=$(grep -c . \
            openela-analysis/already-present.txt 2>/dev/null || true)

          ERROR_COUNT=$(grep -c . \
            openela-analysis/errors.txt 2>/dev/null || true)

          {
            echo "## OpenELA 4.14.357 Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Target branch | \`16\` |"
            echo "| Target version | \`$TARGET_VERSION\` |"
            echo "| OpenELA tag | \`$OPENELA_TAG\` |"
            echo "| OpenELA commit | \`$OPENELA\` |"
            echo "| Common ancestor | \`$MERGE_BASE\` |"
            echo "| Commits analyzed | $OPENELA_COMMIT_COUNT |"
            echo "| Missing | $MISSING_COUNT |"
            echo "| Already present/equivalent | $PRESENT_COUNT |"
            echo "| Errors | $ERROR_COUNT |"
            echo
            echo "### Important"
            echo
            echo "This workflow only analyzes and exports patches."
            echo
            echo "- No cherry-pick"
            echo "- No commit"
            echo "- No push"
            echo "- No reset"
            echo "- No source modification"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 12. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload OpenELA Analysis
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openela-4.14.357-analysis
          path: openela-analysis/
          if-no-files-found: warn
          retention-days: 30
