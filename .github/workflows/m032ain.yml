name: Compare Kernel With OpenELA 4.14.357

on:
  workflow_dispatch:

jobs:
  compare-openela:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 16
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURATION
      # ============================================================
      - name: Configure OpenELA
        continue-on-error: true
        run: |
          set +e

          OPENELA_REPO="https://github.com/openela/kernel-lts.git"
          OPENELA_TAG="v4.14.357-openela"

          echo "OPENELA_REPO=$OPENELA_REPO" >> "$GITHUB_ENV"
          echo "OPENELA_TAG=$OPENELA_TAG" >> "$GITHUB_ENV"

          echo "============================================================"
          echo " OPENELA 4.14.357 COMPARISON"
          echo "============================================================"
          echo "Target branch : 16"
          echo "OpenELA tag   : $OPENELA_TAG"
          echo "============================================================"

      # ============================================================
      # 3. FETCH OPENELA
      # ============================================================
      - name: Fetch OpenELA
        continue-on-error: true
        run: |
          set +e

          git remote remove openela 2>/dev/null || true
          git remote add openela "$OPENELA_REPO"

          git fetch --no-tags openela \
            "refs/tags/$OPENELA_TAG:refs/tags/$OPENELA_TAG"

          RC=$?

          if [ "$RC" -ne 0 ]; then
            echo "ERROR: Failed to fetch OpenELA."
            exit 0
          fi

          OPENELA_COMMIT="$(git rev-parse "$OPENELA_TAG")"

          echo "OPENELA_COMMIT=$OPENELA_COMMIT" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " OPENELA TAG"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$OPENELA_TAG"

      # ============================================================
      # 4. TARGET INFORMATION
      # ============================================================
      - name: Detect Target
        continue-on-error: true
        run: |
          set +e

          TARGET="$(git rev-parse HEAD)"

          TARGET_VERSION="$(
            make -s kernelversion 2>/dev/null || true
          )"

          [ -n "$TARGET_VERSION" ] || TARGET_VERSION="unknown"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "TARGET_VERSION=$TARGET_VERSION" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " TARGET"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$TARGET"

          echo
          echo "Kernel version: $TARGET_VERSION"

      # ============================================================
      # 5. VERIFY OPENELA TAG
      # ============================================================
      - name: Verify OpenELA Tag
        continue-on-error: true
        run: |
          set +e

          echo
          echo "============================================================"
          echo " VERIFY OPENELA TAG"
          echo "============================================================"

          echo "Tag:"
          echo "$OPENELA_TAG"

          echo
          echo "Commit:"
          git rev-parse "$OPENELA_TAG"

          echo
          echo "Commit subject:"
          git show -s --format='%s' "$OPENELA_TAG"

      # ============================================================
      # 6. FIND COMMON ANCESTOR
      # ============================================================
      - name: Find Common Ancestor
        continue-on-error: true
        run: |
          set +e

          MERGE_BASE="$(
            git merge-base \
              "$TARGET" \
              "$OPENELA_COMMIT"
          )"

          if [ -z "$MERGE_BASE" ]; then
            echo "ERROR: Common ancestor not found."
            exit 0
          fi

          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " COMMON ANCESTOR"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$MERGE_BASE"

      # ============================================================
      # 7. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare Analysis
        continue-on-error: true
        run: |
          set +e

          rm -rf openela-analysis

          mkdir -p \
            openela-analysis/missing-patches \
            openela-analysis/logs \
            openela-analysis/patch-id

          touch \
            openela-analysis/missing.txt \
            openela-analysis/already-present.txt \
            openela-analysis/errors.txt \
            openela-analysis/skipped.txt

      # ============================================================
      # 8. DETERMINE OPENELA HISTORY TO ANALYZE
      #
      # IMPORTANT:
      #
      # v4.14.357-openela itself is the common point.
      #
      # Therefore we analyze the OpenELA history leading INTO
      # that point instead of using:
      #
      #     MERGE_BASE..OPENELA_TAG
      #
      # which correctly returns 0.
      # ============================================================
      - name: Collect OpenELA History
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"

          : > "$COMMITS_FILE"

          echo
          echo "============================================================"
          echo " OPENELA HISTORY"
          echo "============================================================"

          echo "OpenELA endpoint:"
          echo "$OPENELA_COMMIT"

          echo
          echo "Common ancestor:"
          echo "$MERGE_BASE"

          # --------------------------------------------------------
          # Find the previous OpenELA release.
          #
          # This gives us the release-to-release history leading
          # into v4.14.357-openela.
          # --------------------------------------------------------

          PREVIOUS_TAG="$(
            git tag -l 'v4.14.*-openela' |
            grep -v "^$OPENELA_TAG$" |
            sort -V |
            tail -n 1
          )"

          # The local tag list may not contain all OpenELA tags
          # because fetch was limited to the requested tag.
          #
          # Therefore fetch the release tags explicitly.
          git fetch openela \
            'refs/tags/v4.14.*-openela:refs/tags/v4.14.*-openela' \
            2>/dev/null || true

          PREVIOUS_TAG="$(
            git tag -l 'v4.14.*-openela' |
            grep -v "^$OPENELA_TAG$" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "ERROR: Previous OpenELA tag could not be determined."

            printf '%s\n' \
              "Previous OpenELA tag unavailable" \
              >> openela-analysis/errors.txt

            exit 0
          fi

          PREVIOUS_COMMIT="$(
            git rev-parse "$PREVIOUS_TAG"
          )"

          echo "Previous OpenELA tag:"
          echo "$PREVIOUS_TAG"

          echo
          echo "Previous OpenELA commit:"
          echo "$PREVIOUS_COMMIT"

          echo
          echo "============================================================"
          echo " COMMITS TO ANALYZE"
          echo "============================================================"

          git rev-list \
            --reverse \
            "$PREVIOUS_COMMIT..$OPENELA_COMMIT" \
            > "$COMMITS_FILE"

          TOTAL="$(
            wc -l < "$COMMITS_FILE"
          )"

          echo "Total commits: $TOTAL"
          echo "Order: OLDEST -> NEWEST"
          echo "Merge commits: INCLUDED"

          echo "OPENELA_COMMIT_COUNT=$TOTAL" >> "$GITHUB_ENV"
          echo "OPENELA_PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "OPENELA_PREVIOUS_COMMIT=$PREVIOUS_COMMIT" >> "$GITHUB_ENV"

          echo

          nl -ba "$COMMITS_FILE"

      # ============================================================
      # 9. BUILD TARGET PATCH-ID DATABASE
      # ============================================================
      - name: Build Target Patch-ID Database
        continue-on-error: true
        run: |
          set +e

          TARGET_PATCH_IDS="openela-analysis/patch-id/target.patchids"

          : > "$TARGET_PATCH_IDS"

          echo
          echo "============================================================"
          echo " BUILD TARGET PATCH-ID DATABASE"
          echo "============================================================"

          git log \
            --all \
            --format='%H' |
          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            # ------------------------------------------------------
            # NORMAL COMMIT
            # ------------------------------------------------------
            if [ "$PARENT_COUNT" -eq 1 ]; then

              PATCH_ID="$(
                git diff \
                  "$SHA^" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

              if [ -n "$PATCH_ID" ]; then
                echo "$PATCH_ID $SHA" >> "$TARGET_PATCH_IDS"
              fi

            # ------------------------------------------------------
            # MERGE COMMIT
            #
            # Compare against FIRST parent.
            # ------------------------------------------------------
            elif [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" |
                awk '{print $1}'
              )"

              PATCH_ID="$(
                git diff \
                  "$FIRST_PARENT" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

              if [ -n "$PATCH_ID" ]; then
                echo "$PATCH_ID $SHA" >> "$TARGET_PATCH_IDS"
              fi

            fi

          done

          sort -u \
            "$TARGET_PATCH_IDS" \
            -o "$TARGET_PATCH_IDS"

          TARGET_PATCH_COUNT="$(
            wc -l < "$TARGET_PATCH_IDS"
          )"

          echo "TARGET_PATCH_ID_COUNT=$TARGET_PATCH_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Target patch IDs: $TARGET_PATCH_COUNT"

      # ============================================================
      # 10. ANALYZE OPENELA COMMITS
      # ============================================================
      - name: Analyze OpenELA Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="openela-analysis/openela-commits.txt"
          TARGET_PATCH_IDS="openela-analysis/patch-id/target.patchids"
          REPORT="openela-analysis/report.md"

          cat > "$REPORT" <<EOF
          # OpenELA 4.14.357 Comparison

          Target:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          Target HEAD:
          $TARGET

          Target kernel version:
          $TARGET_VERSION

          OpenELA:
          openela/kernel-lts

          OpenELA tag:
          $OPENELA_TAG

          OpenELA commit:
          $OPENELA_COMMIT

          Previous OpenELA tag:
          $OPENELA_PREVIOUS_TAG

          Previous OpenELA commit:
          $OPENELA_PREVIOUS_COMMIT

          Common ancestor:
          $MERGE_BASE

          Order:
          OLDEST -> NEWEST

          Merge commits:
          INCLUDED

          Analysis only:
          YES

          Source modification:
          NO

          EOF

          INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            INDEX=$((INDEX + 1))

            echo
            echo "============================================================"
            echo " OPENELA COMMIT $INDEX / $OPENELA_COMMIT_COUNT"
            echo "============================================================"

            SUBJECT="$(
              git show -s \
                --format='%s' \
                "$SHA" 2>/dev/null
            )"

            DATE="$(
              git show -s \
                --format='%ad' \
                --date=iso-strict \
                "$SHA" 2>/dev/null
            )"

            AUTHOR="$(
              git show -s \
                --format='%an <%ae>' \
                "$SHA" 2>/dev/null
            )"

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            if [ "$PARENT_COUNT" -gt 1 ]; then
              COMMIT_TYPE="MERGE"
            elif [ "$PARENT_COUNT" -eq 1 ]; then
              COMMIT_TYPE="NORMAL"
            else
              COMMIT_TYPE="ROOT"
            fi

            FILES="$(
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" 2>/dev/null
            )"

            SUBSYSTEM="OTHER"

            if echo "$FILES" | grep -q 'arch/'; then
              SUBSYSTEM="ARCH"
            elif echo "$FILES" | grep -q 'drivers/'; then
              SUBSYSTEM="DRIVERS"
            elif echo "$FILES" | grep -q 'fs/'; then
              SUBSYSTEM="FILESYSTEM"
            elif echo "$FILES" | grep -q 'mm/'; then
              SUBSYSTEM="MM"
            elif echo "$FILES" | grep -q 'net/'; then
              SUBSYSTEM="NETWORK"
            elif echo "$FILES" | grep -q 'kernel/'; then
              SUBSYSTEM="KERNEL"
            elif echo "$FILES" | grep -q 'include/'; then
              SUBSYSTEM="INCLUDE"
            elif echo "$FILES" | grep -q 'security/'; then
              SUBSYSTEM="SECURITY"
            elif echo "$FILES" | grep -q 'crypto/'; then
              SUBSYSTEM="CRYPTO"
            elif echo "$FILES" | grep -q 'block/'; then
              SUBSYSTEM="BLOCK"
            elif echo "$FILES" | grep -q 'ipc/'; then
              SUBSYSTEM="IPC"
            elif echo "$FILES" | grep -q 'scripts/'; then
              SUBSYSTEM="SCRIPTS"
            fi

            # ======================================================
            # PATCH-ID
            # ======================================================

            PATCH_ID=""

            if [ "$PARENT_COUNT" -eq 1 ]; then

              PATCH_ID="$(
                git diff \
                  "$SHA^" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            elif [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" |
                awk '{print $1}'
              )"

              PATCH_ID="$(
                git diff \
                  "$FIRST_PARENT" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            fi

            echo "SHA       : $SHA"
            echo "Subject   : $SUBJECT"
            echo "Type      : $COMMIT_TYPE"
            echo "Patch ID  : $PATCH_ID"

            # ======================================================
            # EQUIVALENCE CHECK
            # ======================================================

            MATCH_SHA=""

            if [ -n "$PATCH_ID" ]; then

              MATCH_SHA="$(
                awk \
                  -v id="$PATCH_ID" \
                  '$1 == id {print $2; exit}' \
                  "$TARGET_PATCH_IDS"
              )"

            fi

            if [ -n "$MATCH_SHA" ]; then

              echo "STATUS    : ALREADY PRESENT / EQUIVALENT"
              echo "TARGET SHA: $MATCH_SHA"

              printf '%s | %s | %s | equivalent=%s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                "$MATCH_SHA" \
                >> openela-analysis/already-present.txt

              continue

            fi

            # ======================================================
            # MISSING COMMIT
            # ======================================================

            INDEX_PADDED="$(
              printf "%04d" "$INDEX"
            )"

            SAFE_SUBJECT="$(
              echo "$SUBJECT" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//;s/-$//' |
              cut -c1-100
            )"

            [ -n "$SAFE_SUBJECT" ] || SAFE_SUBJECT="openela-commit"

            PATCH_FILE="openela-analysis/missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch"

            echo "STATUS    : MISSING"

            # ======================================================
            # GENERATE PATCH
            # ======================================================

            if [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" |
                awk '{print $1}'
              )"

              git diff \
                --binary \
                --full-index \
                "$FIRST_PARENT" \
                "$SHA" \
                > "$PATCH_FILE"

              PATCH_RC=$?

              if [ "$PATCH_RC" -eq 0 ]; then

                HEADER="$(
                  git show \
                    --format=email \
                    --no-patch \
                    "$SHA" 2>/dev/null
                )"

                if [ -n "$HEADER" ]; then

                  {
                    echo "$HEADER"
                    echo
                    cat "$PATCH_FILE"
                  } > "${PATCH_FILE}.tmp"

                  mv \
                    "${PATCH_FILE}.tmp" \
                    "$PATCH_FILE"

                fi

              fi

            else

              git format-patch \
                --stdout \
                --full-index \
                --binary \
                -1 "$SHA" \
                > "$PATCH_FILE"

              PATCH_RC=$?

            fi

            if [ "$PATCH_RC" -ne 0 ]; then

              echo "ERROR: Patch generation failed."

              printf '%s | %s | patch generation failed | %s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                >> openela-analysis/errors.txt

              rm -f "$PATCH_FILE"

              continue
            fi

            # ======================================================
            # PATCH CHECK
            #
            # Does not apply the patch.
            # ======================================================

            APPLY_LOG="openela-analysis/logs/${INDEX_PADDED}-apply.log"

            git apply \
              --check \
              "$PATCH_FILE" \
              > "$APPLY_LOG" \
              2>&1

            APPLY_RC=$?

            if [ "$APPLY_RC" -eq 0 ]; then
              APPLY_STATUS="CLEAN_APPLY"
            else
              APPLY_STATUS="CONFLICT"
            fi

            # ======================================================
            # RECORD MISSING
            # ======================================================

            printf '%s | %s | %s | %s | %s | %s | %s\n' \
              "$SHA" \
              "$DATE" \
              "$COMMIT_TYPE" \
              "$SUBSYSTEM" \
              "$APPLY_STATUS" \
              "$PATCH_ID" \
              "$SUBJECT" \
              >> openela-analysis/missing.txt

            # ======================================================
            # REPORT
            # ======================================================

            cat >> "$REPORT" <<EOF

          ---

          ## $INDEX_PADDED — $SHA

          **Subject**

          $SUBJECT

          **Date**

          $DATE

          **Author**

          $AUTHOR

          **Type**

          $COMMIT_TYPE

          **Subsystem**

          $SUBSYSTEM

          **Patch ID**

          $PATCH_ID

          **Apply check**

          $APPLY_STATUS

          **Patch**

          \`missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch\`

          ### Changed files

          \`\`\`
          $FILES
          \`\`\`

          EOF

          done < "$COMMITS_FILE"

      # ============================================================
      # 11. FINAL METADATA
      # ============================================================
      - name: Generate Final Metadata
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
              openela-analysis/missing.txt \
              2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
              openela-analysis/already-present.txt \
              2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
              openela-analysis/errors.txt \
              2>/dev/null || true
          )"

          SKIPPED_COUNT="$(
            grep -c . \
              openela-analysis/skipped.txt \
              2>/dev/null || true
          )"

          cat > openela-analysis/metadata.txt <<EOF
          OpenELA Comparison Metadata
          ============================

          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Target HEAD:
          $TARGET

          Target kernel version:
          $TARGET_VERSION

          OpenELA repository:
          https://github.com/openela/kernel-lts

          OpenELA tag:
          $OPENELA_TAG

          OpenELA commit:
          $OPENELA_COMMIT

          Previous OpenELA tag:
          $OPENELA_PREVIOUS_TAG

          Previous OpenELA commit:
          $OPENELA_PREVIOUS_COMMIT

          Common ancestor:
          $MERGE_BASE

          Total OpenELA commits analyzed:
          $OPENELA_COMMIT_COUNT

          Missing commits:
          $MISSING_COUNT

          Already present/equivalent:
          $PRESENT_COUNT

          Errors:
          $ERROR_COUNT

          Skipped:
          $SKIPPED_COUNT

          Order:
          OLDEST -> NEWEST

          Merge commits:
          INCLUDED

          Actions performed:
          ANALYSIS ONLY

          Cherry-pick:
          NO

          Commit:
          NO

          Push:
          NO

          Reset:
          NO

          Source modification:
          NO
          EOF

          cat > openela-analysis/README.txt <<EOF
          OpenELA 4.14.357 Comparison
          ===========================

          Target:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          OpenELA:
          openela/kernel-lts

          Tag:
          $OPENELA_TAG

          Previous OpenELA tag:
          $OPENELA_PREVIOUS_TAG

          The comparison analyzes the OpenELA history leading
          into v4.14.357-openela.

          Merge commits are included.

          Commits are processed oldest to newest.

          Patch-ID equivalence is used to detect changes already
          present in the target tree.

          Missing commits are exported individually.

          No patch was applied.

          No source files were modified.

          No commit was created.

          No push was performed.

          No reset was performed.
          EOF

          echo
          echo "============================================================"
          echo " FINAL OPENELA RESULT"
          echo "============================================================"
          echo "Target HEAD       : $TARGET"
          echo "Kernel version    : $TARGET_VERSION"
          echo "OpenELA tag       : $OPENELA_TAG"
          echo "Previous tag      : $OPENELA_PREVIOUS_TAG"
          echo "Analyzed          : $OPENELA_COMMIT_COUNT"
          echo "Missing           : $MISSING_COUNT"
          echo "Already present   : $PRESENT_COUNT"
          echo "Errors            : $ERROR_COUNT"
          echo "Skipped           : $SKIPPED_COUNT"
          echo "============================================================"

      # ============================================================
      # 12. GITHUB SUMMARY
      # ============================================================
      - name: GitHub Summary
        if: always()
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
              openela-analysis/missing.txt \
              2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
              openela-analysis/already-present.txt \
              2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
              openela-analysis/errors.txt \
              2>/dev/null || true
          )"

          {
            echo "## OpenELA 4.14.357 Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Target branch | \`16\` |"
            echo "| Target version | \`$TARGET_VERSION\` |"
            echo "| OpenELA tag | \`$OPENELA_TAG\` |"
            echo "| Previous OpenELA tag | \`$OPENELA_PREVIOUS_TAG\` |"
            echo "| Commits analyzed | $OPENELA_COMMIT_COUNT |"
            echo "| Missing | $MISSING_COUNT |"
            echo "| Already present/equivalent | $PRESENT_COUNT |"
            echo "| Errors | $ERROR_COUNT |"
            echo
            echo "### Safety"
            echo
            echo "- Analysis only"
            echo "- No cherry-pick"
            echo "- No commit"
            echo "- No push"
            echo "- No reset"
            echo "- No source modification"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 13. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload OpenELA Analysis
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openela-4.14.357-analysis
          path: openela-analysis/
          if-no-files-found: warn
          retention-days: 30
