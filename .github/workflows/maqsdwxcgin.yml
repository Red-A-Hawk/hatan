name: Create Independent xxx-19 Repository

on:
  workflow_dispatch:

jobs:
  create-repository:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout c2faa674
        uses: actions/checkout@v4
        with:
          ref: c2faa6748d46e4badcebfce586b09d86d1687010
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit
        run: |
          set -e

          COMMIT="c2faa6748d46e4badcebfce586b09d86d1687010"

          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Commit information:"
          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso \
            "$COMMIT"

          test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: Create local branch
        run: git checkout -b 19

      - name: Create independent repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          REPO="Red-A-Hawk/xxx-19"

          echo "Creating repository:"
          echo "$REPO"

          gh repo create "$REPO" \
            --public \
            --source=. \
            --remote=origin-new \
            --push

          echo
          echo "Repository created successfully:"
          gh repo view "$REPO" --json nameWithOwner,url -q '.nameWithOwner + " | " + .url'
