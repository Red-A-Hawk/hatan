name: Test Real AArch64 MLGO Advisor r547379

on:
  workflow_dispatch:

jobs:
  test-mlgo-advisor:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Clang r547379
        run: |
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang-r547379

      - name: Verify Clang
        run: |
          set -e

          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          clang-r547379/bin/clang-20 --version

      - name: Create AArch64 Test Source
        run: |
          set -e

          cat > /tmp/mlgo_test.c <<'EOF'
          __attribute__((noinline))
          long mlgo_test(
              long a, long b, long c, long d,
              long e, long f, long g, long h,
              long i, long j, long k, long l)
          {
              long x0 = a + b;
              long x1 = c + d;
              long x2 = e + f;
              long x3 = g + h;
              long x4 = i + j;
              long x5 = k + l;

              long y0 = x0 * x1;
              long y1 = x2 * x3;
              long y2 = x4 * x5;

              long z0 = y0 + y1;
              long z1 = y2 + x0;
              long z2 = z0 * z1;

              return z2 + y0 + y1 + y2 + x1 + x2 + x3;
          }

          __attribute__((noinline))
          long mlgo_test2(long a, long b, long c, long d)
          {
              long r0 = a + b;
              long r1 = b + c;
              long r2 = c + d;
              long r3 = d + a;

              long r4 = r0 * r1;
              long r5 = r2 * r3;
              long r6 = r4 + r5;

              return r6 + r0 + r1 + r2 + r3;
          }
          EOF

          echo "========================================"
          echo "AARCH64 TEST SOURCE"
          echo "========================================"

          cat /tmp/mlgo_test.c

      - name: Real AArch64 MLGO Advisor Compilation
        run: |
          set -e

          echo "========================================"
          echo "REAL AARCH64 MLGO ADVISOR TEST"
          echo "========================================"

          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_test.s \
            -mllvm -regalloc-enable-advisor=release \
            2>&1 | tee /tmp/mlgo-compile.log

          echo
          echo "----- Verify assembly was generated -----"

          test -s /tmp/mlgo_test.s

          echo "[OK] AArch64 assembly generated"

      - name: MLGO Advisor Diagnostic
        run: |
          set -e

          echo "========================================"
          echo "MLGO ADVISOR DIAGNOSTIC"
          echo "========================================"

          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_debug.s \
            -mllvm -regalloc-enable-advisor=release \
            -mllvm -debug \
            2>&1 | tee /tmp/mlgo-advisor-debug.log

          echo
          echo "----- Verify debug assembly -----"

          test -s /tmp/mlgo_debug.s

          echo "[OK] Debug AArch64 assembly generated"

      - name: Analyze MLGO Advisor Activity
        run: |
          echo "========================================"
          echo "MLGO ADVISOR ACTIVITY"
          echo "========================================"

          echo
          echo "----- Relevant messages -----"

          grep -Ein \
            'mlgo|regalloc|advisor|model|tflite|tensorflow|evict|priority|fallback|default|release' \
            /tmp/mlgo-compile.log \
            /tmp/mlgo-advisor-debug.log \
            || true

          echo
          echo "========================================"
          echo "MODEL LOADING INDICATORS"
          echo "========================================"

          if grep -Eiq \
            'model|tflite|tensorflow|saved.model|fingerprint|policy_specs' \
            /tmp/mlgo-compile.log \
            /tmp/mlgo-advisor-debug.log; then

            echo "[FOUND] Model-related diagnostic activity detected"

          else

            echo "[NOT FOUND] No explicit model-loading message detected"

          fi

          echo
          echo "========================================"
          echo "REGALLOC ADVISOR INDICATORS"
          echo "========================================"

          if grep -Eiq \
            'regalloc|advisor|evict|priority' \
            /tmp/mlgo-compile.log \
            /tmp/mlgo-advisor-debug.log; then

            echo "[FOUND] RegAlloc/Advisor diagnostic activity detected"

          else

            echo "[NOT FOUND] No RegAlloc/Advisor diagnostic activity detected"

          fi

      - name: Inspect Generated AArch64 Assembly
        run: |
          set -e

          echo "========================================"
          echo "AARCH64 CODE GENERATION RESULT"
          echo "========================================"

          file /tmp/mlgo_test.s

          echo
          echo "----- Assembly -----"

          cat /tmp/mlgo_test.s

          echo
          echo "----- AArch64 registers -----"

          grep -E \
            '\b(x[0-9]+|w[0-9]+)\b' \
            /tmp/mlgo_test.s \
            | head -100 \
            || true

      - name: Final MLGO Result
        run: |
          echo "========================================"
          echo "FINAL MLGO ADVISOR RESULT"
          echo "========================================"

          echo
          echo "Option:"
          echo "  -mllvm -regalloc-enable-advisor=release"

          echo
          echo "AArch64 backend:"
          if [ -s /tmp/mlgo_test.s ]; then
            echo "  [OK] Executed and generated assembly"
          else
            echo "  [FAIL] No assembly generated"
          fi

          echo
          echo "Model diagnostic:"

          if grep -Eiq \
            'model|tflite|tensorflow|saved.model|fingerprint|policy_specs' \
            /tmp/mlgo-compile.log \
            /tmp/mlgo-advisor-debug.log; then

            echo "  [DETECTED] Model-related activity found"

          else

            echo "  [NOT DETECTED] No explicit model-loading message found"

          fi

          echo
          echo "RegAlloc Advisor diagnostic:"

          if grep -Eiq \
            'regalloc|advisor|evict|priority' \
            /tmp/mlgo-compile.log \
            /tmp/mlgo-advisor-debug.log; then

            echo "  [DETECTED] RegAlloc/Advisor activity found"

          else

            echo "  [NOT DETECTED] No explicit RegAlloc/Advisor activity found"

          fi

      - name: Upload MLGO Diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mlgo-advisor-diagnostic-r547379
          path: |
            /tmp/mlgo_test.c
            /tmp/mlgo_test.s
            /tmp/mlgo_debug.s
            /tmp/mlgo-compile.log
            /tmp/mlgo-advisor-debug.log
