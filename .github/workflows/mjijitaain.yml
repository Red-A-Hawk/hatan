name: Test Real AArch64 MLGO RegAlloc vvvv

on:
  workflow_dispatch:

jobs:
  test-mlgo-regalloc:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Clang r547379
        run: |
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang-r547379

      - name: Verify Clang
        run: |
          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          clang-r547379/bin/clang-20 --version

      - name: Create AArch64 Test Source
        run: |
          cat > /tmp/mlgo_test.c <<'EOF'
          __attribute__((noinline))
          long mlgo_test(
              long a, long b, long c, long d,
              long e, long f, long g, long h,
              long i, long j, long k, long l)
          {
              long x0 = a + b;
              long x1 = c + d;
              long x2 = e + f;
              long x3 = g + h;
              long x4 = i + j;
              long x5 = k + l;

              long y0 = x0 * x1;
              long y1 = x2 * x3;
              long y2 = x4 * x5;

              long z0 = y0 + y1;
              long z1 = y2 + x0;
              long z2 = z0 * z1;

              return z2 + y0 + y1 + y2 + x1 + x2 + x3;
          }

          __attribute__((noinline))
          long mlgo_test2(long a, long b, long c, long d)
          {
              long r0 = a + b;
              long r1 = b + c;
              long r2 = c + d;
              long r3 = d + a;

              long r4 = r0 * r1;
              long r5 = r2 * r3;
              long r6 = r4 + r5;

              return r6 + r0 + r1 + r2 + r3;
          }
          EOF

          echo "========================================"
          echo "AARCH64 TEST SOURCE"
          echo "========================================"

          cat /tmp/mlgo_test.c

      - name: Real AArch64 RegAlloc MLGO Diagnostic
        run: |
          echo "========================================"
          echo "REAL AARCH64 MLGO REGALLOC TEST"
          echo "========================================"

          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_test.s \
            -mllvm -regalloc-evict=release \
            -mllvm -debug-only=regalloc-evict \
            2>&1 | tee /tmp/mlgo-regalloc.log

      - name: Search MLGO Diagnostic Output
        run: |
          echo "========================================"
          echo "MLGO / REGALLOC DIAGNOSTIC OUTPUT"
          echo "========================================"

          echo
          echo "----- Relevant diagnostic lines -----"

          grep -Ei \
            'mlgo|regalloc|evict|advisor|model|tflite|tensorflow|policy|release|fallback|default' \
            /tmp/mlgo-regalloc.log \
            || true

          echo
          echo "----- Full diagnostic log -----"

          cat /tmp/mlgo-regalloc.log

      - name: Verify AArch64 Code Generation
        run: |
          echo "========================================"
          echo "AARCH64 CODE GENERATION"
          echo "========================================"

          file /tmp/mlgo_test.s

          echo
          echo "----- Assembly -----"

          cat /tmp/mlgo_test.s

          echo
          echo "----- Verify AArch64 registers -----"

          grep -E \
            'x[0-9]+|w[0-9]+' \
            /tmp/mlgo_test.s \
            | head -100 \
            || true

      - name: Real MLGO Advisor Diagnostic With LLVM Debug
        run: |
          echo "========================================"
          echo "MLGO ADVISOR DEBUG"
          echo "========================================"

          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_advisor.s \
            -mllvm -regalloc-evict=release \
            -mllvm -debug-only=regalloc-evict \
            -mllvm -debug \
            2>&1 | tee /tmp/mlgo-advisor-debug.log

      - name: Analyze Model Loading Attempt
        run: |
          echo "========================================"
          echo "MODEL LOADING ANALYSIS"
          echo "========================================"

          echo
          echo "----- Model / Advisor / Fallback messages -----"

          grep -Ein \
            'model|mlgo|advisor|eviction|evict|tensorflow|tflite|saved.model|policy|fingerprint|could not be created|using default|fallback' \
            /tmp/mlgo-advisor-debug.log \
            || true

          echo
          echo "========================================"
          echo "FINAL INTERPRETATION"
          echo "========================================"

          if grep -Eiq \
            'model|tflite|tensorflow|saved.model|policy|fingerprint' \
            /tmp/mlgo-advisor-debug.log; then

            echo "[MLGO] MODEL-RELATED ACTIVITY DETECTED"

          elif grep -Eiq \
            'eviction advisor|regalloc eviction|regalloc-evict' \
            /tmp/mlgo-advisor-debug.log; then

            echo "[MLGO] REGALLOC EVICTION ADVISOR ACTIVITY DETECTED"
            echo "[MLGO] NO EXPLICIT MODEL LOAD MESSAGE DETECTED"

          else

            echo "[MLGO] NO MLGO/REGALLOC DIAGNOSTIC ACTIVITY DETECTED"

          fi

      - name: Upload MLGO Diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mlgo-regalloc-diagnostic-r547379
          path: |
            /tmp/mlgo_test.c
            /tmp/mlgo_test.s
            /tmp/mlgo_advisor.s
            /tmp/mlgo-regalloc.log
            /tmp/mlgo-advisor-debug.log
