name: Test MLGO Model A B C r547379

on:
workflow_dispatch:

jobs:
test-mlgo-model:
runs-on: ubuntu-22.04

steps:
  - name: Download Clang r547379
    run: |
      git clone --depth=1 \
        https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
        clang-r547379

  - name: Verify Clang
    run: |
      echo "========================================"
      echo "CLANG VERSION"
      echo "========================================"
      clang-r547379/bin/clang-20 --version

      echo
      echo "========================================"
      echo "CLANG-20 FILE"
      echo "========================================"
      ls -lh clang-r547379/bin/clang-20
      file clang-r547379/bin/clang-20

  - name: A - Search External MLGO Models
    run: |
      echo "========================================"
      echo "A - EXTERNAL MLGO MODEL SEARCH"
      echo "========================================"

      find clang-r547379 \
        -type f \
        \
          -iname "model.tflite" \
          -o -iname "saved_model.pb" \
          -o -iname "fingerprint.pb" \
          -o -iname "policy_specs.pbtxt" \
          -o -iname "*.tflite" \
        \
        -print | tee /tmp/mlgo-model-files.txt

      echo
      echo "----- MLGO directories -----"

      find clang-r547379 \
        -type d \
        \
          -iname "*mlgo*" \
          -o -iname "*regalloc*evict*" \
          -o -iname "*inlining*" \
        \
        -print | tee /tmp/mlgo-model-dirs.txt

      echo
      echo "----- MLGO paths -----"

      find clang-r547379 -print \
        | grep -Ei \
          'mlgo|regalloc.*evict|model\.tflite|saved_model|fingerprint|policy_specs' \
        | tee /tmp/mlgo-model-paths.txt \
        || true

      echo
      echo "----- A RESULT -----"

      if [ -s /tmp/mlgo-model-files.txt ] || [ -s /tmp/mlgo-model-dirs.txt ]; then
        echo "[A] EXTERNAL MLGO MODEL MATERIAL FOUND"
      else
        echo "[A] NO EXTERNAL MLGO MODEL FOUND"
      fi

  - name: B - Search Embedded MLGO Model
    run: |
      echo "========================================"
      echo "B - EMBEDDED MLGO MODEL SEARCH"
      echo "========================================"

      mkdir -p /tmp/mlgo-binary-scan

      find clang-r547379/bin \
        -type f \
        -perm /111 \
        -print \
        | sort \
        > /tmp/mlgo-binary-list.txt

      while IFS= read -r BIN; do
        echo
        echo "----------------------------------------"
        echo "$BIN"
        echo "----------------------------------------"

        SAFE_NAME=$(echo "$BIN" | tr '/' '_')

        strings -a "$BIN" \
          > "/tmp/mlgo-binary-scan/${SAFE_NAME}.strings" \
          2>/dev/null || true

        grep -Ei \
          'regalloc-evict-aosp|model\.tflite|saved_model\.pb|fingerprint\.pb|policy_specs\.pbtxt|mlgo-models|tensorflow|MLGO' \
          "/tmp/mlgo-binary-scan/${SAFE_NAME}.strings" \
          || true

      done < /tmp/mlgo-binary-list.txt

  - name: B - Deep Binary Byte Scan
    run: |
      echo "========================================"
      echo "B - DEEP MLGO BYTE SCAN"
      echo "========================================"

      FOUND=0

      while IFS= read -r BIN; do
        echo
        echo "----------------------------------------"
        echo "$BIN"
        echo "----------------------------------------"

        if grep -aEi \
          'regalloc-evict-aosp|mlgo-models|model\.tflite|saved_model\.pb|policy_specs\.pbtxt|fingerprint\.pb' \
          "$BIN" \
          > /tmp/mlgo-byte-match.txt \
          2>/dev/null; then

          cat /tmp/mlgo-byte-match.txt
          FOUND=1
        fi

      done < /tmp/mlgo-binary-list.txt

      echo
      echo "========================================"
      echo "B RESULT"
      echo "========================================"

      if [ "$FOUND" -eq 1 ]; then
        echo "[B] KNOWN EMBEDDED MLGO MODEL SIGNATURE FOUND"
      else
        echo "[B] NO KNOWN EMBEDDED MLGO MODEL SIGNATURE FOUND"
      fi

  - name: B - ELF Section Analysis
    run: |
      echo "========================================"
      echo "B - ELF SECTION ANALYSIS"
      echo "========================================"

      while IFS= read -r BIN; do
        if file "$BIN" | grep -q ELF; then
          echo
          echo "----------------------------------------"
          echo "$BIN"
          echo "----------------------------------------"

          readelf -S "$BIN" 2>/dev/null \
            | grep -Ei \
              'mlgo|model|tensorflow|tflite|rodata|llvm' \
            || true
        fi
      done < /tmp/mlgo-binary-list.txt

  - name: C - Verify MLGO Runtime
    run: |
      echo "========================================"
      echo "C - MLGO RUNTIME VERIFICATION"
      echo "========================================"

      clang-r547379/bin/clang-20 \
        -target aarch64-linux-gnu \
        -O2 \
        -mllvm -regalloc-evict=release \
        -c /dev/null \
        -x c \
        -o /tmp/mlgo-runtime-test.o

      echo "[C] regalloc-evict=release accepted"

      clang-r547379/bin/clang-20 \
        -target aarch64-linux-gnu \
        -O2 \
        -mllvm -regalloc-enable-advisor=release \
        -c /dev/null \
        -x c \
        -o /tmp/mlgo-advisor-test.o

      echo "[C] regalloc-enable-advisor=release accepted"

  - name: MLGO Advisor Diagnostic
    run: |
      echo "========================================"
      echo "MLGO ADVISOR DIAGNOSTIC"
      echo "========================================"

      clang-r547379/bin/clang-20 \
        -target aarch64-linux-gnu \
        -O2 \
        -mllvm -regalloc-evict=release \
        -c /dev/null \
        -x c \
        -o /tmp/mlgo-debug.o \
        2>&1 | tee /tmp/mlgo-advisor.log

  - name: Final A B C Classification
    run: |
      echo
      echo "=========================================="
      echo "        FINAL MLGO A / B / C RESULT"
      echo "=========================================="

      echo
      echo "A = External MLGO model"
      echo "B = Embedded MLGO model"
      echo "C = MLGO runtime without detectable model"

      echo
      echo "----- A: External model files -----"

      if [ -s /tmp/mlgo-model-files.txt ]; then
        cat /tmp/mlgo-model-files.txt
      else
        echo "NONE"
      fi

      echo
      echo "----- A: External model directories -----"

      if [ -s /tmp/mlgo-model-dirs.txt ]; then
        cat /tmp/mlgo-model-dirs.txt
      else
        echo "NONE"
      fi

      echo
      echo "----- B: Binary model signatures -----"

      grep -RHiE \
        'regalloc-evict-aosp|model\.tflite|saved_model\.pb|policy_specs\.pbtxt|fingerprint\.pb|mlgo-models' \
        /tmp/mlgo-binary-scan \
        2>/dev/null \
        || echo "NONE"

      echo
      echo "=========================================="
      echo "FINAL INTERPRETATION"
      echo "=========================================="

      if [ -s /tmp/mlgo-model-files.txt ] || [ -s /tmp/mlgo-model-dirs.txt ]; then
        echo "[A] EXTERNAL MLGO MODEL DETECTED"

      elif grep -RqiE \
        'regalloc-evict-aosp|model\.tflite|saved_model\.pb|policy_specs\.pbtxt|fingerprint\.pb|mlgo-models' \
        /tmp/mlgo-binary-scan \
        2>/dev/null; then

        echo "[B] EMBEDDED MLGO MODEL SIGNATURE DETECTED"

      else
        echo "[C] MLGO RUNTIME PRESENT, BUT NO DETECTABLE MODEL FOUND"
      fi

  - name: Upload MLGO A B C Diagnostic
    uses: actions/upload-artifact@v4
    with:
      name: mlgo-abc-diagnostic
      path: |
        /tmp/mlgo-model-files.txt
        /tmp/mlgo-model-dirs.txt
        /tmp/mlgo-model-paths.txt
        /tmp/mlgo-binary-list.txt
        /tmp/mlgo-binary-scan
        /tmp/mlgo-advisor.log
