name: Verify Embedded AArch64 MLGO r547379

on:
  workflow_dispatch:

jobs:
  verify-mlgo:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. DOWNLOAD CLANG R547379
      # ============================================================
      - name: Download Clang r547379
        run: |
          set -e
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang-r547379

      # ============================================================
      # 2. VERIFY CLANG
      # ============================================================
      - name: Verify Clang
        run: |
          set -e
          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"
          clang-r547379/bin/clang-20 --version

      # ============================================================
      # 3. INSPECT MLGO SYMBOLS
      # ============================================================
      - name: Inspect MLGO Symbols
        run: |
          set -e
          echo "========================================"
          echo "MLGO SYMBOL INSPECTION"
          echo "========================================"
          BIN="clang-r547379/bin/clang-20"
          echo
          echo "----- RegAlloc MLGO strings -----"
          strings -a "$BIN" \
            | grep -Ei 'RegAllocEvictModel|regalloc.*evict|regalloc.*advisor|MLGO|mlgo' \
            | sort -u \
            | tee /tmp/mlgo-strings.txt \
            || true
          echo
          echo "----- LLVM MLGO symbols -----"
          nm -C "$BIN" 2>/dev/null \
            | grep -Ei 'RegAllocEvictModel|ReleaseModeEvictionAdvisor|MLRegAllocEvictAdvisor|ModelRunner|Embedded' \
            | tee /tmp/mlgo-symbols.txt \
            || true
          echo
          echo "----- Binary sections -----"
          readelf -S "$BIN" 2>/dev/null \
            | grep -Ei 'rodata|data|llvm|mlgo|model|tensorflow|tflite' \
            | tee /tmp/mlgo-sections.txt \
            || true

      # ============================================================
      # 4. CREATE AARCH64 MLGO TEST
      # ============================================================
      - name: Create AArch64 MLGO Test
        run: |
          set -e
          cat > /tmp/mlgo_test.c <<'EOF'
          __attribute__((noinline)) long mlgo_test(
              long a, long b, long c, long d, long e, long f,
              long g, long h, long i, long j, long k, long l) {
            long a0 = a + b;
            long a1 = c + d;
            long a2 = e + f;
            long a3 = g + h;
            long a4 = i + j;
            long a5 = k + l;
            long b0 = a0 * a1;
            long b1 = a2 * a3;
            long b2 = a4 * a5;
            long c0 = b0 + b1;
            long c1 = b2 + a0;
            long c2 = c0 * c1;
            return c2 + b0 + b1 + b2 + a1 + a2 + a3;
          }
          __attribute__((noinline)) long mlgo_test2(
              long a, long b, long c, long d, long e, long f,
              long g, long h) {
            long r0 = a + b;
            long r1 = c + d;
            long r2 = e + f;
            long r3 = g + h;
            long r4 = r0 * r1;
            long r5 = r2 * r3;
            long r6 = r4 + r5;
            return r6 + r0 + r1 + r2 + r3;
          }
          EOF
          echo "========================================"
          echo "AARCH64 TEST SOURCE CREATED"
          echo "========================================"
          wc -l /tmp/mlgo_test.c

      # ============================================================
      # 5. RUN REAL AARCH64 MLGO
      # ============================================================
      - name: Run Real AArch64 MLGO
        run: |
          set -e
          echo "========================================"
          echo "REAL AARCH64 MLGO TEST"
          echo "========================================"
          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_test.s \
            -mllvm -regalloc-enable-advisor=release \
            2>&1 | tee /tmp/mlgo-compile.log
          echo
          echo "----- Verify output -----"
          test -s /tmp/mlgo_test.s
          echo "[OK] AArch64 assembly generated"

      # ============================================================
      # 6. TEST EMBEDDED AARCH64 MLGO MODEL
      # ============================================================
      - name: Test Embedded AArch64 MLGO Model
        run: |
          set -e
          echo "========================================"
          echo "EMBEDDED AARCH64 MLGO MODEL TEST"
          echo "========================================"
          BIN="clang-r547379/bin/clang-20"
          cat > /tmp/mlgo_model_test.c <<'EOF'
          __attribute__((noinline)) long mlgo_model_test(
              long a, long b, long c, long d, long e, long f,
              long g, long h, long i, long j, long k, long l) {
            long r0 = a + b;
            long r1 = c + d;
            long r2 = e + f;
            long r3 = g + h;
            long r4 = i + j;
            long r5 = k + l;
            long r6 = r0 * r1;
            long r7 = r2 * r3;
            long r8 = r4 * r5;
            long r9 = r6 + r7;
            long r10 = r8 + r0;
            long r11 = r9 * r10;
            return r11 + r6 + r7 + r8 + r1 + r2 + r3;
          }
          EOF
          echo
          echo "----- Default advisor -----"
          "$BIN" \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_model_test.c \
            -o /tmp/mlgo_default.s \
            2>&1 | tee /tmp/mlgo-default.log
          echo
          echo "----- Release advisor -----"
          "$BIN" \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_model_test.c \
            -o /tmp/mlgo_release.s \
            -mllvm -regalloc-enable-advisor=release \
            2>&1 | tee /tmp/mlgo-release.log
          echo
          echo "----- Verify outputs -----"
          test -s /tmp/mlgo_default.s
          test -s /tmp/mlgo_release.s
          echo "[OK] Default AArch64 compilation"
          echo "[OK] Release AArch64 compilation"
          echo
          echo "----- Compare generated assembly -----"
          if cmp -s /tmp/mlgo_default.s /tmp/mlgo_release.s; then
            echo "[INFO] Default and Release assembly are identical"
          else
            echo "[DETECTED] Default and Release assembly differ"
          fi
          echo
          echo "----- Check for fallback -----"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/mlgo-release.log; then
            echo "[FALLBACK] Release advisor fell back to default"
          else
            echo "[NO FALLBACK] No Release advisor fallback message detected"
          fi
          echo
          echo "========================================"
          echo "MODEL TEST COMPLETE"
          echo "========================================"

      # ============================================================
      # 7. VERIFY MLGO OPTION IN COMPILATION
      # ============================================================
      - name: Verify MLGO Option In Compilation
        run: |
          set -e
          echo "========================================"
          echo "MLGO OPTION VERIFICATION"
          echo "========================================"
          clang-r547379/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/mlgo_option_test.s \
            -mllvm -regalloc-enable-advisor=release \
            -### \
            2>&1 | tee /tmp/mlgo-###.log
          echo
          echo "----- LLVM command -----"
          grep -F 'regalloc-enable-advisor=release' /tmp/mlgo-###.log
          echo
          echo "[OK] MLGO RegAlloc Advisor option passed to LLVM"

      # ============================================================
      # 8. ANALYZE MLGO BINARY EVIDENCE
      # ============================================================
      - name: Analyze MLGO Binary Evidence
        run: |
          echo "========================================"
          echo "MLGO BINARY EVIDENCE"
          echo "========================================"
          echo
          echo "----- RegAllocEvictModel -----"
          grep -Ei 'RegAllocEvictModel' \
            /tmp/mlgo-strings.txt \
            /tmp/mlgo-symbols.txt \
            || true
          echo
          echo "----- ReleaseModeEvictionAdvisor -----"
          grep -Ei 'ReleaseModeEvictionAdvisor' \
            /tmp/mlgo-strings.txt \
            /tmp/mlgo-symbols.txt \
            || true
          echo
          echo "----- ModelRunner -----"
          grep -Ei 'ModelRunner' \
            /tmp/mlgo-strings.txt \
            /tmp/mlgo-symbols.txt \
            || true
          echo
          echo "----- MLGO -----"
          grep -Ei 'MLGO|mlgo' /tmp/mlgo-strings.txt | head -100 || true

      # ============================================================
      # 9. FINAL MLGO RESULT
      # ============================================================
      - name: Final MLGO Result
        run: |
          echo "========================================"
          echo "FINAL MLGO RESULT"
          echo "========================================"
          echo
          echo "1. AArch64 backend"
          if [ -s /tmp/mlgo_test.s ]; then
            echo "[OK] AArch64 backend executed"
          else
            echo "[FAIL] AArch64 assembly missing"
          fi
          echo
          echo "2. MLGO option"
          if grep -Fq 'regalloc-enable-advisor=release' /tmp/mlgo-###.log; then
            echo "[OK] regalloc-enable-advisor=release passed to LLVM"
          else
            echo "[FAIL] MLGO option not found"
          fi
          echo
          echo "3. Embedded model evidence"
          if grep -Eiq 'RegAllocEvictModel' \
              /tmp/mlgo-strings.txt \
              /tmp/mlgo-symbols.txt; then
            echo "[DETECTED] RegAllocEvictModel evidence found"
          else
            echo "[NOT DETECTED] RegAllocEvictModel symbol/string not found"
          fi
          echo
          echo "4. Release advisor evidence"
          if grep -Eiq 'ReleaseModeEvictionAdvisor' \
              /tmp/mlgo-strings.txt \
              /tmp/mlgo-symbols.txt; then
            echo "[DETECTED] ReleaseModeEvictionAdvisor evidence found"
          else
            echo "[NOT DETECTED] ReleaseModeEvictionAdvisor evidence not found"
          fi
          echo
          echo "5. Release fallback"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/mlgo-release.log; then
            echo "[FALLBACK] Release advisor fell back to default"
          else
            echo "[NO FALLBACK] Release advisor did not report fallback"
          fi
          echo
          echo "========================================"
          echo "IMPORTANT"
          echo "========================================"
          echo "Successful Release compilation proves the Release advisor path can execute."
          echo "No fallback is stronger evidence that the Release advisor was created."
          echo "Binary symbols are supplementary evidence only."
          echo "Absence of symbols does not prove that no embedded model exists."

      # ============================================================
      # 10. UPLOAD MLGO EVIDENCE
      # ============================================================
      - name: Upload MLGO Evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlgo-embedded-evidence-r547379
          path: |
            /tmp/mlgo_test.c
            /tmp/mlgo_test.s
            /tmp/mlgo_model_test.c
            /tmp/mlgo_default.s
            /tmp/mlgo_release.s
            /tmp/mlgo_option_test.s
            /tmp/mlgo-compile.log
            /tmp/mlgo-default.log
            /tmp/mlgo-release.log
            /tmp/mlgo-###.log
            /tmp/mlgo-strings.txt
            /tmp/mlgo-symbols.txt
            /tmp/mlgo-sections.txt
