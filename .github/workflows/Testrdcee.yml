name: Build Kernel LD DCE ON

on:
  push:
    branches:
      - xxx-17

jobs:
  build-kernel:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: k

    steps:

    # 1 Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: xxx-17
        fetch-depth: 1
        path: k

    # 2 Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          libelf-dev \
          libncurses-dev \
          python3 \
          curl \
          wget

    # 3 Toolchains
    - name: Clone LineageOS Toolchains
      run: |
        set -e

        echo "========================================"
        echo "SETTING UP TOOLCHAINS"
        echo "========================================"

        rm -rf clang gcc64 gcc32

        echo
        echo "========================================"
        echo "CLANG r547379"
        echo "========================================"

        git clone \
          --depth=1 \
          https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
          clang

        echo
        echo "========================================"
        echo "GCC64 4.9"
        echo "========================================"

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          gcc64

        echo
        echo "========================================"
        echo "GCC32 4.9"
        echo "========================================"

        git clone \
          --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          gcc32

    # 4 Environment
    - name: Setup Environment
      run: |
        echo "CLANG_PATH=$GITHUB_WORKSPACE/k/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/k/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/k/gcc32" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

    # 5 Verify Toolchain
    - name: Verify Toolchain
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "CLANG"
        echo "========================================"

        which clang
        clang --version

        echo
        echo "========================================"
        echo "LLD"
        echo "========================================"

        which ld.lld
        ld.lld --version

        echo
        echo "========================================"
        echo "LLVM TOOLS"
        echo "========================================"

        which llvm-ar
        which llvm-nm
        which llvm-objcopy
        which llvm-objdump
        which llvm-strip

    # 6 Load defconfig
    - name: Load violet-perf defconfig
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "LOADING DEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

        test -f out/.config

    # 7 olddefconfig
    - name: Resolve Configuration
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "RUNNING OLDDEFCONFIG"
        echo "========================================"

        make O=out \
          ARCH=arm64 \
          olddefconfig

    # 8 Verify LD DCE is enabled
    - name: Verify LD DCE Enabled
      run: |
        set -e

        echo "========================================"
        echo "VERIFY LD DEAD CODE DATA ELIMINATION"
        echo "========================================"

        echo
        echo "HAVE SYMBOL:"
        grep '^CONFIG_HAVE_LD_DEAD_CODE_DATA_ELIMINATION=' \
          out/.config

        echo
        echo "LD DCE OPTION:"
        grep '^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=' \
          out/.config

        echo
        echo "========================================"
        echo "EXPECTED"
        echo "========================================"

        grep -q \
          '^CONFIG_HAVE_LD_DEAD_CODE_DATA_ELIMINATION=y$' \
          out/.config

        grep -q \
          '^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$' \
          out/.config

        echo
        echo "[OK] HAVE_LD_DEAD_CODE_DATA_ELIMINATION=y"
        echo "[OK] LD_DEAD_CODE_DATA_ELIMINATION=y"
        echo
        echo "LD DCE IS ENABLED FOR THIS BUILD"

    # 9 Build Kernel
    - name: Build Kernel
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        echo "========================================"
        echo "BUILDING KERNEL"
        echo "========================================"

        make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          V=1 \
          2>&1 | tee build.log

    # 10 Verify Kernel Output
    - name: Verify Kernel Output
      run: |
        set -e

        echo "========================================"
        echo "VERIFYING KERNEL OUTPUT"
        echo "========================================"

        test -f out/arch/arm64/boot/Image.gz

        echo
        echo "[OK] Image.gz exists"
        echo
        echo "Kernel size:"
        ls -lh out/arch/arm64/boot/Image.gz

        echo
        echo "========================================"
        echo "LD DCE ON KERNEL BUILD PASSED"
        echo "========================================"

    # 11 Upload Build Results
    - name: Upload Kernel Build Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-ld-dce-on
        path: |
          k/out/.config
          k/build.log
          k/out/arch/arm64/boot/Image.gz
        if-no-files-found: warn
