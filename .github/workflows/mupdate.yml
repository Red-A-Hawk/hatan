name: Build Hatan with Official Buildroot v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT OFFICIAL BUILDROOT MIRROR
      # ============================================================
      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: buildroot/buildroot
          ref: master
          path: buildroot
          fetch-depth: 1

      # ============================================================
      # 2. CHECKOUT HATAN KERNEL
      # ============================================================
      - name: Checkout Hatan
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/hatan
          ref: buildroot
          path: hatan
          fetch-depth: 1

      # ============================================================
      # 3. INSTALL BUILD DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            file \
            flex \
            gawk \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ============================================================
      # 4. VERIFY BUILDROOT
      # ============================================================
      - name: Verify Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT"
          echo "=============================================="

          git remote -v
          git rev-parse HEAD
          make --version | head -n 1

      # ============================================================
      # 5. VERIFY HATAN
      # ============================================================
      - name: Verify Hatan
        run: |
          set -e

          echo "=============================================="
          echo "HATAN"
          echo "=============================================="

          git -C hatan remote -v
          git -C hatan rev-parse HEAD

          echo
          echo "Kernel Makefile:"
          test -f hatan/Makefile
          echo "OK"

          echo
          echo "Hatan defconfig:"
          test -f hatan/arch/arm64/configs/vendor/violet-perf_defconfig
          echo "OK"

          echo
          echo "Hatan sigcontext.h:"
          test -f hatan/arch/arm64/include/uapi/asm/sigcontext.h
          grep -nE 'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            hatan/arch/arm64/include/uapi/asm/sigcontext.h

      # ============================================================
      # 6. CONFIGURE BUILDROOT
      # ============================================================
      - name: Configure Buildroot
        working-directory: buildroot
        run: |
          set -e

          make qemu_aarch64_virt_defconfig

          cat >> .config <<'EOF'

          # ========================================================
          # HATAN KERNEL
          # ========================================================
          BR2_KERNEL_HEADERS_AS_KERNEL=y
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_14=y

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="4.14.357"
          BR2_LINUX_KERNEL_VERSION="4.14.357"

          BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG=y
          BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE="../hatan/arch/arm64/configs/vendor/violet-perf_defconfig"

          BR2_LINUX_KERNEL_IMAGE=y
          BR2_LINUX_KERNEL_GZIP=y
          BR2_LINUX_KERNEL_NEEDS_HOST_OPENSSL=y

          BR2_PACKAGE_OVERRIDE_FILE="$(CONFIG_DIR)/local.mk"
          EOF

          cat > local.mk <<'EOF'
          LINUX_OVERRIDE_SRCDIR = ../hatan
          EOF

          make olddefconfig

      # ============================================================
      # 7. VERIFY BUILDROOT CONFIG
      # ============================================================
      - name: Verify Buildroot configuration
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT CONFIG"
          echo "=============================================="

          grep -E \
            '^(BR2_KERNEL_HEADERS_AS_KERNEL|BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_14|BR2_LINUX_KERNEL|BR2_LINUX_KERNEL_CUSTOM_VERSION|BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE|BR2_LINUX_KERNEL_VERSION|BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG|BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE|BR2_LINUX_KERNEL_IMAGE|BR2_LINUX_KERNEL_GZIP|BR2_LINUX_KERNEL_NEEDS_HOST_OPENSSL|BR2_PACKAGE_OVERRIDE_FILE)=' \
            .config

          echo
          echo "=============================================="
          echo "LOCAL.MK"
          echo "=============================================="

          cat local.mk

      # ============================================================
      # 8. INSPECT ACTUAL BUILDROOT MAKE VARIABLES
      # ============================================================
      - name: Inspect Buildroot Linux variables
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "ACTUAL BUILDROOT MAKE VARIABLES"
          echo "=============================================="

          make -pn 2>/dev/null \
            | grep -E \
            '^(PACKAGE_OVERRIDE_FILE|LINUX_OVERRIDE_SRCDIR|LINUX_DIR|LINUX_VERSION|LINUX_SOURCE|LINUX_HEADERS_OVERRIDE_SRCDIR)[[:space:]]*[:?+]?=' \
            || true

      # ============================================================
      # 9. FORCE LINUX OVERRIDE SOURCE PREPARATION
      # ============================================================
      - name: Prepare Hatan Linux source
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING LINUX SOURCE"
          echo "=============================================="

          make linux-rebuild

      # ============================================================
      # 10. VERIFY THE ACTUAL LINUX SOURCE
      # ============================================================
      - name: Verify Linux source override
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT LINUX SOURCE"
          echo "=============================================="

          echo
          echo "Directories under output/build:"
          find output/build -maxdepth 1 -type d -print | sort

          echo
          echo "Searching for Hatan Makefile:"
          find output/build -maxdepth 3 -type f -name Makefile -print \
            | sort

          echo
          echo "Searching for Hatan sigcontext.h:"
          find output/build -type f \
            -path '*/arch/arm64/include/uapi/asm/sigcontext.h' \
            -print

      # ============================================================
      # 11. VERIFY SIGCONTEXT DEFINITIONS
      # ============================================================
      - name: Verify kernel headers
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "KERNEL HEADER VERIFICATION"
          echo "=============================================="

          SIGCONTEXT="$(find output/build -type f \
            -path '*/arch/arm64/include/uapi/asm/sigcontext.h' \
            | head -n 1)"

          if [ -z "$SIGCONTEXT" ]; then
            echo "ERROR: Hatan sigcontext.h was not found"
            exit 1
          fi

          echo "Found:"
          echo "$SIGCONTEXT"

          echo
          grep -nE \
            'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            "$SIGCONTEXT"

      # ============================================================
      # 12. BUILD KERNEL HEADERS
      # ============================================================
      - name: Install kernel headers
        working-directory: buildroot
        run: |
          set -e

          make linux-headers

      # ============================================================
      # 13. BUILD EVERYTHING
      # ============================================================
      - name: Build Buildroot
        working-directory: buildroot
        run: |
          set -e

          make -j"$(nproc)"

      # ============================================================
      # 14. SHOW OUTPUTS
      # ============================================================
      - name: Show build outputs
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "OUTPUT IMAGES"
          echo "=============================================="

          find output/images -maxdepth 2 -type f -print | sort

      # ============================================================
      # 15. UPLOAD BUILDROOT OUTPUT
      # ============================================================
      - name: Upload Buildroot images
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-output
          path: buildroot/output/images/
          if-no-files-found: error

      # ============================================================
      # 16. UPLOAD ACTUAL LINUX SOURCE FOR DEBUGGING
      # ============================================================
      - name: Upload Linux source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-linux-source
          path: |
            buildroot/output/build/linux-*
          if-no-files-found: ignore
