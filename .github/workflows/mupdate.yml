name: Build Hatan Kernel with Buildroot v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: backslashxx/buildroot
          path: buildroot
          fetch-depth: 0

      - name: Checkout Hatan Kernel
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/hatan
          ref: buildroot
          path: hatan
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libncurses-dev \
            libssl-dev \
            rsync \
            unzip \
            wget \
            python3

      - name: Verify sources
        run: |
          set -e

          echo "============================================"
          echo "BUILDROOT"
          echo "============================================"

          cd buildroot
          git rev-parse HEAD
          git branch --show-current

          echo
          echo "============================================"
          echo "HATAN"
          echo "============================================"

          cd ../hatan
          git rev-parse HEAD
          git branch --show-current

          echo
          echo "============================================"
          echo "KERNEL DEFCONFIG"
          echo "============================================"

          test -f arch/arm64/configs/vendor/violet-perf_defconfig
          ls -lh arch/arm64/configs/vendor/violet-perf_defconfig

      - name: Configure Buildroot
        working-directory: buildroot
        run: |
          set -e

          make qemu_aarch64_virt_defconfig

          cat >> .config <<EOF
          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="4.14.357"
          BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG=y
          BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE="../hatan/arch/arm64/configs/vendor/violet-perf_defconfig"
          BR2_KERNEL_HEADERS_AS_KERNEL=y
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_14=y
          EOF

          make olddefconfig

          cat > local.mk <<'EOF'
          LINUX_OVERRIDE_SRCDIR = ../hatan
          EOF

          make olddefconfig

          echo
          echo "============================================"
          echo "FINAL BUILDROOT KERNEL CONFIG"
          echo "============================================"

          grep -E \
            '^(BR2_LINUX_KERNEL|BR2_KERNEL_HEADERS|BR2_PACKAGE_HOST_LINUX_HEADERS|BR2_PACKAGE_OVERRIDE_FILE)' \
            .config || true

          echo
          echo "============================================"
          echo "LOCAL SOURCE OVERRIDE"
          echo "============================================"

          cat local.mk

          echo
          echo "============================================"
          echo "LOCAL.MK LOCATION"
          echo "============================================"

          realpath local.mk

      - name: Prepare Buildroot Linux source
        working-directory: buildroot
        run: |
          set -e

          echo "============================================"
          echo "BUILDROOT LINUX SOURCE"
          echo "============================================"

          make linux-source

          echo
          echo "============================================"
          echo "BUILDROOT LINUX DIRECTORIES"
          echo "============================================"

          find output/build \
            -maxdepth 1 \
            -type d \
            -name "linux*" \
            -print 2>/dev/null | sort || true

          echo
          echo "============================================"
          echo "HATAN SOURCE"
          echo "============================================"

          realpath ../hatan

          echo
          echo "============================================"
          echo "SEARCH FOR HATAN SIGCONTEXT"
          echo "============================================"

          find output/build \
            -type f \
            -path "*/arch/arm64/include/uapi/asm/sigcontext.h" \
            -print 2>/dev/null | sort || true

      - name: Diagnose kernel headers
        working-directory: buildroot
        run: |
          set -e

          echo "============================================"
          echo "BUILDROOT LINUX SOURCE CANDIDATES"
          echo "============================================"

          mapfile -t LINUX_CANDIDATES < <(
            find output/build \
              -type f \
              -path "*/arch/arm64/include/uapi/asm/sigcontext.h" \
              -print 2>/dev/null |
              sed 's#/arch/arm64/include/uapi/asm/sigcontext.h##' |
              sort -u
          )

          if [ "${#LINUX_CANDIDATES[@]}" -eq 0 ]; then
            echo "No Linux source containing Hatan sigcontext.h was found."
          else
            for LINUX_DIR in "${LINUX_CANDIDATES[@]}"; do

              echo
              echo "============================================"
              echo "REAL LINUX SOURCE"
              echo "============================================"

              echo "$LINUX_DIR"

              echo
              echo "============================================"
              echo "REALPATH"
              echo "============================================"

              realpath "$LINUX_DIR"

              echo
              echo "============================================"
              echo "SOURCE SIGCONTEXT.H"
              echo "============================================"

              grep -nE \
                'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
                "$LINUX_DIR/arch/arm64/include/uapi/asm/sigcontext.h" \
                || true

              echo
              echo "============================================"
              echo "RUN HEADERS INSTALL"
              echo "============================================"

              rm -rf /tmp/hatan-headers
              mkdir -p /tmp/hatan-headers

              make -C "$LINUX_DIR" \
                ARCH=arm64 \
                INSTALL_HDR_PATH=/tmp/hatan-headers \
                headers_install

              echo
              echo "============================================"
              echo "INSTALLED SIGCONTEXT.H"
              echo "============================================"

              find /tmp/hatan-headers \
                -type f \
                -name "sigcontext.h" \
                -print 2>/dev/null | sort || true

              echo
              echo "============================================"
              echo "INSTALLED HEADER CONTENT"
              echo "============================================"

              grep -nE \
                'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
                /tmp/hatan-headers/usr/include/asm/sigcontext.h \
                2>/dev/null || true

            done
          fi

          echo
          echo "============================================"
          echo "BUILDROOT SYSROOT SIGCONTEXT"
          echo "============================================"

          find output/host \
            -type f \
            -name "sigcontext.h" \
            -print 2>/dev/null | sort || true

      - name: Build
        working-directory: buildroot
        run: |
          set -e
          make -j"$(nproc)"

      - name: Show outputs
        working-directory: buildroot
        run: |
          echo "============================================"
          echo "BUILDROOT OUTPUT"
          echo "============================================"

          find output/images \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' | sort

          echo
          echo "============================================"
          echo "KERNEL OUTPUT"
          echo "============================================"

          find output/build \
            -path "*/arch/arm64/boot/*" \
            -type f \
            -printf '%p\n' \
            2>/dev/null | sort || true

      - name: Upload Buildroot images
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-images
          path: |
            buildroot/output/images/**
          if-no-files-found: warn

      - name: Upload kernel outputs
        uses: actions/upload-artifact@v4
        with:
          name: hatan-kernel-build
          path: |
            buildroot/output/build/linux-*/arch/arm64/boot/Image
            buildroot/output/build/linux-*/arch/arm64/boot/Image.gz
            buildroot/output/build/linux-*/vmlinux
            buildroot/output/build/linux-*/System.map
          if-no-files-found: warn
