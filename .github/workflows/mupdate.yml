name: Build Hatan with Official Buildroot v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT OFFICIAL BUILDROOT
      # ============================================================
      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: buildroot/buildroot
          ref: master
          path: buildroot
          fetch-depth: 1

      # ============================================================
      # 2. CHECKOUT HATAN - BUILDROOT BRANCH
      # ============================================================
      - name: Checkout Hatan
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/hatan
          ref: buildroot
          path: hatan
          fetch-depth: 1

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            file \
            flex \
            gawk \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ============================================================
      # 4. VERIFY BUILDROOT
      # ============================================================
      - name: Verify Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT"
          echo "=============================================="

          git remote -v

          echo
          echo "Buildroot commit:"
          git rev-parse HEAD

          echo
          make --version | head -n 1

      # ============================================================
      # 5. VERIFY HATAN
      # ============================================================
      - name: Verify Hatan
        run: |
          set -e

          echo "=============================================="
          echo "HATAN"
          echo "=============================================="

          git -C hatan remote -v

          echo
          echo "Hatan commit:"
          git -C hatan rev-parse HEAD

          echo
          echo "Hatan branch:"
          git -C hatan branch --show-current

          echo
          echo "Kernel Makefile:"
          test -f hatan/Makefile
          echo "OK"

          echo
          echo "Hatan defconfig:"
          test -f hatan/arch/arm64/configs/vendor/violet-perf_defconfig
          echo "OK"

          echo
          echo "Hatan sigcontext.h:"
          test -f hatan/arch/arm64/include/uapi/asm/sigcontext.h

          grep -nE \
            'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            hatan/arch/arm64/include/uapi/asm/sigcontext.h

      # ============================================================
      # 6. CONFIGURE BUILDROOT
      # ============================================================
      - name: Configure Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURE BUILDROOT"
          echo "=============================================="

          make qemu_aarch64_virt_defconfig

          cat >> .config <<'EOF'

          # ========================================================
          # HATAN KERNEL
          # ========================================================
          BR2_KERNEL_HEADERS_AS_KERNEL=y
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_14=y

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="4.14.357"
          BR2_LINUX_KERNEL_VERSION="4.14.357"

          BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG=y
          BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE="../hatan/arch/arm64/configs/vendor/violet-perf_defconfig"

          BR2_LINUX_KERNEL_IMAGE=y
          BR2_LINUX_KERNEL_GZIP=y
          BR2_LINUX_KERNEL_NEEDS_HOST_OPENSSL=y

          BR2_PACKAGE_OVERRIDE_FILE="$(CONFIG_DIR)/local.mk"
          EOF

          cat > local.mk <<'EOF'
          LINUX_OVERRIDE_SRCDIR = ../hatan
          EOF

          make olddefconfig

      # ============================================================
      # 7. VERIFY OVERRIDE CONFIGURATION
      # ============================================================
      - name: Verify override configuration
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BR2_PACKAGE_OVERRIDE_FILE"
          echo "=============================================="

          grep '^BR2_PACKAGE_OVERRIDE_FILE=' .config

          echo
          echo "=============================================="
          echo "LOCAL.MK"
          echo "=============================================="

          test -f local.mk

          ls -la local.mk

          echo
          cat local.mk

      # ============================================================
      # 8. INSPECT ACTUAL BUILDROOT VARIABLES
      # ============================================================
      - name: Inspect Buildroot Linux variables
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "ACTUAL BUILDROOT MAKE VARIABLES"
          echo "=============================================="

          make -pn 2>/dev/null \
            | grep -E \
            '^(PACKAGE_OVERRIDE_FILE|LINUX_OVERRIDE_SRCDIR|LINUX_DIR|LINUX_BASENAME|LINUX_VERSION|LINUX_SOURCE|LINUX_HEADERS_OVERRIDE_SRCDIR)[[:space:]]*[:?+]?=' \
            || true

      # ============================================================
      # 9. SHOW ACTUAL PATHS
      # ============================================================
      - name: Inspect Buildroot paths
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT PATHS"
          echo "=============================================="

          echo
          echo "BUILD_DIR:"
          make -s printvars VARS='BUILD_DIR' QUOTE=sh

          echo
          echo "LINUX_BASENAME:"
          make -s printvars VARS='LINUX_BASENAME' QUOTE=sh

          echo
          echo "LINUX_DIR:"
          make -s printvars VARS='LINUX_DIR' QUOTE=sh

          echo
          echo "LINUX_OVERRIDE_SRCDIR:"
          make -s printvars VARS='LINUX_OVERRIDE_SRCDIR' QUOTE=sh

      # ============================================================
      # 10. PREPARE LINUX SOURCE
      # ============================================================
      - name: Prepare Hatan Linux source
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "PREPARE HATAN LINUX SOURCE"
          echo "=============================================="

          make linux-rebuild

      # ============================================================
      # 11. VERIFY LINUX-CUSTOM
      # ============================================================
      - name: Verify Linux custom source
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "LINUX-CUSTOM AFTER REBUILD"
          echo "=============================================="

          LINUX_DIR="$(
            make -s printvars VARS='LINUX_DIR' QUOTE=sh \
            | tail -n 1
          )"

          echo
          echo "LINUX_DIR=$LINUX_DIR"

          echo
          echo "Directory:"
          ls -lad "$LINUX_DIR"

          echo
          echo "Contents:"
          ls -la "$LINUX_DIR" | head -n 30

          echo
          echo "Kernel Makefile:"
          test -f "$LINUX_DIR/Makefile"
          echo "OK"

      # ============================================================
      # 12. VERIFY HATAN SOURCE WAS COPIED
      # ============================================================
      - name: Verify Hatan source inside Linux custom
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY HATAN SOURCE INSIDE LINUX-CUSTOM"
          echo "=============================================="

          LINUX_DIR="$(
            make -s printvars VARS='LINUX_DIR' QUOTE=sh \
            | tail -n 1
          )"

          SIGCONTEXT="$LINUX_DIR/arch/arm64/include/uapi/asm/sigcontext.h"

          echo
          echo "Linux source:"
          echo "$LINUX_DIR"

          echo
          echo "sigcontext.h:"
          echo "$SIGCONTEXT"

          test -f "$SIGCONTEXT"
          echo "sigcontext.h EXISTS"

          echo
          grep -nE \
            'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            "$SIGCONTEXT"

      # ============================================================
      # 13. COMPARE HATAN SOURCE WITH LINUX-CUSTOM
      # ============================================================
      - name: Compare Hatan and Buildroot Linux source
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "COMPARE HATAN VS LINUX-CUSTOM"
          echo "=============================================="

          LINUX_DIR="$(
            make -s printvars VARS='LINUX_DIR' QUOTE=sh \
            | tail -n 1
          )"

          SOURCE="../hatan/arch/arm64/include/uapi/asm/sigcontext.h"
          DEST="$LINUX_DIR/arch/arm64/include/uapi/asm/sigcontext.h"

          echo
          echo "SOURCE:"
          echo "$SOURCE"

          echo
          echo "DEST:"
          echo "$DEST"

          echo
          echo "Running cmp..."

          cmp "$SOURCE" "$DEST"

          echo
          echo "COMPARE RESULT: IDENTICAL"
      
      # ============================================================
      # 14. INSTALL KERNEL HEADERS
      # ============================================================
      - name: Install kernel headers
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL KERNEL HEADERS"
          echo "=============================================="

          make linux-headers

      # ============================================================
      # 15. CHECK SYSROOT HEADERS
      # ============================================================
      - name: Check Buildroot sysroot headers
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "SYSROOT SIGCONTEXT"
          echo "=============================================="

          find output/host \
            -type f \
            -path '*/usr/include/asm/sigcontext.h' \
            -print \
            | sort

      # ============================================================
      # 16. BUILD BUILDROOT
      # ============================================================
      - name: Build Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILD BUILDROOT"
          echo "=============================================="

          make -j"$(nproc)"

      # ============================================================
      # 17. SHOW OUTPUT IMAGES
      # ============================================================
      - name: Show output images
        if: always()
        working-directory: buildroot
        run: |
          echo "=============================================="
          echo "OUTPUT IMAGES"
          echo "=============================================="

          if [ -d output/images ]; then
            find output/images \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

      # ============================================================
      # 18. UPLOAD BUILDROOT OUTPUT
      # ============================================================
      - name: Upload Buildroot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-output
          path: buildroot/output/images/
          if-no-files-found: ignore

      # ============================================================
      # 19. UPLOAD LINUX DIAGNOSTIC SOURCE
      # ============================================================
      - name: Upload Linux diagnostic source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-linux-diagnostic
          path: |
            buildroot/output/build/linux-*
          if-no-files-found: ignore
