name: Build Hatan with Official Buildroot v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT OFFICIAL BUILDROOT
      # ============================================================
      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: buildroot/buildroot
          ref: master
          path: buildroot
          fetch-depth: 1

      # ============================================================
      # 2. CHECKOUT HATAN - BUILDROOT BRANCH
      # ============================================================
      - name: Checkout Hatan
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/hatan
          ref: buildroot
          path: hatan
          fetch-depth: 1

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            file \
            flex \
            gawk \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils

      # ============================================================
      # 4. VERIFY BUILDROOT
      # ============================================================
      - name: Verify Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT"
          echo "=============================================="

          git remote -v

          echo
          echo "Buildroot commit:"
          git rev-parse HEAD

          echo
          make --version | head -n 1

      # ============================================================
      # 5. VERIFY HATAN
      # ============================================================
      - name: Verify Hatan
        run: |
          set -e

          echo "=============================================="
          echo "HATAN"
          echo "=============================================="

          git -C hatan remote -v

          echo
          echo "Hatan commit:"
          git -C hatan rev-parse HEAD

          echo
          echo "Hatan branch:"
          git -C hatan branch --show-current

          echo
          echo "Kernel Makefile:"
          test -f hatan/Makefile
          echo "OK"

          echo
          echo "Hatan defconfig:"
          test -f hatan/arch/arm64/configs/vendor/violet-perf_defconfig
          echo "OK"

          echo
          echo "Hatan sigcontext.h:"
          test -f hatan/arch/arm64/include/uapi/asm/sigcontext.h
          grep -nE \
            'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            hatan/arch/arm64/include/uapi/asm/sigcontext.h

      # ============================================================
      # 6. CONFIGURE BUILDROOT
      # ============================================================
      - name: Configure Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "CONFIGURE BUILDROOT"
          echo "=============================================="

          make qemu_aarch64_virt_defconfig

          cat >> .config <<'EOF'

          # ========================================================
          # HATAN KERNEL
          # ========================================================
          BR2_KERNEL_HEADERS_AS_KERNEL=y
          BR2_PACKAGE_HOST_LINUX_HEADERS_CUSTOM_4_14=y

          BR2_LINUX_KERNEL=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION=y
          BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="4.14.357"
          BR2_LINUX_KERNEL_VERSION="4.14.357"

          BR2_LINUX_KERNEL_USE_CUSTOM_CONFIG=y
          BR2_LINUX_KERNEL_CUSTOM_CONFIG_FILE="../hatan/arch/arm64/configs/vendor/violet-perf_defconfig"

          BR2_LINUX_KERNEL_IMAGE=y
          BR2_LINUX_KERNEL_GZIP=y
          BR2_LINUX_KERNEL_NEEDS_HOST_OPENSSL=y

          BR2_PACKAGE_OVERRIDE_FILE="$(CONFIG_DIR)/local.mk"
          EOF

          cat > local.mk <<'EOF'
          LINUX_OVERRIDE_SRCDIR = ../hatan
          EOF

          make olddefconfig

      # ============================================================
      # 7. VERIFY CONFIG AND LOCAL.MK
      # ============================================================
      - name: Verify override configuration
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BR2_PACKAGE_OVERRIDE_FILE"
          echo "=============================================="

          grep '^BR2_PACKAGE_OVERRIDE_FILE=' .config

          echo
          echo "=============================================="
          echo "LOCAL.MK"
          echo "=============================================="

          test -f local.mk

          ls -la local.mk

          echo
          cat local.mk

      # ============================================================
      # 8. INSPECT ACTUAL BUILDROOT VARIABLES
      # ============================================================
      - name: Inspect Buildroot Linux variables
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "ACTUAL BUILDROOT MAKE VARIABLES"
          echo "=============================================="

          make -pn 2>/dev/null \
            | grep -E \
            '^(PACKAGE_OVERRIDE_FILE|LINUX_OVERRIDE_SRCDIR|LINUX_DIR|LINUX_BASENAME|LINUX_VERSION|LINUX_SOURCE|LINUX_HEADERS_OVERRIDE_SRCDIR)[[:space:]]*[:?+]?=' \
            || true

      # ============================================================
      # 9. SHOW IMPORTANT PATHS
      # ============================================================
      - name: Inspect Buildroot paths
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILDROOT PATHS"
          echo "=============================================="

          echo
          echo "BUILD_DIR:"
          make -s printvars VARS='BUILD_DIR' QUOTE=sh || true

          echo
          echo "LINUX_BASENAME:"
          make -s printvars VARS='LINUX_BASENAME' QUOTE=sh || true

          echo
          echo "LINUX_DIR:"
          make -s printvars VARS='LINUX_DIR' QUOTE=sh || true

          echo
          echo "LINUX_OVERRIDE_SRCDIR:"
          make -s printvars VARS='LINUX_OVERRIDE_SRCDIR' QUOTE=sh || true

      # ============================================================
      # 10. PREPARE LINUX SOURCE FROM HATAN
      # ============================================================
      - name: Prepare Hatan Linux source
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "PREPARE LINUX SOURCE"
          echo "=============================================="

          make linux-rebuild

      # ============================================================
      # 11. VERIFY OUTPUT BUILD DIRECTORIES
      # ============================================================
      - name: Verify Linux source directory
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "OUTPUT/BUILD DIRECTORIES"
          echo "=============================================="

          find output/build \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print \
            | sort

          echo
          echo "=============================================="
          echo "LINUX DIRECTORY"
          echo "=============================================="

          LINUX_DIR="$(
            make -s printvars VARS='LINUX_DIR' QUOTE=sh \
            | tail -n 1
          )"

          echo "LINUX_DIR=$LINUX_DIR"

          if [ -d "$LINUX_DIR" ]; then
            echo "LINUX_DIR exists."
          else
            echo "LINUX_DIR does not exist."
            exit 1
          fi

      # ============================================================
      # 12. VERIFY HATAN FILES INSIDE BUILDROOT LINUX SOURCE
      # ============================================================
      - name: Verify Hatan source inside Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY HATAN SOURCE"
          echo "=============================================="

          LINUX_DIR="$(
            make -s printvars VARS='LINUX_DIR' QUOTE=sh \
            | tail -n 1
          )"

          echo "LINUX_DIR=$LINUX_DIR"

          echo
          echo "Kernel Makefile:"
          test -f "$LINUX_DIR/Makefile"
          echo "OK"

          echo
          echo "Hatan sigcontext.h:"
          test -f \
            "$LINUX_DIR/arch/arm64/include/uapi/asm/sigcontext.h"

          echo "OK"

          echo
          grep -nE \
            'struct _aarch64_ctx|FPSIMD_MAGIC|struct fpsimd_context' \
            "$LINUX_DIR/arch/arm64/include/uapi/asm/sigcontext.h"

      # ============================================================
      # 13. INSTALL KERNEL HEADERS
      # ============================================================
      - name: Install kernel headers
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL KERNEL HEADERS"
          echo "=============================================="

          make linux-headers

      # ============================================================
      # 14. CHECK SYSROOT SIGCONTEXT
      # ============================================================
      - name: Check Buildroot sysroot headers
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "SYSROOT SIGCONTEXT"
          echo "=============================================="

          find output/host \
            -type f \
            -path '*/usr/include/asm/sigcontext.h' \
            -print \
            | sort

      # ============================================================
      # 15. BUILD
      # ============================================================
      - name: Build Buildroot
        working-directory: buildroot
        run: |
          set -e

          echo "=============================================="
          echo "BUILD"
          echo "=============================================="

          make -j"$(nproc)"

      # ============================================================
      # 16. SHOW OUTPUTS
      # ============================================================
      - name: Show output images
        if: always()
        working-directory: buildroot
        run: |
          echo "=============================================="
          echo "OUTPUT IMAGES"
          echo "=============================================="

          if [ -d output/images ]; then
            find output/images \
              -maxdepth 2 \
              -type f \
              -print \
              | sort
          fi

      # ============================================================
      # 17. UPLOAD OUTPUTS
      # ============================================================
      - name: Upload Buildroot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-output
          path: buildroot/output/images/
          if-no-files-found: ignore

      # ============================================================
      # 18. UPLOAD DIAGNOSTIC BUILD DIRECTORY
      # ============================================================
      - name: Upload Linux diagnostic source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatan-buildroot-linux-diagnostic
          path: |
            buildroot/output/build/linux-*
          if-no-files-found: ignore
