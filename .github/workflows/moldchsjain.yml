name: Test ARM64 DCE + Polly + MLGO r547379

"on":
  workflow_dispatch:

jobs:
  test-dce-polly:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            python3 \
            unzip \
            zip

      # ============================================================
      # 3. DOWNLOAD TOOLCHAINS
      # ============================================================
      - name: Download Toolchains
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"

          echo "============================================================"
          echo "Downloading crDroid Clang r547379"
          echo "============================================================"

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            clang

          echo
          echo "============================================================"
          echo "Downloading GCC64 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo
          echo "============================================================"
          echo "Downloading GCC32 4.9"
          echo "============================================================"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

      # ============================================================
      # 4. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Setup Toolchain Environment
        run: |
          set -e

          export CLANG_PATH="$GITHUB_WORKSPACE/toolchains/clang"
          export GCC64_PATH="$GITHUB_WORKSPACE/toolchains/gcc64"
          export GCC32_PATH="$GITHUB_WORKSPACE/toolchains/gcc32"

          export CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"

          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GCC64_PATH" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GCC32_PATH" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$CROSS_COMPILE" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE" >> "$GITHUB_ENV"

          echo "$CLANG_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC64_PATH/bin" >> "$GITHUB_PATH"
          echo "$GCC32_PATH/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY TOOLCHAINS
      # ============================================================
      - name: Verify Toolchains
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "TOOLCHAIN INFORMATION"
          echo "============================================================"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "LLD:"
          ld.lld --version

          echo
          echo "LLVM AR:"
          llvm-ar --version | head -n 1

          echo
          echo "LLVM NM:"
          llvm-nm --version | head -n 1

          echo
          echo "LLVM OBJCOPY:"
          llvm-objcopy --version | head -n 1

          echo
          echo "LLVM OBJDUMP:"
          llvm-objdump --version | head -n 1

          echo
          echo "LLVM READELF:"
          llvm-readelf --version | head -n 1

          echo
          echo "GCC64:"
          aarch64-linux-android-gcc --version | head -n 1

          echo
          echo "GCC32:"
          arm-linux-androideabi-gcc --version | head -n 1

          echo
          echo "============================================================"
          echo "TOOLCHAIN PATHS"
          echo "============================================================"

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-strip
          command -v llvm-readelf
          command -v aarch64-linux-android-gcc
          command -v arm-linux-androideabi-gcc

      # ============================================================
      # 6. CHECK ORIGINAL DCE + POLLY SUPPORT
      # ============================================================
      - name: Check Original DCE + Polly Support
        run: |
          set -e

          echo "============================================================"
          echo "ORIGINAL DCE + POLLY SUPPORT"
          echo "============================================================"

          echo
          echo "Defconfig DCE:"
          grep -n \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            || true

          echo
          echo "Defconfig Polly:"
          grep -n \
            "CONFIG_POLLY_CLANG" \
            arch/arm64/configs/vendor/violet-perf_defconfig \
            || true

          echo
          echo "Kconfig DCE definition:"
          grep -n \
            -A15 \
            "config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig

          echo
          echo "Makefile DCE integration:"
          grep -n \
            -A5 \
            -B2 \
            "LD_DEAD_CODE_DATA_ELIMINATION" \
            Makefile

          echo
          echo "Makefile Polly integration:"
          grep -n \
            -A30 \
            -B2 \
            "CONFIG_POLLY_CLANG" \
            Makefile

      # ============================================================
      # 7. BACKUP ARM64 KCONFIG
      # ============================================================
      - name: Backup ARM64 Kconfig
        run: |
          set -e

          cp \
            arch/arm64/Kconfig \
            arch/arm64/Kconfig.dce-polly-backup

          echo "[OK] arch/arm64/Kconfig backed up"

      # ============================================================
      # 8. TEMPORARILY ENABLE DCE SUPPORT
      # ============================================================
      - name: Enable DCE Temporarily
        run: |
          set -e

          echo "============================================================"
          echo "TEMPORARILY SELECT LD_DEAD_CODE_DATA_ELIMINATION"
          echo "============================================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Kconfig")
          text = path.read_text()

          if "select LD_DEAD_CODE_DATA_ELIMINATION" in text:
              print("[OK] DCE select already present")
              raise SystemExit(0)

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if line.strip() == "config ARM64":
                  insert_at = i + 1

                  while insert_at < len(lines):
                      current = lines[insert_at]

                      if current.startswith("config ") or current.startswith("menu ") or current.startswith("choice "):
                          break

                      if current.strip().startswith("select "):
                          insert_at += 1
                          continue

                      if current.strip() == "":
                          insert_at += 1
                          continue

                      break

                  lines.insert(
                      insert_at,
                      "\tselect LD_DEAD_CODE_DATA_ELIMINATION"
                  )

                  path.write_text("\n".join(lines) + "\n")

                  print("[OK] Temporary DCE select inserted")
                  break
          else:
              print("[FAIL] config ARM64 not found")
              raise SystemExit(1)
          PY

          echo
          grep -n \
            -A15 \
            "^config ARM64" \
            arch/arm64/Kconfig

      # ============================================================
      # 9. RUN VIOLET DEFCONFIG
      # ============================================================
      - name: Run Violet Defconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "VIOLET PERF DEFCONFIG"
          echo "============================================================"

          make O=arm64-test \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vendor/violet-perf_defconfig

      # ============================================================
      # 10. TEMPORARILY ENABLE POLLY
      # ============================================================
      - name: Enable Polly Temporarily
        run: |
          set -e

          echo "============================================================"
          echo "TEMPORARILY ENABLE CONFIG_POLLY_CLANG"
          echo "============================================================"

          sed -i \
            -e '/^CONFIG_POLLY_CLANG=/d' \
            -e '/^# CONFIG_POLLY_CLANG is not set$/d' \
            arm64-test/.config

          echo "CONFIG_POLLY_CLANG=y" >> arm64-test/.config

          echo
          grep -n \
            "CONFIG_POLLY_CLANG" \
            arm64-test/.config

          echo
          echo "[OK] CONFIG_POLLY_CLANG temporarily enabled"

      # ============================================================
      # MLGO ADDITION 1
      # ============================================================
      - name: Check MLGO Support
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "CHECK MLGO SUPPORT"
          echo "============================================================"

          cat > /tmp/mlgo-test.c <<'EOF'
          int test_function(int a, int b)
          {
              return a + b;
          }
          EOF

          clang \
            -target aarch64-linux-gnu \
            -O2 \
            -mllvm -regalloc-enable-advisor=release \
            -c /tmp/mlgo-test.c \
            -o /tmp/mlgo-test.o

          echo "[OK] Clang accepted MLGO release advisor"

      # ============================================================
      # MLGO ADDITION 2
      # ============================================================
      - name: Enable MLGO Temporarily
        run: |
          set -e

          echo "============================================================"
          echo "TEMPORARILY ENABLE CONFIG_MLGO_CLANG"
          echo "============================================================"

          sed -i \
            -e '/^CONFIG_MLGO_CLANG=/d' \
            -e '/^# CONFIG_MLGO_CLANG is not set$/d' \
            arm64-test/.config

          echo "CONFIG_MLGO_CLANG=y" >> arm64-test/.config

          echo
          grep -n \
            "CONFIG_MLGO_CLANG" \
            arm64-test/.config

          echo
          echo "[OK] CONFIG_MLGO_CLANG temporarily enabled"

      # ============================================================
      # 11. DISABLE CC_STACKPROTECTOR_STRONG (WORKAROUND)
      # ============================================================
      - name: Disable CC_STACKPROTECTOR_STRONG (workaround)
        run: |
          set -e

          echo "============================================================"
          echo "DISABLE CC_STACKPROTECTOR_STRONG / REGULAR (WORKAROUND)"
          echo "============================================================"

          echo
          echo "Before:"
          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config \
            || echo "(no CC_STACKPROTECTOR lines present)"

          sed -i \
            -e '/CONFIG_CC_STACKPROTECTOR_REGULAR/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_STRONG/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_AUTO/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_NONE/d' \
            arm64-test/.config

          {
            echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_AUTO is not set"
            echo "CONFIG_CC_STACKPROTECTOR_NONE=y"
          } >> arm64-test/.config

          echo
          echo "After:"
          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config

          echo
          echo "[OK] Stack protector workaround active"

      # ============================================================
      # 12. OLDDEFCONFIG
      # ============================================================
      - name: Run Olddefconfig
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          make O=arm64-test \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            olddefconfig

      # ============================================================
      # 13. CONFIGURATION CHECK
      # ============================================================
      - name: Configuration Check
        run: |
          set -e

          echo "============================================================"
          echo "DCE + POLLY CONFIGURATION CHECK"
          echo "============================================================"

          echo
          echo ">>> DCE:"
          grep -n \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            arm64-test/.config

          echo
          echo ">>> Polly:"
          grep -n \
            "CONFIG_POLLY_CLANG" \
            arm64-test/.config

          echo
          echo ">>> MLGO:"
          grep -n \
            "CONFIG_MLGO_CLANG" \
            arm64-test/.config

          echo
          echo ">>> Stack protector:"
          grep \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config

          echo
          echo ">>> Verify DCE=y"

          if grep -q \
              "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
              arm64-test/.config; then

            echo "[OK] CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"

          else

            echo "[FAIL] DCE is not enabled"
            exit 1

          fi

          echo
          echo ">>> Verify Polly=y"

          if grep -q \
              "^CONFIG_POLLY_CLANG=y$" \
              arm64-test/.config; then

            echo "[OK] CONFIG_POLLY_CLANG=y"

          else

            echo "[FAIL] Polly is not enabled"
            exit 1

          fi

          echo
          echo ">>> Verify MLGO=y"

          if grep -q \
              "^CONFIG_MLGO_CLANG=y$" \
              arm64-test/.config; then

            echo "[OK] CONFIG_MLGO_CLANG=y"

          else

            echo "[FAIL] MLGO is not enabled"
            exit 1

          fi

          echo
          echo ">>> Verify stack protector workaround"

          if grep -q \
              "^CONFIG_CC_STACKPROTECTOR_NONE=y$" \
              arm64-test/.config && \
             ! grep -q \
              "^CONFIG_CC_STACKPROTECTOR_STRONG=y$" \
              arm64-test/.config && \
             ! grep -q \
              "^CONFIG_CC_STACKPROTECTOR_REGULAR=y$" \
              arm64-test/.config; then

            echo "[OK] Stack protector workaround active"

          else

            echo "[FAIL] Stack protector workaround is not active"
            exit 1

          fi

      # ============================================================
      # 14. PREPARE
      # ============================================================
      - name: Prepare Kernel
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "KERNEL PREPARE"
          echo "============================================================"

          make O=arm64-test \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            prepare

      # ============================================================
      # 15. MODULES_PREPARE
      # ============================================================
      - name: Modules Prepare
        run: |
          set -e

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "MODULES PREPARE"
          echo "============================================================"

          make O=arm64-test \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            modules_prepare

      # ============================================================
      # 16. GENERATED CONFIGURATION CHECK
      # ============================================================
      - name: Generated Configuration Check
        run: |
          set -e

          echo "============================================================"
          echo "GENERATED CONFIGURATION CHECK"
          echo "============================================================"

          if [ ! -f \
              arm64-test/include/config/auto.conf ]; then

            echo "[FAIL] include/config/auto.conf not generated"
            exit 1

          fi

          echo
          echo "DCE:"
          if grep -q \
              "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
              arm64-test/include/config/auto.conf; then

            echo "[OK] auto.conf contains DCE=y"

          else

            echo "[FAIL] auto.conf does not contain DCE=y"
            exit 1

          fi

          echo
          echo "Polly:"
          if grep -q \
              "^CONFIG_POLLY_CLANG=y$" \
              arm64-test/include/config/auto.conf; then

            echo "[OK] auto.conf contains POLLY=y"

          else

            echo "[FAIL] auto.conf does not contain POLLY=y"
            exit 1

          fi

          echo
          echo "MLGO:"
          if grep -q \
              "^CONFIG_MLGO_CLANG=y$" \
              arm64-test/include/config/auto.conf; then

            echo "[OK] auto.conf contains MLGO=y"

          else

            echo "[FAIL] auto.conf does not contain MLGO=y"
            exit 1

          fi

      # ============================================================
      # 17. DCE + POLLY BUILD
      #
      # REAL vmlinux BUILD.
      #
      # No Image.
      # No modules.
      # No PGO.
      # No KernelSU.
      # No BOLT.
      #
      # This is the actual DCE + Polly kernel build/link test.
      # ============================================================
      - name: Build DCE + Polly vmlinux
        run: |
          set -o pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          echo "============================================================"
          echo "BUILDING REAL DCE + POLLY VMLINUX"
          echo "============================================================"

          make V=1 \
            O=arm64-test \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            AS=llvm-as \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            vmlinux \
            2>&1 | tee dce-polly-vmlinux-build.log

      # ============================================================
      # MLGO ADDITION 3
      # ============================================================
      - name: Verify MLGO Flag
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY MLGO FLAG"
          echo "============================================================"

          if grep -q \
              -- "-mllvm -regalloc-enable-advisor=release" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] MLGO flag found in real vmlinux build"

          else

            echo "[FAIL] MLGO flag not found in real vmlinux build"
            exit 1

          fi

          echo
          echo "MLGO BUILD COMMAND:"
          grep -m 1 \
            -- "-mllvm -regalloc-enable-advisor=release" \
            dce-polly-vmlinux-build.log

      # ============================================================
      # 18. VERIFY DCE + POLLY FLAGS
      # ============================================================
      - name: Verify DCE + Polly Flags
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY DCE + POLLY FLAGS"
          echo "============================================================"

          echo
          echo ">>> -mllvm -polly"

          if grep -q \
              -- "-mllvm -polly" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] -mllvm -polly found"

          else

            echo "[FAIL] -mllvm -polly not found"
            exit 1

          fi

          echo
          echo ">>> -mllvm -polly-run-dce"

          if grep -q \
              -- "-mllvm -polly-run-dce" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] -mllvm -polly-run-dce found"

          else

            echo "[FAIL] -mllvm -polly-run-dce not found"
            exit 1

          fi

          echo
          echo ">>> -ffunction-sections"

          if grep -q \
              -- "-ffunction-sections" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] -ffunction-sections found"

          else

            echo "[FAIL] -ffunction-sections not found"
            exit 1

          fi

          echo
          echo ">>> -fdata-sections"

          if grep -q \
              -- "-fdata-sections" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] -fdata-sections found"

          else

            echo "[FAIL] -fdata-sections not found"
            exit 1

          fi

          echo
          echo ">>> --gc-sections"

          if grep -q \
              -- "--gc-sections" \
              dce-polly-vmlinux-build.log; then

            echo "[OK] --gc-sections found"

          else

            echo "[FAIL] --gc-sections not found"
            exit 1

          fi

          echo
          echo "============================================================"
          echo "DCE + POLLY FLAGS SUMMARY"
          echo "============================================================"

          grep -n \
            -E \
            -- "-mllvm -polly|-mllvm -polly-run-dce|-ffunction-sections|-fdata-sections|--gc-sections" \
            dce-polly-vmlinux-build.log

      # ============================================================
      # 19. VERIFY VMLINUX
      # ============================================================
      - name: Verify vmlinux
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY VMLINUX"
          echo "============================================================"

          if [ -f arm64-test/vmlinux ]; then

            echo "[OK] arm64-test/vmlinux exists"

            ls -lh arm64-test/vmlinux

          else

            echo "[FAIL] arm64-test/vmlinux was not produced"
            exit 1

          fi

      # ============================================================
      # 20. FINAL DCE + POLLY RESULT
      # ============================================================
      - name: Final DCE + Polly Result
        run: |
          set -e

          echo
          echo "============================================================"
          echo "       DCE + POLLY + MLGO BUILD TEST RESULT"
          echo "============================================================"

          echo
          echo "CONFIGURATION:"
          grep \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            arm64-test/.config

          grep \
            "^CONFIG_POLLY_CLANG=" \
            arm64-test/.config

          grep \
            "^CONFIG_MLGO_CLANG=" \
            arm64-test/.config

          echo
          echo "STACK PROTECTOR:"
          grep \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config

          echo
          echo "MLGO FLAG:"

          grep \
            -m 1 \
            -- "-mllvm -regalloc-enable-advisor=release" \
            dce-polly-vmlinux-build.log

          echo
          echo "DCE + POLLY FLAGS:"

          grep -E \
            -- "-mllvm -polly|-mllvm -polly-run-dce|-ffunction-sections|-fdata-sections|--gc-sections" \
            dce-polly-vmlinux-build.log

          echo
          echo "VMLINUX:"
          ls -lh arm64-test/vmlinux

          echo
          echo "============================================================"
          echo "[OK] DCE + POLLY + MLGO VMLINUX BUILD SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # 21. RESTORE ARM64 KCONFIG
      # ============================================================
      - name: Restore ARM64 Kconfig
        if: always()
        run: |
          set -e

          echo "============================================================"
          echo "RESTORE ORIGINAL ARM64 KCONFIG"
          echo "============================================================"

          if [ -f arch/arm64/Kconfig.dce-polly-backup ]; then

            mv \
              arch/arm64/Kconfig.dce-polly-backup \
              arch/arm64/Kconfig

            echo "[OK] Original arch/arm64/Kconfig restored"

          else

            echo "[WARN] Backup file not found"

          fi

      # ============================================================
      # 22. UPLOAD DCE + POLLY DIAGNOSTIC
      # ============================================================
      - name: Upload DCE + Polly Diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dce-polly-mlgo-diagnostic-clang-r547379
          path: |
            dce-polly-vmlinux-build.log
