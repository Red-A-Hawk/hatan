name: Scan POLLY_DCE - xxx-17

"on":
  workflow_dispatch:

jobs:
  scan-polly-dce:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Kernel
      uses: actions/checkout@v4
      with:
        ref: xxx-17
        fetch-depth: 1

    - name: POLLY_DCE Scan
      run: |
        set -uo pipefail

        echo "============================================================"
        echo "POLLY_DCE SCAN"
        echo "============================================================"

        FAIL=0

        echo
        echo "------------------------------------------------------------"
        echo "1. Kconfig definition (arch/Kconfig)"
        echo "------------------------------------------------------------"

        if grep -n -A5 "^config POLLY_DCE" arch/Kconfig; then
          echo "[OK] POLLY_DCE defined in arch/Kconfig"
        else
          echo "[MISSING] POLLY_DCE not defined in arch/Kconfig"
          FAIL=1
        fi

        echo
        echo "------------------------------------------------------------"
        echo "2. Makefile condition (must be 'ifdef CONFIG_POLLY_DCE')"
        echo "------------------------------------------------------------"

        if grep -n "ifdef CONFIG_POLLY_DCE" Makefile; then
          echo "[OK] Makefile guards polly-run-dce with CONFIG_POLLY_DCE"
        else
          echo "[MISSING] Makefile does NOT guard polly-run-dce with CONFIG_POLLY_DCE"
          echo "[MISSING] (it may still be guarded by the old"
          echo "[MISSING]  CONFIG_LD_DEAD_CODE_DATA_ELIMINATION condition)"
          FAIL=1
        fi

        echo
        echo "------------------------------------------------------------"
        echo "3. Makefile - the actual flag line"
        echo "------------------------------------------------------------"

        if grep -n -- "-mllvm -polly-run-dce" Makefile; then
          echo "[OK] -mllvm -polly-run-dce present in Makefile"
        else
          echo "[MISSING] -mllvm -polly-run-dce NOT found in Makefile"
          FAIL=1
        fi

        echo
        echo "------------------------------------------------------------"
        echo "4. Makefile - greedy fusion must be fully removed"
        echo "------------------------------------------------------------"

        if grep -n "polly-loopfusion-greedy" Makefile; then
          echo "[WARN] 'polly-loopfusion-greedy' still referenced in Makefile"
          echo "[WARN] (expected: fully removed, only -polly-opt-fusion=max used)"
        else
          echo "[OK] No reference to polly-loopfusion-greedy in Makefile"
        fi

        echo
        echo "------------------------------------------------------------"
        echo "5. Current defconfig state (informational)"
        echo "------------------------------------------------------------"

        grep -n "CONFIG_POLLY_CLANG" \
          arch/arm64/configs/vendor/violet-perf_defconfig || \
          echo "[INFO] CONFIG_POLLY_CLANG not present in defconfig"

        grep -n "CONFIG_POLLY_DCE" \
          arch/arm64/configs/vendor/violet-perf_defconfig || \
          echo "[INFO] CONFIG_POLLY_DCE not present in defconfig"

        echo
        echo "============================================================"
        echo "VERDICT"
        echo "============================================================"

        if [ "$FAIL" -eq 0 ]; then
          echo "[OK] POLLY_DCE wiring looks complete and self-contained."
        else
          echo "[FAIL] POLLY_DCE wiring is incomplete -- see MISSING items above."
        fi

        exit "$FAIL"
