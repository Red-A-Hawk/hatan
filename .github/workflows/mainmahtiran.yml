name: Test ARM64 LD_DEAD_CODE_DATA_ELIMINATION

"on":
  workflow_dispatch:

jobs:
  test-ld-dead-code:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld

      # ============================================================
      # 3. ANALYZE ORIGINAL SUPPORT
      # ============================================================
      - name: Analyze Original Support
        run: |
          echo "============================================================"
          echo "ORIGINAL ARM64 SUPPORT ANALYSIS"
          echo "============================================================"

          echo
          echo ">>> LD_DEAD_CODE_DATA_ELIMINATION definition:"
          grep -n -A15 -B3 \
            "config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig || true

          echo
          echo ">>> ARM64 select:"
          grep -n \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/Kconfig || true

          echo
          echo ">>> Makefile support:"
          grep -n -A8 -B3 \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            Makefile || true

      # ============================================================
      # 4. BACKUP ORIGINAL ARM64 KCONFIG
      # ============================================================
      - name: Backup ARM64 Kconfig
        run: |
          cp arch/arm64/Kconfig /tmp/arm64-Kconfig.original

      # ============================================================
      # 5. TEMPORARILY ADD ARM64 SELECT
      # ============================================================
      - name: Temporarily Add ARM64 Select
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Kconfig")
          text = path.read_text()

          if "select LD_DEAD_CODE_DATA_ELIMINATION" in text:
              raise SystemExit(
                  "ERROR: select LD_DEAD_CODE_DATA_ELIMINATION "
                  "already exists in arch/arm64/Kconfig"
              )

          old = "config ARM64\n"
          new = (
              "config ARM64\n"
              "    select LD_DEAD_CODE_DATA_ELIMINATION\n"
          )

          if old not in text:
              raise SystemExit(
                  "ERROR: config ARM64 block not found"
              )

          text = text.replace(old, new, 1)
          path.write_text(text)

          print("Temporary ARM64 select added.")
          PY

          echo
          echo ">>> Temporary select:"
          grep -n -A3 \
            "config ARM64" \
            arch/arm64/Kconfig

      # ============================================================
      # 6. LOAD REAL VIOLET DEFCONFIG
      # ============================================================
      - name: Load Violet Perf Defconfig
        run: |
          rm -rf arm64-test

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/violet-perf_defconfig

      # ============================================================
      # 7. RESOLVE CONFIGURATION
      # ============================================================
      - name: Resolve Configuration
        run: |
          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # 8. PREPARE CONFIGURATION
      # ============================================================
      - name: Prepare Configuration
        run: |
          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      # ============================================================
      # 9. CHECK CONFIGURATION
      # ============================================================
      - name: Check LD_DEAD_CODE_DATA_ELIMINATION
        run: |
          set -e

          echo "============================================================"
          echo "LD_DEAD_CODE_DATA_ELIMINATION CONFIG CHECK"
          echo "============================================================"

          echo
          echo ">>> .config:"
          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            arm64-test/.config

          echo
          echo ">>> auto.conf:"
          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            arm64-test/include/config/auto.conf

          echo
          echo ">>> Verifying value..."

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
            arm64-test/.config && \
             grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
            arm64-test/include/config/auto.conf
          then
            echo
            echo "PASS: CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"
          else
            echo
            echo "FAIL: CONFIG_LD_DEAD_CODE_DATA_ELIMINATION is not enabled"
            exit 1
          fi

      # ============================================================
      # 10. CHECK KBUILD FLAGS
      # ============================================================
      - name: Check Kbuild Flags
        run: |
          set -e

          echo "============================================================"
          echo "KBUILD FLAG CHECK"
          echo "============================================================"

          echo
          echo ">>> Testing compiler flags:"

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            -n vmlinux 2>&1 | tee /tmp/vmlinux-dry-run.log

          echo
          echo ">>> -ffunction-sections:"
          if grep -q -- "-ffunction-sections" /tmp/vmlinux-dry-run.log; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi

          echo
          echo ">>> -fdata-sections:"
          if grep -q -- "-fdata-sections" /tmp/vmlinux-dry-run.log; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi

          echo
          echo ">>> --gc-sections:"
          if grep -q -- "--gc-sections" /tmp/vmlinux-dry-run.log; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "RESULT: LD_DEAD_CODE_DATA_ELIMINATION SUPPORT VERIFIED"
          echo "============================================================"

      # ============================================================
      # 11. RESTORE ORIGINAL ARM64 KCONFIG
      # ============================================================
      - name: Restore Original ARM64 Kconfig
        if: always()
        run: |
          cp /tmp/arm64-Kconfig.original arch/arm64/Kconfig

          echo "============================================================"
          echo "RESTORE CHECK"
          echo "============================================================"

          if grep -q \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/Kconfig
          then
            echo "FAIL: Temporary select still exists"
            exit 1
          else
            echo "PASS: Original arch/arm64/Kconfig restored"
          fi
