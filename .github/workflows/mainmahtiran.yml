name: Check Dead Code Data Elimination

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      - name: Verify Branch
        run: |
          echo "=========================================="
          echo " GIT INFORMATION"
          echo "=========================================="
          echo "Branch:"
          git branch --show-current
          echo
          echo "Commit:"
          git rev-parse HEAD
          echo

      - name: Check LD Dead Code Data Elimination
        run: |
          echo "=========================================="
          echo " LD_DEAD_CODE_DATA_ELIMINATION ANALYSIS"
          echo "=========================================="
          echo

          echo ">>> Searching ARM64 + Kconfig + Makefile + Scripts..."
          echo

          grep -Rns \
            --exclude-dir=.git \
            -E "LD_DEAD_CODE_DATA_ELIMINATION|--gc-sections|-ffunction-sections|-fdata-sections" \
            arch/arm64 \
            arch/Kconfig \
            Makefile \
            scripts \
            2>/dev/null || true

          echo
          echo "=========================================="
          echo " ARM64 SELECT CHECK"
          echo "=========================================="

          if grep -Rns \
            --exclude-dir=.git \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64 \
            2>/dev/null; then

            echo
            echo "RESULT: ARM64 SELECTS LD_DEAD_CODE_DATA_ELIMINATION"
          else

            echo
            echo "RESULT: ARM64 DOES NOT SELECT LD_DEAD_CODE_DATA_ELIMINATION"
          fi

          echo
          echo "=========================================="
          echo " KCONFIG DEFINITION CHECK"
          echo "=========================================="

          if grep -Rns \
            --exclude-dir=.git \
            -E "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            arch/arm64 \
            2>/dev/null; then

            echo
            echo "RESULT: KCONFIG OPTION EXISTS"
          else

            echo
            echo "RESULT: KCONFIG OPTION NOT FOUND"
          fi

          echo
          echo "=========================================="
          echo " FINAL SUMMARY"
          echo "=========================================="

          echo "Source option:"
          grep -Rns \
            --exclude-dir=.git \
            -E "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            arch/arm64 \
            2>/dev/null || echo "NOT FOUND"

          echo
          echo "ARM64 select:"
          grep -Rns \
            --exclude-dir=.git \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64 \
            2>/dev/null || echo "NOT FOUND"

          echo
          echo "Linker GC:"
          grep -Rns \
            --exclude-dir=.git \
            -- "--gc-sections" \
            arch/arm64 \
            Makefile \
            scripts \
            2>/dev/null || echo "NOT FOUND"

          echo
          echo "Function sections:"
          grep -Rns \
            --exclude-dir=.git \
            -E -- "-ffunction-sections|-fdata-sections" \
            arch/arm64 \
            Makefile \
            scripts \
            2>/dev/null || echo "NOT FOUND"
