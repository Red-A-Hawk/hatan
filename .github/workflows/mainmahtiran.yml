name: Check ARM64 LD Dead Code Support

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. GIT INFORMATION
      # ============================================================
      - name: Git Information
        run: |
          echo "=========================================="
          echo " GIT INFORMATION"
          echo "=========================================="

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # 3. KCONFIG SOURCE ANALYSIS
      # ============================================================
      - name: Check Kconfig Support
        run: |
          echo "=========================================="
          echo " KCONFIG SUPPORT ANALYSIS"
          echo "=========================================="

          echo
          echo ">>> Kconfig definition:"
          grep -Rns \
            --exclude-dir=.git \
            -E "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo ">>> Kconfig definition and help:"
          grep -Rns -A12 -B2 \
            --exclude-dir=.git \
            -E "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo ">>> ARM64 select:"
          if grep -Rns \
            --exclude-dir=.git \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64 \
            2>/dev/null; then

            echo
            echo "RESULT: ARM64 SELECTS THE OPTION"

          else

            echo
            echo "RESULT: ARM64 DOES NOT SELECT THE OPTION"

          fi

      # ============================================================
      # 4. ARM64 LINKER / SECTION ANALYSIS
      # ============================================================
      - name: Check ARM64 Linker Section Support
        run: |
          echo "=========================================="
          echo " ARM64 LINKER / SECTION ANALYSIS"
          echo "=========================================="

          echo
          echo ">>> TEXT / DATA / BSS section handling:"
          grep -Rns \
            --exclude-dir=.git \
            -E "\.text\.\*|\.data\.\*|\.bss\.\*|TEXT_MAIN|DATA_MAIN|BSS_MAIN" \
            arch/arm64 \
            include/asm-generic \
            2>/dev/null || true

          echo
          echo ">>> ARM64 linker scripts:"
          find arch/arm64 \
            -type f \
            \( -name "*.lds" -o -name "*.lds.S" \) \
            -print \
            2>/dev/null || true

          echo
          echo ">>> KEEP() directives:"
          grep -Rns \
            --exclude-dir=.git \
            -E "KEEP\(" \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo ">>> ENTRY() directives:"
          grep -Rns \
            --exclude-dir=.git \
            -E "ENTRY\(" \
            arch/arm64 \
            2>/dev/null || true

      # ============================================================
      # 5. ARM64 ENTRY POINT / GC PROTECTION ANALYSIS
      # ============================================================
      - name: Check ARM64 Entry Point Protection
        run: |
          echo "=========================================="
          echo " ARM64 ENTRY POINT / GC PROTECTION"
          echo "=========================================="

          echo
          echo ">>> Entry/init related references:"
          grep -Rns \
            --exclude-dir=.git \
            -E "__init|__entry|ENTRY" \
            arch/arm64 \
            2>/dev/null | head -n 300 || true

          echo
          echo ">>> Explicit section retention:"
          grep -Rns \
            --exclude-dir=.git \
            -E "KEEP\(|KEEP.*\.text|KEEP.*\.data|KEEP.*\.bss" \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo ">>> ARM64 linker section definitions:"
          grep -Rns \
            --exclude-dir=.git \
            -E "\.text|\.rodata|\.data|\.bss" \
            arch/arm64 \
            --include="*.lds" \
            --include="*.lds.S" \
            2>/dev/null || true

      # ============================================================
      # 6. BUILD SYSTEM ANALYSIS
      # ============================================================
      - name: Check Build System
        run: |
          echo "=========================================="
          echo " BUILD SYSTEM ANALYSIS"
          echo "=========================================="

          echo
          echo ">>> LD_DEAD_CODE_DATA_ELIMINATION references:"
          grep -Rns \
            --exclude-dir=.git \
            "LD_DEAD_CODE_DATA_ELIMINATION" \
            Makefile \
            arch \
            scripts \
            include \
            2>/dev/null || true

          echo
          echo ">>> Section compilation flags:"
          grep -Rns \
            --exclude-dir=.git \
            -E -- "-ffunction-sections|-fdata-sections" \
            Makefile \
            arch \
            scripts \
            2>/dev/null || true

          echo
          echo ">>> Linker garbage collection:"
          grep -Rns \
            --exclude-dir=.git \
            -- "--gc-sections" \
            Makefile \
            arch \
            scripts \
            2>/dev/null || true

      # ============================================================
      # 7. CREATE PURE ARM64 KCONFIG TREE
      # ============================================================
      - name: Create Pure ARM64 Kconfig Test
        run: |
          echo "=========================================="
          echo " PURE ARM64 KCONFIG TEST"
          echo "=========================================="

          rm -rf "$GITHUB_WORKSPACE/kconfig-test"

          mkdir -p "$GITHUB_WORKSPACE/kconfig-test"

          echo
          echo "Generating ARM64 allnoconfig..."

          make \
            O="$GITHUB_WORKSPACE/kconfig-test" \
            ARCH=arm64 \
            allnoconfig

          echo
          echo "Initial ARM64 configuration:"
          grep -n \
            -E "^CONFIG_(LD_DEAD_CODE_DATA_ELIMINATION|LTO|LTO_CLANG|THINLTO)=" \
            "$GITHUB_WORKSPACE/kconfig-test/.config" \
            || true

      # ============================================================
      # 8. KCONFIG TEST: DISABLED
      # ============================================================
      - name: Kconfig Test - Disabled
        run: |
          echo "=========================================="
          echo " KCONFIG TEST: DISABLED"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/kconfig-test/.config"

          scripts/config \
            --file "$CONFIG" \
            --disable LD_DEAD_CODE_DATA_ELIMINATION

          make \
            O="$GITHUB_WORKSPACE/kconfig-test" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Generated configuration:"
          grep -n \
            -E "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$CONFIG" \
            || echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION is not present"

          echo
          echo "Checking disabled state..."

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" \
            "$CONFIG"; then

            echo
            echo "RESULT: FAIL"
            echo "Option unexpectedly became enabled."
            exit 1

          else

            echo
            echo "RESULT: PASS"
            echo "Option is disabled (n or not present)."

          fi

      # ============================================================
      # 9. KCONFIG TEST: ENABLED
      # ============================================================
      - name: Kconfig Test - Enabled
        run: |
          echo "=========================================="
          echo " KCONFIG TEST: ENABLED"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/kconfig-test/.config"

          scripts/config \
            --file "$CONFIG" \
            --enable LD_DEAD_CODE_DATA_ELIMINATION

          make \
            O="$GITHUB_WORKSPACE/kconfig-test" \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Generated configuration:"
          grep -n \
            -E "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$CONFIG" \
            || echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION is not present"

          echo
          echo "Checking enabled state..."

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" \
            "$CONFIG"; then

            echo
            echo "RESULT: PASS"
            echo "ARM64 Kconfig accepts LD_DEAD_CODE_DATA_ELIMINATION=y"

          else

            echo
            echo "RESULT: FAIL"
            echo "ARM64 Kconfig refused LD_DEAD_CODE_DATA_ELIMINATION=y"
            exit 1

          fi

      # ============================================================
      # 10. BUILT CONFIGURATION / AUTO.CONF
      # ============================================================
      - name: Built Configuration Check
        run: |
          echo "=========================================="
          echo " BUILT CONFIGURATION CHECK"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/kconfig-test/.config"
          AUTO="$GITHUB_WORKSPACE/kconfig-test/include/config/auto.conf"

          echo
          echo ">>> .config:"
          grep -n \
            -E "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$CONFIG" \
            || true

          echo
          echo ">>> include/config/auto.conf:"
          grep -n \
            -E "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$AUTO" \
            || true

          echo
          echo ">>> Generated config headers:"
          if [ -f "$GITHUB_WORKSPACE/kconfig-test/include/generated/autoconf.h" ]; then
            grep -n \
              "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
              "$GITHUB_WORKSPACE/kconfig-test/include/generated/autoconf.h" \
              || true
          else
            echo "include/generated/autoconf.h not present"
          fi

          echo
          echo "Checking auto.conf..."

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" \
            "$AUTO"; then

            echo
            echo "RESULT: PASS"
            echo "Built Kconfig state contains CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"

          else

            echo
            echo "RESULT: FAIL"
            echo "Built configuration does not contain CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"
            exit 1

          fi

      # ============================================================
      # 11. MAKE VARIABLE / BUILD LOGIC CHECK
      # ============================================================
      - name: Check Make Build Logic
        run: |
          echo "=========================================="
          echo " MAKE BUILD LOGIC CHECK"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/kconfig-test/.config"

          echo
          echo "Configuration:"
          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$CONFIG" \
            || true

          echo
          echo ">>> Checking Makefile conditionals..."

          awk '
            /ifdef CONFIG_LD_DEAD_CODE_DATA_ELIMINATION/ {
              print "FOUND:", NR ":" $0
            }
          ' Makefile

          echo
          echo ">>> Expected compiler flags when enabled:"
          echo "-ffunction-sections"
          echo "-fdata-sections"

          echo
          echo ">>> Expected linker flag when enabled:"
          echo "--gc-sections"

          echo
          echo ">>> Testing Kbuild Makefile parsing with enabled config..."

          make \
            O="$GITHUB_WORKSPACE/kconfig-test" \
            ARCH=arm64 \
            -pn \
            >/tmp/kbuild_make_database.txt 2>&1 || true

          echo
          echo "Searching generated Make database for dead-code flags..."

          grep -n \
            -E -- "-ffunction-sections|-fdata-sections|--gc-sections" \
            /tmp/kbuild_make_database.txt \
            | head -n 100 \
            || true

      # ============================================================
      # 12. FINAL SUMMARY
      # ============================================================
      - name: Final Verdict
        run: |
          echo "=========================================="
          echo " FINAL VERDICT"
          echo "=========================================="

          CONFIG="$GITHUB_WORKSPACE/kconfig-test/.config"
          AUTO="$GITHUB_WORKSPACE/kconfig-test/include/config/auto.conf"

          echo
          echo "Kconfig definition:"
          grep -Rns \
            -E "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig \
            arch/arm64 \
            2>/dev/null || true

          echo
          echo "ARM64 select:"
          if grep -Rqs \
            --exclude-dir=.git \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64 \
            2>/dev/null; then

            echo "YES"

          else

            echo "NO"

          fi

          echo
          echo "Final .config:"
          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$CONFIG" \
            || true

          echo
          echo "Final auto.conf:"
          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            "$AUTO" \
            || true

          echo
          echo "=========================================="
          echo " RESULT"
          echo "=========================================="

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" \
            "$CONFIG" && \
             grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y" \
            "$AUTO"; then

            echo
            echo "PASS:"
            echo "ARM64 Kconfig can represent"
            echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"
            echo
            echo "The option survives Kconfig processing"
            echo "and appears in the built configuration."

          else

            echo
            echo "FAIL:"
            echo "The option did not survive Kconfig processing."

            exit 1

          fi

          echo
          echo "=========================================="
          echo " END OF ARM64 LD DEAD CODE SUPPORT CHECK"
          echo "=========================================="
