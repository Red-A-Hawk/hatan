name: Test ARM64 LD_DEAD_CODE_DATA_ELIMINATION

"on":
  workflow_dispatch:

jobs:
  test-ld-dead-code:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          ref: 16
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang \
            lld

      # ============================================================
      # 3. ANALYZE ORIGINAL SUPPORT
      # ============================================================
      - name: Analyze Original Support
        run: |
          echo "============================================================"
          echo "ORIGINAL ARM64 SUPPORT ANALYSIS"
          echo "============================================================"

          echo
          echo ">>> LD_DEAD_CODE_DATA_ELIMINATION definition:"

          grep -n -A15 -B3 \
            "config LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/Kconfig || true

          echo
          echo ">>> Existing ARM64 select:"

          grep -n \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/Kconfig || true

          echo
          echo ">>> Makefile support:"

          grep -n -A8 -B3 \
            "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
            Makefile || true

      # ============================================================
      # 4. BACKUP ORIGINAL ARM64 KCONFIG
      # ============================================================
      - name: Backup ARM64 Kconfig
        run: |
          set -e

          cp \
            arch/arm64/Kconfig \
            /tmp/arm64-Kconfig.original

      # ============================================================
      # 5. TEMPORARILY ADD ARM64 SELECT
      # ============================================================
      - name: Temporarily Add ARM64 Select
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Kconfig")
          text = path.read_text()

          if "select LD_DEAD_CODE_DATA_ELIMINATION" in text:
              raise SystemExit(
                  "ERROR: select LD_DEAD_CODE_DATA_ELIMINATION "
                  "already exists in arch/arm64/Kconfig"
              )

          old = "config ARM64\n"

          new = (
              "config ARM64\n"
              "    select LD_DEAD_CODE_DATA_ELIMINATION\n"
          )

          if old not in text:
              raise SystemExit(
                  "ERROR: config ARM64 block not found"
              )

          text = text.replace(old, new, 1)

          path.write_text(text)

          print("Temporary ARM64 select added.")
          PY

          echo
          echo ">>> Temporary select:"

          grep -n -A3 \
            "config ARM64" \
            arch/arm64/Kconfig

      # ============================================================
      # 6. LOAD REAL VIOLET PERF DEFCONFIG
      # ============================================================
      - name: Load Violet Perf Defconfig
        run: |
          set -e

          rm -rf arm64-test

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/violet-perf_defconfig

      # ============================================================
      # 7. DISABLE CC_STACKPROTECTOR_STRONG
      #
      # This is the workaround taken from the known working
      # PGO workflow.
      #
      # It prevents prepare-compiler-check from hard-failing on:
      #
      # Cannot use CONFIG_CC_STACKPROTECTOR_STRONG:
      # -fstack-protector-strong not supported by compiler
      # ============================================================
      - name: Disable CC_STACKPROTECTOR_STRONG Workaround
        run: |
          set -e

          echo "============================================================"
          echo "DISABLE CC_STACKPROTECTOR_STRONG / REGULAR"
          echo "============================================================"

          echo
          echo ">>> Before:"

          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config \
            || echo "(no CC_STACKPROTECTOR lines present)"

          sed -i \
            -e '/CONFIG_CC_STACKPROTECTOR_REGULAR/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_STRONG/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_AUTO/d' \
            -e '/CONFIG_CC_STACKPROTECTOR_NONE/d' \
            arm64-test/.config

          {
            echo "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_AUTO is not set"
            echo "CONFIG_CC_STACKPROTECTOR_NONE=y"
          } >> arm64-test/.config

          echo
          echo ">>> After:"

          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config

          echo
          echo "[OK] Stack protector workaround applied"

      # ============================================================
      # 8. RESOLVE CONFIGURATION
      # ============================================================
      - name: Resolve Configuration
        run: |
          set -e

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # 9. CHECK CONFIGURATION AFTER OLDDEFCONFIG
      # ============================================================
      - name: Check Configuration
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURATION CHECK"
          echo "============================================================"

          echo
          echo ">>> LD_DEAD_CODE_DATA_ELIMINATION:"

          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            arm64-test/.config

          echo
          echo ">>> Stack protector:"

          grep -E \
            "CONFIG_CC_STACKPROTECTOR" \
            arm64-test/.config

          echo
          echo ">>> Verify LD_DEAD_CODE_DATA_ELIMINATION=y"

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
            arm64-test/.config
          then
            echo "[OK] CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"
          else
            echo "[FAIL] CONFIG_LD_DEAD_CODE_DATA_ELIMINATION is not enabled"
            exit 1
          fi

          echo
          echo ">>> Verify stack protector workaround"

          if grep -q \
            "^CONFIG_CC_STACKPROTECTOR_NONE=y$" \
            arm64-test/.config &&
             ! grep -q \
            "^CONFIG_CC_STACKPROTECTOR_STRONG=y$" \
            arm64-test/.config &&
             ! grep -q \
            "^CONFIG_CC_STACKPROTECTOR_REGULAR=y$" \
            arm64-test/.config
          then
            echo "[OK] Stack protector workaround active"
          else
            echo "[FAIL] Stack protector workaround was not preserved"
            exit 1
          fi

      # ============================================================
      # 10. PREPARE CONFIGURATION
      # ============================================================
      - name: Prepare Configuration
        run: |
          set -e

          echo "============================================================"
          echo "PREPARE KERNEL CONFIGURATION"
          echo "============================================================"

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            prepare

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules_prepare

      # ============================================================
      # 11. CHECK GENERATED AUTO.CONF
      # ============================================================
      - name: Check Generated auto.conf
        run: |
          set -e

          echo "============================================================"
          echo "GENERATED CONFIGURATION CHECK"
          echo "============================================================"

          if [ ! -f \
            arm64-test/include/config/auto.conf
          ]; then

            echo "[FAIL] include/config/auto.conf was not generated"
            exit 1

          fi

          echo
          echo ">>> auto.conf:"

          grep -n \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=" \
            arm64-test/include/config/auto.conf

          echo
          echo ">>> Verify:"

          if grep -q \
            "^CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y$" \
            arm64-test/include/config/auto.conf
          then

            echo "[OK] auto.conf contains CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"

          else

            echo "[FAIL] auto.conf does not contain the option"
            exit 1

          fi

      # ============================================================
      # 12. CHECK KBUILD FLAGS
      # ============================================================
      - name: Check Kbuild Flags
        run: |
          set -e

          echo "============================================================"
          echo "KBUILD FLAG CHECK"
          echo "============================================================"

          make O="$PWD/arm64-test" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 \
            -n vmlinux \
            2>&1 \
            | tee /tmp/vmlinux-dry-run.log

          echo
          echo ">>> -ffunction-sections:"

          if grep -q \
            -- "-ffunction-sections" \
            /tmp/vmlinux-dry-run.log
          then
            echo "[OK] -ffunction-sections found"
          else
            echo "[FAIL] -ffunction-sections not found"
            exit 1
          fi

          echo
          echo ">>> -fdata-sections:"

          if grep -q \
            -- "-fdata-sections" \
            /tmp/vmlinux-dry-run.log
          then
            echo "[OK] -fdata-sections found"
          else
            echo "[FAIL] -fdata-sections not found"
            exit 1
          fi

          echo
          echo ">>> --gc-sections:"

          if grep -q \
            -- "--gc-sections" \
            /tmp/vmlinux-dry-run.log
          then
            echo "[OK] --gc-sections found"
          else
            echo "[FAIL] --gc-sections not found"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "LD_DEAD_CODE_DATA_ELIMINATION TEST: PASS"
          echo "============================================================"

      # ============================================================
      # 13. RESTORE ORIGINAL ARM64 KCONFIG
      # ============================================================
      - name: Restore Original ARM64 Kconfig
        if: always()
        run: |
          set -e

          cp \
            /tmp/arm64-Kconfig.original \
            arch/arm64/Kconfig

          echo "============================================================"
          echo "RESTORE CHECK"
          echo "============================================================"

          if grep -q \
            "select LD_DEAD_CODE_DATA_ELIMINATION" \
            arch/arm64/Kconfig
          then

            echo "[FAIL] Temporary select still exists"
            exit 1

          else

            echo "[OK] Original arch/arm64/Kconfig restored"

          fi
