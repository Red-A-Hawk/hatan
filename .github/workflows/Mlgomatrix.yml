name: Build Kernel MLGO Only Matrix

on:
  push:
    branches:
      - xxx-17
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: k

    strategy:
      fail-fast: false
      matrix:
        mlgo:
          - without
          - with

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: xxx-17
        fetch-depth: 1
        path: k

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          bc \
          bison \
          flex \
          libssl-dev \
          make \
          zip \
          unzip \
          curl \
          wget \
          libelf-dev \
          libncurses-dev \
          python3 \
          openjdk-17-jre-headless \
          bear

    - name: Clone LineageOS Toolchains
      run: |
        set -e
        rm -rf clang gcc64 gcc32

        git clone --depth=1 \
          https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
          clang

        git clone --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          gcc64

        git clone --depth=1 \
          https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          gcc32

    - name: Setup Environment
      run: |
        echo "CLANG_PATH=$GITHUB_WORKSPACE/k/clang" >> "$GITHUB_ENV"
        echo "GCC64_PATH=$GITHUB_WORKSPACE/k/gcc64" >> "$GITHUB_ENV"
        echo "GCC32_PATH=$GITHUB_WORKSPACE/k/gcc32" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE=aarch64-linux-android-" >> "$GITHUB_ENV"
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> "$GITHUB_ENV"
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

    - name: Verify toolchains
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        which clang
        clang --version

        which ld.lld
        ld.lld --version

        which llvm-ar
        which llvm-nm
        which llvm-objcopy
        which llvm-objdump
        which llvm-strip

        echo "=== BEAR ==="
        which bear
        bear --version

    - name: Load Original violet-perf defconfig
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        make O=out ARCH=arm64 vendor/violet-perf_defconfig

        test -f out/.config

    - name: Configure Matrix
      run: |
        set -e

        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        if [ "${{ matrix.mlgo }}" = "with" ]; then
          scripts/config \
            --file out/.config \
            --enable CONFIG_MLGO_CLANG
        else
          scripts/config \
            --file out/.config \
            --disable CONFIG_MLGO_CLANG
        fi

        make O=out ARCH=arm64 olddefconfig

        echo "========================================"
        echo "MLGO MODE: ${{ matrix.mlgo }}"
        echo "========================================"

        grep -E \
          'CONFIG_(LTO|THINLTO|LTO_CLANG|POLLY_CLANG|POLLY_DCE|LD_DEAD_CODE_DATA_ELIMINATION|KSU|KSU_SUSFS|NOMOUNT|MLGO_CLANG)=' \
          out/.config || true

    - name: Verify MLGO Configuration
      run: |
        set -e

        echo "========================================"
        echo "MLGO CONFIGURATION CHECK"
        echo "========================================"

        if [ "${{ matrix.mlgo }}" = "with" ]; then

          if grep -q '^CONFIG_MLGO_CLANG=y' out/.config; then
            echo "[OK] CONFIG_MLGO_CLANG=y"
          else
            echo "[ERROR] CONFIG_MLGO_CLANG is not enabled"
            exit 1
          fi

        else

          if grep -q '^CONFIG_MLGO_CLANG=y' out/.config; then
            echo "[ERROR] CONFIG_MLGO_CLANG=y in MLGO-OFF build"
            exit 1
          else
            echo "[OK] CONFIG_MLGO_CLANG=n"
          fi

        fi

    - name: Build Kernel with Bear
      run: |
        set -e

        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

        rm -f compile_commands.json

        bear -- make -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          2>&1 | tee build.log

        test -f compile_commands.json

        echo "=== COMPILE DATABASE ==="
        ls -lh compile_commands.json

    - name: Verify MLGO Flag from Bear
      run: |
        set -e

        echo "========================================"
        echo "MLGO FLAG VERIFICATION"
        echo "========================================"

        if [ "${{ matrix.mlgo }}" = "with" ]; then

          if grep -F \
            -- "-mllvm" \
            compile_commands.json | \
            grep -F \
            -- "-regalloc-enable-advisor=release"; then

            echo "[OK] MLGO Release flag found in compile_commands.json"

          else

            echo "[ERROR] MLGO Release flag NOT found"
            exit 1

          fi

        else

          if grep -F \
            -- "-regalloc-enable-advisor=release" \
            compile_commands.json; then

            echo "[ERROR] MLGO Release flag found in MLGO-OFF build"
            exit 1

          else

            echo "[OK] MLGO Release flag absent"

          fi

        fi

    - name: Measure vmlinux
      run: |
        set -e

        test -f out/vmlinux

        SIZE=$(stat -c '%s' out/vmlinux)

        echo "========================================"
        echo "MLGO MODE: ${{ matrix.mlgo }}"
        echo "vmlinux size: $SIZE bytes"
        echo "========================================"

        echo "MLGO=${{ matrix.mlgo }}" > vmlinux-size.txt
        echo "VMLINUX_SIZE=$SIZE" >> vmlinux-size.txt

    - name: Upload MLGO Evidence
      uses: actions/upload-artifact@v4
      with:
        name: mlgo-evidence-${{ matrix.mlgo }}
        path: |
          k/compile_commands.json
          k/build.log
          k/vmlinux-size.txt
