- name: Check LD_DEAD_CODE_DATA_ELIMINATION in Kernel Source
  run: |
    echo "=== Kconfig definition ==="

    if grep -Rns "^[[:space:]]*config LD_DEAD_CODE_DATA_ELIMINATION" \
        arch kernel drivers fs mm include 2>/dev/null; then
      echo
      echo "RESULT: CONFIG_LD_DEAD_CODE_DATA_ELIMINATION IS DEFINED IN KCONFIG"
    else
      echo
      echo "RESULT: CONFIG_LD_DEAD_CODE_DATA_ELIMINATION IS NOT DEFINED IN KCONFIG"
    fi

    echo
    echo "=== All references ==="
    grep -Rns "LD_DEAD_CODE_DATA_ELIMINATION" \
      arch kernel drivers fs mm include 2>/dev/null || true

    echo
    echo "=== Defconfig ==="
    grep -n "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION" \
      arch/arm64/configs/* 2>/dev/null || true
