name: Verify crDroid r547379 Against Official AOSP r547379

on:
  workflow_dispatch:

jobs:
  verify-aosp-r547379:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. DOWNLOAD CRDROID CLANG R547379
      # ============================================================
      - name: Download crDroid Clang r547379
        run: |
          set -e
          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            crdroid-clang

      # ============================================================
      # 2. DOWNLOAD OFFICIAL AOSP CLANG R547379
      # ============================================================
      - name: Download Official AOSP Clang r547379
        run: |
          set -e
          AOSP_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main/clang-r547379"
          AOSP_ARCHIVE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          echo "========================================"
          echo "OFFICIAL AOSP R547379"
          echo "========================================"
          echo
          echo "AOSP SOURCE:"
          echo "$AOSP_URL"
          echo
          echo "AOSP ARCHIVE:"
          echo "$AOSP_ARCHIVE"
          curl -fL \
            "$AOSP_ARCHIVE" \
            -o /tmp/clang-r547379-aosp.tar.gz
          mkdir -p aosp-clang
          tar -xzf \
            /tmp/clang-r547379-aosp.tar.gz \
            -C aosp-clang
          echo
          echo "----- AOSP files -----"
          ls -lah aosp-clang
          echo
          echo "----- AOSP bin -----"
          ls -lah aosp-clang/bin

      # ============================================================
      # 3. VERIFY CRDROID VERSION
      # ============================================================
      - name: Verify crDroid Version
        run: |
          set -e
          echo "========================================"
          echo "CRDROID CLANG VERSION"
          echo "========================================"
          crdroid-clang/bin/clang-20 --version

      # ============================================================
      # 4. VERIFY AOSP VERSION
      # ============================================================
      - name: Verify AOSP Version
        run: |
          set -e
          echo "========================================"
          echo "AOSP CLANG VERSION"
          echo "========================================"
          aosp-clang/bin/clang-20 --version

      # ============================================================
      # 5. VERIFY AOSP BUILD INFO
      # ============================================================
      - name: Verify AOSP Build Information
        run: |
          set -e
          echo "========================================"
          echo "AOSP BUILD INFO"
          echo "========================================"
          cat aosp-clang/BUILD_INFO
          echo
          echo "========================================"
          echo "AOSP MANIFEST"
          echo "========================================"
          ls -lh aosp-clang/manifest_13174946.xml

      # ============================================================
      # 6. CALCULATE SHA256
      # ============================================================
      - name: Calculate SHA256
        run: |
          set -e
          CRDROID_BIN="crdroid-clang/bin/clang-20"
          AOSP_BIN="aosp-clang/bin/clang-20"
          echo "========================================"
          echo "SHA256 COMPARISON"
          echo "========================================"
          echo
          echo "----- crDroid clang-20 -----"
          sha256sum "$CRDROID_BIN"
          echo
          echo "----- AOSP clang-20 -----"
          sha256sum "$AOSP_BIN"
          CRDROID_SHA256="$(sha256sum "$CRDROID_BIN" | awk '{print $1}')"
          AOSP_SHA256="$(sha256sum "$AOSP_BIN" | awk '{print $1}')"
          echo
          echo "----- SHA256 VALUES -----"
          echo "crDroid:"
          echo "$CRDROID_SHA256"
          echo
          echo "AOSP:"
          echo "$AOSP_SHA256"
          echo
          echo "----- SHA256 RESULT -----"
          if [ "$CRDROID_SHA256" = "$AOSP_SHA256" ]; then
            echo "[MATCH] crDroid clang-20 is byte-for-byte identical to AOSP clang-20"
          else
            echo "[DIFFERENT] crDroid clang-20 differs from AOSP clang-20"
          fi

      # ============================================================
      # 7. COMPARE BINARY SIZE
      # ============================================================
      - name: Compare Binary Size
        run: |
          set -e
          CRDROID_BIN="crdroid-clang/bin/clang-20"
          AOSP_BIN="aosp-clang/bin/clang-20"
          echo "========================================"
          echo "BINARY SIZE COMPARISON"
          echo "========================================"
          echo
          echo "----- crDroid -----"
          stat -c '%n %s bytes' "$CRDROID_BIN"
          echo
          echo "----- AOSP -----"
          stat -c '%n %s bytes' "$AOSP_BIN"
          echo
          echo "----- BINARY CMP -----"
          if cmp -s "$CRDROID_BIN" "$AOSP_BIN"; then
            echo "[IDENTICAL] Binary files are identical"
          else
            echo "[DIFFERENT] Binary files are different"
          fi

      # ============================================================
      # 8. VERIFY MLGO IN CRDROID
      # ============================================================
      - name: Verify MLGO In crDroid
        run: |
          set -e
          echo "========================================"
          echo "CRDROID MLGO"
          echo "========================================"
          BIN="crdroid-clang/bin/clang-20"
          strings -a "$BIN" \
            | grep -Ei 'MLGO|mlgo|regalloc.*evict|regalloc.*advisor' \
            | sort -u \
            | tee /tmp/crdroid-mlgo.txt \
            || true

      # ============================================================
      # 9. VERIFY MLGO IN AOSP
      # ============================================================
      - name: Verify MLGO In AOSP
        run: |
          set -e
          echo "========================================"
          echo "AOSP MLGO"
          echo "========================================"
          BIN="aosp-clang/bin/clang-20"
          strings -a "$BIN" \
            | grep -Ei 'MLGO|mlgo|regalloc.*evict|regalloc.*advisor' \
            | sort -u \
            | tee /tmp/aosp-mlgo.txt \
            || true

      # ============================================================
      # 10. VERIFY AARCH64 MLGO MODEL REFERENCE
      # ============================================================
      - name: Verify AArch64 MLGO Model Reference
        run: |
          set -e
          echo "========================================"
          echo "AARCH64 MLGO MODEL REFERENCE"
          echo "========================================"
          echo
          echo "Checking AOSP BUILD_INFO for MLGO..."
          if grep -Fq -- '--mlgo' aosp-clang/BUILD_INFO; then
            echo "[FOUND] AOSP build was configured with --mlgo"
          else
            echo "[NOT FOUND] --mlgo was not found in BUILD_INFO"
          fi
          echo
          echo "Checking AOSP LLVM revision..."
          grep -F '"revision": "b718bcaf8c198c82f3021447d943401e3ab5bd54"' \
            aosp-clang/BUILD_INFO \
            || true

      # ============================================================
      # 11. TEST CRDROID RELEASE ADVISOR
      # ============================================================
      - name: Test crDroid Release Advisor
        run: |
          set -e
          echo "========================================"
          echo "CRDROID RELEASE ADVISOR TEST"
          echo "========================================"
          cat > /tmp/mlgo_test.c <<'EOF'
          __attribute__((noinline)) long mlgo_test(
              long a, long b, long c, long d, long e, long f,
              long g, long h, long i, long j, long k, long l) {
            long r0 = a + b;
            long r1 = c + d;
            long r2 = e + f;
            long r3 = g + h;
            long r4 = i + j;
            long r5 = k + l;
            long r6 = r0 * r1;
            long r7 = r2 * r3;
            long r8 = r4 * r5;
            long r9 = r6 + r7;
            long r10 = r8 + r0;
            long r11 = r9 * r10;
            return r11 + r6 + r7 + r8 + r1 + r2 + r3;
          }
          EOF
          crdroid-clang/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/crdroid-release.s \
            -mllvm -regalloc-enable-advisor=release \
            2>&1 | tee /tmp/crdroid-release.log
          echo
          echo "----- Check fallback -----"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/crdroid-release.log; then
            echo "[FALLBACK] crDroid Release advisor fell back to default"
          else
            echo "[NO FALLBACK] crDroid Release advisor did not report fallback"
          fi

      # ============================================================
      # 12. TEST AOSP RELEASE ADVISOR
      # ============================================================
      - name: Test AOSP Release Advisor
        run: |
          set -e
          echo "========================================"
          echo "AOSP RELEASE ADVISOR TEST"
          echo "========================================"
          aosp-clang/bin/clang-20 \
            -target aarch64-linux-android \
            -O2 \
            -S \
            /tmp/mlgo_test.c \
            -o /tmp/aosp-release.s \
            -mllvm -regalloc-enable-advisor=release \
            2>&1 | tee /tmp/aosp-release.log
          echo
          echo "----- Check fallback -----"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/aosp-release.log; then
            echo "[FALLBACK] AOSP Release advisor fell back to default"
          else
            echo "[NO FALLBACK] AOSP Release advisor did not report fallback"
          fi

      # ============================================================
      # 13. COMPARE AOSP AND CRDROID ASSEMBLY
      # ============================================================
      - name: Compare AOSP And crDroid Assembly
        run: |
          set -e
          echo "========================================"
          echo "AOSP / CRDROID ASSEMBLY COMPARISON"
          echo "========================================"
          if cmp -s \
              /tmp/crdroid-release.s \
              /tmp/aosp-release.s; then
            echo "[IDENTICAL] AOSP and crDroid Release assembly are identical"
          else
            echo "[DIFFERENT] AOSP and crDroid Release assembly differ"
          fi

      # ============================================================
      # 14. FINAL RESULT
      # ============================================================
      - name: Final Result
        run: |
          echo "========================================"
          echo "FINAL AOSP / CRDROID MLGO RESULT"
          echo "========================================"
          CRDROID_BIN="crdroid-clang/bin/clang-20"
          AOSP_BIN="aosp-clang/bin/clang-20"
          CRDROID_SHA256="$(sha256sum "$CRDROID_BIN" | awk '{print $1}')"
          AOSP_SHA256="$(sha256sum "$AOSP_BIN" | awk '{print $1}')"
          echo
          echo "1. crDroid SHA256"
          echo "$CRDROID_SHA256"
          echo
          echo "2. AOSP SHA256"
          echo "$AOSP_SHA256"
          echo
          echo "3. Binary identity"
          if [ "$CRDROID_SHA256" = "$AOSP_SHA256" ]; then
            echo "[CONFIRMED] crDroid clang-20 == official AOSP clang-20"
          else
            echo "[NOT IDENTICAL] crDroid clang-20 != official AOSP clang-20"
          fi
          echo
          echo "4. AOSP MLGO build"
          if grep -Fq -- '--mlgo' aosp-clang/BUILD_INFO; then
            echo "[CONFIRMED] Official AOSP r547379 was built with --mlgo"
          else
            echo "[NOT CONFIRMED] --mlgo not found in AOSP BUILD_INFO"
          fi
          echo
          echo "5. crDroid Release advisor"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/crdroid-release.log; then
            echo "[FALLBACK] crDroid Release advisor fell back to default"
          else
            echo "[NO FALLBACK] crDroid Release advisor did not report fallback"
          fi
          echo
          echo "6. AOSP Release advisor"
          if grep -Fq "Requested regalloc eviction advisor analysis could not be created. Using default" \
              /tmp/aosp-release.log; then
            echo "[FALLBACK] AOSP Release advisor fell back to default"
          else
            echo "[NO FALLBACK] AOSP Release advisor did not report fallback"
          fi
          echo
          echo "7. AArch64 backend"
          if [ -s /tmp/crdroid-release.s ]; then
            echo "[OK] crDroid AArch64 compilation succeeded"
          else
            echo "[FAIL] crDroid AArch64 assembly missing"
          fi
          if [ -s /tmp/aosp-release.s ]; then
            echo "[OK] AOSP AArch64 compilation succeeded"
          else
            echo "[FAIL] AOSP AArch64 assembly missing"
          fi
          echo
          echo "========================================"
          echo "INTERPRETATION"
          echo "========================================"
          echo "SHA256 MATCH = byte-for-byte identical Clang binaries."
          echo "AOSP --mlgo = official AOSP build included MLGO."
          echo "NO FALLBACK = Release advisor did not report fallback."
          echo "Assembly equality alone does not prove model absence."

      # ============================================================
      # 15. UPLOAD EVIDENCE
      # ============================================================
      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        with:
          name: aosp-crdroid-r547379-mlgo-evidence
          path: |
            /tmp/clang-r547379-aosp.tar.gz
            /tmp/crdroid-mlgo.txt
            /tmp/aosp-mlgo.txt
            /tmp/crdroid-release.log
            /tmp/crdroid-release.s
            /tmp/aosp-release.log
            /tmp/aosp-release.s
