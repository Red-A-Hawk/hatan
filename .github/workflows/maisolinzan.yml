name: Create Independent xxx-20 Repository

on:
  workflow_dispatch:

jobs:
  create-repository:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/los_kernel_xiaomi_sm6150
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source repository
        run: |
          set -e

          REPO="Red-A-Hawk/los_kernel_xiaomi_sm6150"

          echo "Source repository:"
          echo "$REPO"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Remote branches:"
          git branch -r

      - name: Create independent repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          REPO="Red-A-Hawk/xxx-20"

          echo "Creating repository:"
          echo "$REPO"

          gh repo create "$REPO" \
            --public \
            --source=. \
            --remote=origin-new

          echo
          echo "Pushing all branches..."

          git push origin-new --all

          echo
          echo "Repository created successfully:"
          gh repo view "$REPO" --json nameWithOwner,url -q '.nameWithOwner + " | " + .url'

          echo
          echo "Branches pushed:"
          git ls-remote --heads origin-new
