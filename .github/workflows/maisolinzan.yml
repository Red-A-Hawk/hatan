name: Create Independent xxx-20 Repository

on:
  workflow_dispatch:

jobs:
  create-repository:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE REPOSITORY
      # ============================================================
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Red-A-Hawk/los_kernel_xiaomi_sm6150
          fetch-depth: 0
          persist-credentials: false

      # ============================================================
      # 2. VERIFY SOURCE REPOSITORY
      # ============================================================
      - name: Verify source repository
        run: |
          set -e

          echo "Source repository:"
          echo "Red-A-Hawk/los_kernel_xiaomi_sm6150"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Available branches:"
          git branch -r

      # ============================================================
      # 3. CREATE INDEPENDENT REPOSITORY
      # ============================================================
      - name: Create independent repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          REPO="Red-A-Hawk/xxx-20"

          echo "Creating repository:"
          echo "$REPO"

          gh repo create "$REPO" \
            --public \
            --source=. \
            --remote=origin-new

      # ============================================================
      # 4. PUSH ALL BRANCHES
      # ============================================================
      - name: Push all branches
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          REPO="Red-A-Hawk/xxx-20"

          git remote set-url origin-new \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          echo "Pushing all branches..."

          git push origin-new --all

          echo
          echo "All branches pushed successfully."

      # ============================================================
      # 5. VERIFY NEW REPOSITORY
      # ============================================================
      - name: Verify new repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          REPO="Red-A-Hawk/xxx-20"

          echo
          echo "Repository:"
          gh repo view "$REPO" \
            --json nameWithOwner,url \
            -q '.nameWithOwner + " | " + .url'

          echo
          echo "Branches in new repository:"
          git ls-remote --heads origin-new
