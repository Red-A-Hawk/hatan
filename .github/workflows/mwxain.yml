name: Compare With Manipvlator - Compare Only

on:
  workflow_dispatch:

jobs:
  compare-manipvlator:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 16
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURATION
      # ============================================================
      - name: Configure Comparison
        continue-on-error: true
        run: |
          set +e

          MANIP_REPO="https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git"

          START_COMMIT="a6d46b186e893765fdd97bf1369626a26e225d5d"

          echo "MANIP_REPO=$MANIP_REPO" >> "$GITHUB_ENV"
          echo "START_COMMIT=$START_COMMIT" >> "$GITHUB_ENV"

          echo "============================================================"
          echo " MANIPVLATOR KERNEL COMPARISON"
          echo "============================================================"
          echo "Target repository : Red-A-Hawk/los_kernel_xiaomi_sm6150"
          echo "Target branch     : 16"
          echo "Start commit      : $START_COMMIT"
          echo "Direction         : OLDEST -> NEWEST"
          echo "Mode              : COMPARE ONLY"
          echo "Patch generation  : DISABLED"
          echo "============================================================"

      # ============================================================
      # 3. FETCH MANIPVLATOR
      # ============================================================
      - name: Fetch Manipvlator
        continue-on-error: true
        run: |
          set +e

          git remote remove manipvlator 2>/dev/null || true

          git remote add manipvlator "$MANIP_REPO"

          git fetch --no-tags manipvlator

          FETCH_RC=$?

          echo "Fetch exit code: $FETCH_RC"

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "ERROR: Failed to fetch Manipvlator."
            exit 0
          fi

          echo
          echo "============================================================"
          echo " START COMMIT"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$START_COMMIT"

      # ============================================================
      # 4. DETECT MANIPVLATOR HEAD
      # ============================================================
      - name: Detect Manipvlator HEAD
        continue-on-error: true
        run: |
          set +e

          MANIP_BRANCH="$(
            git remote show manipvlator 2>/dev/null |
            sed -n '/HEAD branch/s/.*: //p'
          )"

          if [ -z "$MANIP_BRANCH" ]; then
            MANIP_BRANCH="stable"
          fi

          MANIP_REF="refs/remotes/manipvlator/$MANIP_BRANCH"

          if ! git rev-parse "$MANIP_REF" >/dev/null 2>&1; then
            echo "Detected branch could not be resolved."
            echo "Trying stable..."

            MANIP_BRANCH="stable"
            MANIP_REF="refs/remotes/manipvlator/stable"
          fi

          if ! git rev-parse "$MANIP_REF" >/dev/null 2>&1; then
            echo "ERROR: Manipvlator reference not found."
            exit 0
          fi

          MANIP_HEAD="$(git rev-parse "$MANIP_REF")"

          echo "MANIP_BRANCH=$MANIP_BRANCH" >> "$GITHUB_ENV"
          echo "MANIP_REF=$MANIP_REF" >> "$GITHUB_ENV"
          echo "MANIP_HEAD=$MANIP_HEAD" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " MANIPVLATOR HEAD"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$MANIP_HEAD"

      # ============================================================
      # 5. VERIFY RANGE
      # ============================================================
      - name: Verify Comparison Range
        continue-on-error: true
        run: |
          set +e

          if ! git merge-base --is-ancestor \
            "$START_COMMIT" \
            "$MANIP_HEAD"; then

            echo "ERROR:"
            echo "$START_COMMIT is not an ancestor of $MANIP_HEAD"

            exit 0
          fi

          echo
          echo "============================================================"
          echo " RANGE VERIFIED"
          echo "============================================================"
          echo "START:"
          echo "$START_COMMIT"
          echo
          echo "END:"
          echo "$MANIP_HEAD"
          echo
          echo "Everything before START_COMMIT will be ignored."
          echo "START_COMMIT itself WILL be analyzed."

      # ============================================================
      # 6. PREPARE ANALYSIS DIRECTORIES
      #
      # NO PATCH DIRECTORY.
      # NO PATCH FILES.
      # ============================================================
      - name: Prepare Analysis Directories
        continue-on-error: true
        run: |
          set +e

          rm -rf manipvlator-analysis

          mkdir -p \
            manipvlator-analysis/logs \
            manipvlator-analysis/patch-id

          touch manipvlator-analysis/missing.txt
          touch manipvlator-analysis/already-present.txt
          touch manipvlator-analysis/errors.txt
          touch manipvlator-analysis/skipped.txt

      # ============================================================
      # 7. COLLECT COMMITS
      #
      # START COMMIT IS INCLUDED.
      #
      # ORDER:
      # OLDEST -> NEWEST
      # ============================================================
      - name: Collect Manipvlator Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="manipvlator-analysis/manipvlator-commits.txt"

          echo "$START_COMMIT" > "$COMMITS_FILE"

          git rev-list \
            --reverse \
            "$START_COMMIT..$MANIP_HEAD" \
            >> "$COMMITS_FILE"

          TOTAL="$(wc -l < "$COMMITS_FILE")"

          echo "MANIP_COMMIT_COUNT=$TOTAL" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " COMMITS TO ANALYZE"
          echo "============================================================"
          echo "Total commits: $TOTAL"
          echo "Order: OLDEST -> NEWEST"
          echo

          nl -ba "$COMMITS_FILE"

      # ============================================================
      # 8. BUILD TARGET PATCH-ID DATABASE
      #
      # COMPARE ONLY.
      #
      # NO PATCH FILES ARE CREATED.
      #
      # Every target commit is converted to a stable patch-id.
      # SHA <-> PATCH-ID mapping is preserved.
      # ============================================================
      - name: Build Target Patch-ID Database
        continue-on-error: true
        run: |
          set +e

          TARGET_PATCH_IDS="manipvlator-analysis/patch-id/target.patchids"

          : > "$TARGET_PATCH_IDS"

          echo "============================================================"
          echo " BUILDING TARGET PATCH-ID DATABASE"
          echo "============================================================"
          echo
          echo "No patch files will be generated."
          echo

          TARGET_COMMITS="$(
            git log \
              --all \
              --format='%H'
          )"

          TARGET_TOTAL="$(
            echo "$TARGET_COMMITS" |
            grep -c . \
            2>/dev/null || true
          )"

          echo "Target commits found: $TARGET_TOTAL"

          TARGET_INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            TARGET_INDEX=$((TARGET_INDEX + 1))

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            # ------------------------------------------------------
            # NORMAL COMMIT
            # ------------------------------------------------------
            if [ "$PARENT_COUNT" -le 1 ]; then

              PATCH_ID="$(
                git show \
                  --format= \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            # ------------------------------------------------------
            # MERGE COMMIT
            # Compare against FIRST PARENT.
            # ------------------------------------------------------
            else

              FIRST_PARENT="$(
                echo "$PARENTS" | awk '{print $1}'
              )"

              PATCH_ID="$(
                git diff \
                  "$FIRST_PARENT" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            fi

            if [ -n "$PATCH_ID" ]; then

              echo "$PATCH_ID $SHA" \
                >> "$TARGET_PATCH_IDS"

            fi

            if [ $((TARGET_INDEX % 1000)) -eq 0 ]; then
              echo "Processed target commits: $TARGET_INDEX / $TARGET_TOTAL"
            fi

          done <<< "$TARGET_COMMITS"

          sort -u \
            "$TARGET_PATCH_IDS" \
            -o "$TARGET_PATCH_IDS"

          TARGET_PATCH_COUNT="$(
            wc -l < "$TARGET_PATCH_IDS"
          )"

          echo "TARGET_PATCH_ID_COUNT=$TARGET_PATCH_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Target patch IDs: $TARGET_PATCH_COUNT"

      # ============================================================
      # 9. COMPARE MANIPVLATOR COMMITS
      #
      # IMPORTANT:
      #
      # NO PATCH GENERATION.
      # NO git format-patch.
      # NO git diff output files.
      # NO git apply.
      #
      # Only:
      #   SHA
      #   date
      #   author
      #   subject
      #   patch-id
      #   target equivalent
      #   changed files
      # ============================================================
      - name: Compare Manipvlator Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="manipvlator-analysis/manipvlator-commits.txt"
          TARGET_PATCH_IDS="manipvlator-analysis/patch-id/target.patchids"

          REPORT="manipvlator-analysis/report.md"

          cat > "$REPORT" <<EOF
          # Manipvlator Kernel Comparison

          ## Target

          Repository:

          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:

          16

          ## Reference

          Repository:

          manipvlator/los_kernel_xiaomi_sm6150

          Branch:

          $MANIP_BRANCH

          HEAD:

          $MANIP_HEAD

          ## Range

          Start:

          $START_COMMIT

          End:

          $MANIP_HEAD

          The START commit itself is included.

          Everything before START_COMMIT is ignored.

          Analysis order:

          OLDEST -> NEWEST

          ## Mode

          COMPARE ONLY

          Patch generation:

          DISABLED

          Patch application:

          DISABLED

          Source modification:

          DISABLED

          EOF

          INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            INDEX=$((INDEX + 1))

            echo
            echo "============================================================"
            echo " COMMIT $INDEX / $MANIP_COMMIT_COUNT"
            echo "============================================================"
            echo "SHA: $SHA"

            SUBJECT="$(
              git show -s \
                --format='%s' \
                "$SHA" 2>/dev/null
            )"

            DATE="$(
              git show -s \
                --format='%ad' \
                --date=iso-strict \
                "$SHA" 2>/dev/null
            )"

            AUTHOR="$(
              git show -s \
                --format='%an <%ae>' \
                "$SHA" 2>/dev/null
            )"

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            echo "Subject : $SUBJECT"
            echo "Date    : $DATE"
            echo "Author  : $AUTHOR"
            echo "Parents : $PARENT_COUNT"

            # ------------------------------------------------------
            # PATCH-ID
            # ------------------------------------------------------
            if [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" | awk '{print $1}'
              )"

              PATCH_ID="$(
                git diff \
                  "$FIRST_PARENT" \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            else

              PATCH_ID="$(
                git show \
                  --format= \
                  "$SHA" 2>/dev/null |
                git patch-id --stable 2>/dev/null |
                awk '{print $1}'
              )"

            fi

            echo "Patch ID: $PATCH_ID"

            # ------------------------------------------------------
            # PATCH-ID UNAVAILABLE
            # ------------------------------------------------------
            if [ -z "$PATCH_ID" ]; then

              echo "STATUS: PATCH-ID UNAVAILABLE"

              printf '%s | %s | patch-id unavailable | %s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                >> manipvlator-analysis/errors.txt

              continue
            fi

            # ------------------------------------------------------
            # CHECK AGAINST TARGET
            # ------------------------------------------------------
            MATCH_SHA="$(
              awk \
                -v id="$PATCH_ID" \
                '$1 == id {print $2; exit}' \
                "$TARGET_PATCH_IDS"
            )"

            # ------------------------------------------------------
            # ALREADY PRESENT
            # ------------------------------------------------------
            if [ -n "$MATCH_SHA" ]; then

              echo "STATUS: ALREADY PRESENT / EQUIVALENT"
              echo "Target equivalent SHA: $MATCH_SHA"

              printf '%s | %s | %s | equivalent=%s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                "$MATCH_SHA" \
                >> manipvlator-analysis/already-present.txt

              continue
            fi

            # ------------------------------------------------------
            # MISSING
            #
            # ONLY RECORD INFORMATION.
            #
            # NO PATCH IS GENERATED.
            # ------------------------------------------------------
            echo "STATUS: MISSING"

            FILES="$(
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" 2>/dev/null
            )"

            SUBSYSTEM="OTHER"

            if echo "$FILES" | grep -q 'arch/'; then
              SUBSYSTEM="ARCH"

            elif echo "$FILES" | grep -q 'drivers/'; then
              SUBSYSTEM="DRIVERS"

            elif echo "$FILES" | grep -q 'fs/'; then
              SUBSYSTEM="FILESYSTEM"

            elif echo "$FILES" | grep -q 'mm/'; then
              SUBSYSTEM="MM"

            elif echo "$FILES" | grep -q 'net/'; then
              SUBSYSTEM="NETWORK"

            elif echo "$FILES" | grep -q 'kernel/'; then
              SUBSYSTEM="KERNEL"

            elif echo "$FILES" | grep -q 'include/'; then
              SUBSYSTEM="INCLUDE"

            elif echo "$FILES" | grep -q 'security/'; then
              SUBSYSTEM="SECURITY"

            elif echo "$FILES" | grep -q 'crypto/'; then
              SUBSYSTEM="CRYPTO"

            elif echo "$FILES" | grep -q 'block/'; then
              SUBSYSTEM="BLOCK"

            elif echo "$FILES" | grep -q 'ipc/'; then
              SUBSYSTEM="IPC"

            elif echo "$FILES" | grep -q 'scripts/'; then
              SUBSYSTEM="SCRIPTS"
            fi

            printf '%s | %s | %s | %s | %s\n' \
              "$SHA" \
              "$DATE" \
              "$SUBSYSTEM" \
              "$PATCH_ID" \
              "$SUBJECT" \
              >> manipvlator-analysis/missing.txt

            cat >> "$REPORT" <<EOF

          ---

          ## $INDEX — $SHA

          **Subject**

          $SUBJECT

          **Date**

          $DATE

          **Author**

          $AUTHOR

          **Parent count**

          $PARENT_COUNT

          **Patch ID**

          $PATCH_ID

          **Subsystem**

          $SUBSYSTEM

          ### Changed files

          \`\`\`
          $FILES
          \`\`\`

          **Patch generation**

          NOT PERFORMED

          EOF

          done < "$COMMITS_FILE"

      # ============================================================
      # 10. FINAL METADATA
      # ============================================================
      - name: Generate Final Metadata
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            manipvlator-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            manipvlator-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            manipvlator-analysis/errors.txt \
            2>/dev/null || true
          )"

          cat > manipvlator-analysis/metadata.txt <<EOF
          Manipvlator Comparison Metadata
          =================================

          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Reference repository:
          manipvlator/los_kernel_xiaomi_sm6150

          Reference branch:
          $MANIP_BRANCH

          Start commit:
          $START_COMMIT

          Reference HEAD:
          $MANIP_HEAD

          Total commits analyzed:
          $MANIP_COMMIT_COUNT

          Missing:
          $MISSING_COUNT

          Already present/equivalent:
          $PRESENT_COUNT

          Errors:
          $ERROR_COUNT

          Target patch IDs:
          $TARGET_PATCH_ID_COUNT

          Direction:
          OLDEST -> NEWEST

          START COMMIT INCLUDED:
          YES

          COMMITS BEFORE START:
          NOT ANALYZED

          Patch generation:
          DISABLED

          Patch application:
          DISABLED

          Cherry-pick:
          NO

          Commit:
          NO

          Push:
          NO

          Reset:
          NO

          Source modification:
          NO
          EOF

          cat > manipvlator-analysis/README.txt <<EOF
          Manipvlator Kernel Comparison
          ==============================

          Target:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          Reference:
          manipvlator/los_kernel_xiaomi_sm6150

          Start:
          $START_COMMIT

          End:
          $MANIP_HEAD

          The START commit itself is included.

          Everything before START_COMMIT is ignored.

          Commits are processed oldest to newest.

          Patch-ID is used to detect equivalent changes.

          This workflow ONLY compares commits.

          NO patch files are generated.

          NO patches are applied.

          NO source files are modified.

          NO commits are created.

          NO push is performed.

          NO reset is performed.

          Patch generation will be handled separately
          after the comparison results are reviewed.
          EOF

          echo
          echo "============================================================"
          echo " FINAL RESULT"
          echo "============================================================"
          echo "Start commit : $START_COMMIT"
          echo "End commit   : $MANIP_HEAD"
          echo "Analyzed     : $MANIP_COMMIT_COUNT"
          echo "Missing      : $MISSING_COUNT"
          echo "Present      : $PRESENT_COUNT"
          echo "Errors       : $ERROR_COUNT"
          echo "Target IDs   : $TARGET_PATCH_ID_COUNT"
          echo "============================================================"

      # ============================================================
      # 11. GITHUB STEP SUMMARY
      # ============================================================
      - name: GitHub Summary
        if: always()
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            manipvlator-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            manipvlator-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            manipvlator-analysis/errors.txt \
            2>/dev/null || true
          )"

          {
            echo "## Manipvlator Kernel Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Target branch | \`16\` |"
            echo "| Start commit | \`$START_COMMIT\` |"
            echo "| Reference branch | \`$MANIP_BRANCH\` |"
            echo "| Reference HEAD | \`$MANIP_HEAD\` |"
            echo "| Commits analyzed | $MANIP_COMMIT_COUNT |"
            echo "| Missing | $MISSING_COUNT |"
            echo "| Already present/equivalent | $PRESENT_COUNT |"
            echo "| Errors | $ERROR_COUNT |"
            echo "| Target patch IDs | $TARGET_PATCH_ID_COUNT |"
            echo
            echo "### Mode"
            echo
            echo "COMPARE ONLY"
            echo
            echo "No patch files were generated."
            echo
            echo "No patches were applied."
            echo
            echo "### Range"
            echo
            echo "Analysis begins at:"
            echo
            echo "\`$START_COMMIT\`"
            echo
            echo "The START commit itself is included."
            echo
            echo "Everything before it is ignored."
            echo
            echo "### Safety"
            echo
            echo "- No cherry-pick"
            echo "- No commit"
            echo "- No push"
            echo "- No reset"
            echo "- No source modification"
            echo "- No patch generation"
            echo "- No patch application"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 12. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Manipvlator Analysis
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: manipvlator-comparison-only
          path: manipvlator-analysis/
          if-no-files-found: warn
          retention-days: 30
