name: Compare With Manipvlator

on:
  workflow_dispatch:

jobs:
  compare-manipvlator:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET KERNEL
      # ============================================================
      - name: Checkout Kernel Branch 16
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: 16
          fetch-depth: 0

      # ============================================================
      # 2. CONFIGURATION
      # ============================================================
      - name: Configure Comparison
        continue-on-error: true
        run: |
          set +e

          MANIP_REPO="https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git"

          START_COMMIT="a6d46b186e893765fdd97bf1369626a26e225d5d"

          echo "MANIP_REPO=$MANIP_REPO" >> "$GITHUB_ENV"
          echo "START_COMMIT=$START_COMMIT" >> "$GITHUB_ENV"

          echo "============================================================"
          echo " MANIPVLATOR KERNEL COMPARISON"
          echo "============================================================"
          echo "Target repository : Red-A-Hawk/los_kernel_xiaomi_sm6150"
          echo "Target branch     : 16"
          echo "Start commit      : $START_COMMIT"
          echo "Direction         : OLDEST -> NEWEST"
          echo "============================================================"

      # ============================================================
      # 3. FETCH MANIPVLATOR
      # ============================================================
      - name: Fetch Manipvlator
        continue-on-error: true
        run: |
          set +e

          git remote remove manipvlator 2>/dev/null || true

          git remote add manipvlator "$MANIP_REPO"

          git fetch --no-tags manipvlator

          FETCH_RC=$?

          echo "Fetch exit code: $FETCH_RC"

          if [ "$FETCH_RC" -ne 0 ]; then
            echo "ERROR: Failed to fetch Manipvlator."
            exit 0
          fi

          echo
          echo "============================================================"
          echo " START COMMIT"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$START_COMMIT"

      # ============================================================
      # 4. DETECT MANIPVLATOR HEAD
      # ============================================================
      - name: Detect Manipvlator HEAD
        continue-on-error: true
        run: |
          set +e

          MANIP_BRANCH="$(
            git remote show manipvlator 2>/dev/null |
            sed -n '/HEAD branch/s/.*: //p'
          )"

          if [ -z "$MANIP_BRANCH" ]; then
            MANIP_BRANCH="stable"
          fi

          MANIP_REF="refs/remotes/manipvlator/$MANIP_BRANCH"

          if ! git rev-parse "$MANIP_REF" >/dev/null 2>&1; then
            echo "Detected branch could not be resolved."
            echo "Trying stable..."

            MANIP_BRANCH="stable"
            MANIP_REF="refs/remotes/manipvlator/stable"
          fi

          if ! git rev-parse "$MANIP_REF" >/dev/null 2>&1; then
            echo "ERROR: Manipvlator reference not found."
            exit 0
          fi

          MANIP_HEAD="$(git rev-parse "$MANIP_REF")"

          echo "MANIP_BRANCH=$MANIP_BRANCH" >> "$GITHUB_ENV"
          echo "MANIP_REF=$MANIP_REF" >> "$GITHUB_ENV"
          echo "MANIP_HEAD=$MANIP_HEAD" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " MANIPVLATOR HEAD"
          echo "============================================================"

          git show -s \
            --format='%H%n%ad%n%an%n%s' \
            --date=iso-strict \
            "$MANIP_HEAD"

      # ============================================================
      # 5. VERIFY RANGE
      # ============================================================
      - name: Verify Comparison Range
        continue-on-error: true
        run: |
          set +e

          if ! git merge-base --is-ancestor \
            "$START_COMMIT" \
            "$MANIP_HEAD"; then

            echo "ERROR:"
            echo "$START_COMMIT is not an ancestor of $MANIP_HEAD"

            exit 0
          fi

          echo
          echo "============================================================"
          echo " RANGE VERIFIED"
          echo "============================================================"
          echo "START:"
          echo "$START_COMMIT"
          echo
          echo "END:"
          echo "$MANIP_HEAD"
          echo
          echo "Everything before START_COMMIT will be ignored."
          echo "START_COMMIT itself WILL be analyzed."

      # ============================================================
      # 6. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare Analysis Directories
        continue-on-error: true
        run: |
          set +e

          rm -rf manipvlator-analysis

          mkdir -p \
            manipvlator-analysis/missing-patches \
            manipvlator-analysis/logs \
            manipvlator-analysis/patch-id

          touch manipvlator-analysis/missing.txt
          touch manipvlator-analysis/already-present.txt
          touch manipvlator-analysis/errors.txt
          touch manipvlator-analysis/skipped.txt

      # ============================================================
      # 7. COLLECT COMMITS
      #
      # START COMMIT IS INCLUDED.
      #
      # ORDER:
      # OLDEST -> NEWEST
      # ============================================================
      - name: Collect Manipvlator Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="manipvlator-analysis/manipvlator-commits.txt"

          # First commit = START_COMMIT
          echo "$START_COMMIT" > "$COMMITS_FILE"

          # Then every commit AFTER START_COMMIT
          git rev-list \
            --reverse \
            "$START_COMMIT..$MANIP_HEAD" \
            >> "$COMMITS_FILE"

          TOTAL="$(wc -l < "$COMMITS_FILE")"

          echo "MANIP_COMMIT_COUNT=$TOTAL" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " COMMITS TO ANALYZE"
          echo "============================================================"
          echo "Total commits: $TOTAL"
          echo "Order: OLDEST -> NEWEST"
          echo

          nl -ba "$COMMITS_FILE"

      # ============================================================
      # 8. BUILD TARGET PATCH-ID DATABASE
      #
      # Detects equivalent patches even when SHA differs.
      # ============================================================
      - name: Build Target Patch-ID Database
        continue-on-error: true
        run: |
          set +e

          TARGET_PATCH_IDS="manipvlator-analysis/patch-id/target.patchids"

          : > "$TARGET_PATCH_IDS"

          echo "Building patch-id database from target branch..."

          git log \
            --all \
            --format='%H' |
          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            PATCH_ID="$(
              git show \
                --format= \
                "$SHA" 2>/dev/null |
              git patch-id --stable 2>/dev/null |
              awk '{print $1}'
            )"

            if [ -n "$PATCH_ID" ]; then
              echo "$PATCH_ID $SHA" >> "$TARGET_PATCH_IDS"
            fi

          done

          sort -u \
            "$TARGET_PATCH_IDS" \
            -o "$TARGET_PATCH_IDS"

          TARGET_PATCH_COUNT="$(
            wc -l < "$TARGET_PATCH_IDS"
          )"

          echo "TARGET_PATCH_ID_COUNT=$TARGET_PATCH_COUNT" >> "$GITHUB_ENV"

          echo
          echo "Target patch IDs: $TARGET_PATCH_COUNT"

      # ============================================================
      # 9. ANALYZE EACH COMMIT
      # ============================================================
      - name: Analyze Manipvlator Commits
        continue-on-error: true
        run: |
          set +e

          COMMITS_FILE="manipvlator-analysis/manipvlator-commits.txt"
          TARGET_PATCH_IDS="manipvlator-analysis/patch-id/target.patchids"
          REPORT="manipvlator-analysis/report.md"

          cat > "$REPORT" <<EOF
          # Manipvlator Kernel Comparison

          ## Target

          Repository:

          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:

          16

          ## Reference

          Repository:

          manipvlator/los_kernel_xiaomi_sm6150

          Branch:

          $MANIP_BRANCH

          HEAD:

          $MANIP_HEAD

          ## Range

          Start:

          $START_COMMIT

          End:

          $MANIP_HEAD

          The START commit itself is included.

          Everything before START_COMMIT is ignored.

          Analysis order:

          OLDEST -> NEWEST

          ## Safety

          No cherry-pick.

          No commit.

          No push.

          No reset.

          No source modification.

          EOF

          INDEX=0

          while IFS= read -r SHA; do

            [ -z "$SHA" ] && continue

            INDEX=$((INDEX + 1))

            echo
            echo "============================================================"
            echo " COMMIT $INDEX / $MANIP_COMMIT_COUNT"
            echo "============================================================"
            echo "SHA: $SHA"

            SUBJECT="$(
              git show -s \
                --format='%s' \
                "$SHA" 2>/dev/null
            )"

            DATE="$(
              git show -s \
                --format='%ad' \
                --date=iso-strict \
                "$SHA" 2>/dev/null
            )"

            AUTHOR="$(
              git show -s \
                --format='%an <%ae>' \
                "$SHA" 2>/dev/null
            )"

            PARENTS="$(
              git show -s \
                --format='%P' \
                "$SHA" 2>/dev/null
            )"

            PARENT_COUNT="$(
              echo "$PARENTS" | wc -w
            )"

            echo "Subject : $SUBJECT"
            echo "Date    : $DATE"
            echo "Author  : $AUTHOR"
            echo "Parents : $PARENT_COUNT"

            # ------------------------------------------------------
            # PATCH-ID
            # ------------------------------------------------------
            PATCH_ID="$(
              git show \
                --format= \
                "$SHA" 2>/dev/null |
              git patch-id --stable 2>/dev/null |
              awk '{print $1}'
            )"

            echo "Patch ID: $PATCH_ID"

            # ------------------------------------------------------
            # PATCH-ID UNAVAILABLE
            # ------------------------------------------------------
            if [ -z "$PATCH_ID" ]; then

              echo "STATUS: PATCH-ID UNAVAILABLE"

              printf '%s | %s | patch-id unavailable | %s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                >> manipvlator-analysis/errors.txt

              continue
            fi

            # ------------------------------------------------------
            # CHECK AGAINST TARGET
            # ------------------------------------------------------
            MATCH_SHA="$(
              awk \
                -v id="$PATCH_ID" \
                '$1 == id {print $2; exit}' \
                "$TARGET_PATCH_IDS"
            )"

            if [ -n "$MATCH_SHA" ]; then

              echo "STATUS: ALREADY PRESENT / EQUIVALENT"
              echo "Target equivalent SHA: $MATCH_SHA"

              printf '%s | %s | %s | equivalent=%s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                "$MATCH_SHA" \
                >> manipvlator-analysis/already-present.txt

              continue
            fi

            # ------------------------------------------------------
            # MISSING COMMIT
            # ------------------------------------------------------
            INDEX_PADDED="$(
              printf "%04d" "$INDEX"
            )"

            SAFE_SUBJECT="$(
              echo "$SUBJECT" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9._-]/-/g' |
              sed 's/-\+/-/g' |
              sed 's/^-//;s/-$//' |
              cut -c1-100
            )"

            if [ -z "$SAFE_SUBJECT" ]; then
              SAFE_SUBJECT="manipvlator-commit"
            fi

            PATCH_FILE="manipvlator-analysis/missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch"

            echo "STATUS: MISSING"
            echo "Patch: $PATCH_FILE"

            # ------------------------------------------------------
            # CHANGED FILES
            # ------------------------------------------------------
            FILES="$(
              git diff-tree \
                --no-commit-id \
                --name-status \
                -r \
                "$SHA" 2>/dev/null
            )"

            # ------------------------------------------------------
            # SUBSYSTEM CLASSIFICATION
            # ------------------------------------------------------
            SUBSYSTEM="OTHER"

            if echo "$FILES" | grep -q 'arch/'; then
              SUBSYSTEM="ARCH"

            elif echo "$FILES" | grep -q 'drivers/'; then
              SUBSYSTEM="DRIVERS"

            elif echo "$FILES" | grep -q 'fs/'; then
              SUBSYSTEM="FILESYSTEM"

            elif echo "$FILES" | grep -q 'mm/'; then
              SUBSYSTEM="MM"

            elif echo "$FILES" | grep -q 'net/'; then
              SUBSYSTEM="NETWORK"

            elif echo "$FILES" | grep -q 'kernel/'; then
              SUBSYSTEM="KERNEL"

            elif echo "$FILES" | grep -q 'include/'; then
              SUBSYSTEM="INCLUDE"

            elif echo "$FILES" | grep -q 'security/'; then
              SUBSYSTEM="SECURITY"

            elif echo "$FILES" | grep -q 'crypto/'; then
              SUBSYSTEM="CRYPTO"

            elif echo "$FILES" | grep -q 'block/'; then
              SUBSYSTEM="BLOCK"

            elif echo "$FILES" | grep -q 'ipc/'; then
              SUBSYSTEM="IPC"

            elif echo "$FILES" | grep -q 'scripts/'; then
              SUBSYSTEM="SCRIPTS"
            fi

            # ------------------------------------------------------
            # GENERATE PATCH
            #
            # NORMAL COMMIT:
            # git format-patch
            #
            # MERGE COMMIT:
            # diff against FIRST PARENT
            # ------------------------------------------------------
            if [ "$PARENT_COUNT" -gt 1 ]; then

              FIRST_PARENT="$(
                echo "$PARENTS" | awk '{print $1}'
              )"

              git diff \
                --binary \
                --full-index \
                "$FIRST_PARENT" \
                "$SHA" \
                > "$PATCH_FILE"

              DIFF_RC=$?

              if [ "$DIFF_RC" -eq 0 ]; then

                PATCH_HEADER="$(
                  git show \
                    --format=email \
                    --no-patch \
                    "$SHA" 2>/dev/null
                )"

                if [ -n "$PATCH_HEADER" ]; then

                  {
                    echo "$PATCH_HEADER"
                    echo
                    cat "$PATCH_FILE"
                  } > "${PATCH_FILE}.tmp"

                  mv \
                    "${PATCH_FILE}.tmp" \
                    "$PATCH_FILE"

                fi

              fi

              FORMAT_RC=$DIFF_RC

            else

              git format-patch \
                --stdout \
                --full-index \
                --binary \
                -1 "$SHA" \
                > "$PATCH_FILE"

              FORMAT_RC=$?

            fi

            # ------------------------------------------------------
            # PATCH GENERATION ERROR
            # ------------------------------------------------------
            if [ "$FORMAT_RC" -ne 0 ]; then

              echo "ERROR: patch generation failed."

              printf '%s | %s | patch generation failed | %s\n' \
                "$SHA" \
                "$DATE" \
                "$SUBJECT" \
                >> manipvlator-analysis/errors.txt

              rm -f "$PATCH_FILE"

              continue
            fi

            # ------------------------------------------------------
            # APPLY CHECK
            #
            # IMPORTANT:
            # This does NOT apply the patch.
            # ------------------------------------------------------
            APPLY_LOG="manipvlator-analysis/logs/${INDEX_PADDED}-apply.log"

            git apply \
              --check \
              "$PATCH_FILE" \
              > "$APPLY_LOG" \
              2>&1

            APPLY_RC=$?

            if [ "$APPLY_RC" -eq 0 ]; then
              APPLY_STATUS="CLEAN_APPLY"
            else
              APPLY_STATUS="CONFLICT"
            fi

            # ------------------------------------------------------
            # RECORD MISSING COMMIT
            # ------------------------------------------------------
            printf '%s | %s | %s | %s | %s | %s\n' \
              "$SHA" \
              "$DATE" \
              "$SUBSYSTEM" \
              "$APPLY_STATUS" \
              "$PATCH_ID" \
              "$SUBJECT" \
              >> manipvlator-analysis/missing.txt

            # ------------------------------------------------------
            # DETAILED REPORT
            # ------------------------------------------------------
            cat >> "$REPORT" <<EOF

          ---

          ## $INDEX_PADDED — $SHA

          **Subject**

          $SUBJECT

          **Date**

          $DATE

          **Author**

          $AUTHOR

          **Parent count**

          $PARENT_COUNT

          **Patch ID**

          $PATCH_ID

          **Subsystem**

          $SUBSYSTEM

          **Apply check**

          $APPLY_STATUS

          **Patch**

          \`missing-patches/${INDEX_PADDED}-${SAFE_SUBJECT}.patch\`

          ### Changed files

          \`\`\`
          $FILES
          \`\`\`

          EOF

            if [ "$APPLY_RC" -ne 0 ]; then

              cat >> "$REPORT" <<EOF

          ### Apply check output

          \`\`\`
          $(cat "$APPLY_LOG")
          \`\`\`

          EOF

            fi

          done < "$COMMITS_FILE"

      # ============================================================
      # 10. FINAL METADATA
      # ============================================================
      - name: Generate Final Metadata
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            manipvlator-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            manipvlator-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            manipvlator-analysis/errors.txt \
            2>/dev/null || true
          )"

          cat > manipvlator-analysis/metadata.txt <<EOF
          Manipvlator Comparison Metadata
          =================================

          Target repository:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Target branch:
          16

          Reference repository:
          manipvlator/los_kernel_xiaomi_sm6150

          Reference branch:
          $MANIP_BRANCH

          Start commit:
          $START_COMMIT

          Reference HEAD:
          $MANIP_HEAD

          Total commits analyzed:
          $MANIP_COMMIT_COUNT

          Missing:
          $MISSING_COUNT

          Already present/equivalent:
          $PRESENT_COUNT

          Errors:
          $ERROR_COUNT

          Direction:
          OLDEST -> NEWEST

          START COMMIT INCLUDED:
          YES

          COMMITS BEFORE START:
          NOT ANALYZED

          Cherry-pick:
          NO

          Commit:
          NO

          Push:
          NO

          Reset:
          NO

          Source modification:
          NO
          EOF

          cat > manipvlator-analysis/README.txt <<EOF
          Manipvlator Kernel Comparison
          ==============================

          Target:
          Red-A-Hawk/los_kernel_xiaomi_sm6150

          Branch:
          16

          Reference:
          manipvlator/los_kernel_xiaomi_sm6150

          Start:
          $START_COMMIT

          End:
          $MANIP_HEAD

          The START commit itself is included.

          Everything before START_COMMIT is ignored.

          Commits are processed oldest to newest.

          Patch-ID is used to detect equivalent changes.

          Missing commits are exported as individual patches.

          No patches were applied.

          No source files were modified.

          No commits were created.

          No push was performed.
          EOF

          echo
          echo "============================================================"
          echo " FINAL RESULT"
          echo "============================================================"
          echo "Start commit : $START_COMMIT"
          echo "End commit   : $MANIP_HEAD"
          echo "Analyzed     : $MANIP_COMMIT_COUNT"
          echo "Missing      : $MISSING_COUNT"
          echo "Present      : $PRESENT_COUNT"
          echo "Errors       : $ERROR_COUNT"
          echo "============================================================"

      # ============================================================
      # 11. GITHUB STEP SUMMARY
      # ============================================================
      - name: GitHub Summary
        if: always()
        continue-on-error: true
        run: |
          set +e

          MISSING_COUNT="$(
            grep -c . \
            manipvlator-analysis/missing.txt \
            2>/dev/null || true
          )"

          PRESENT_COUNT="$(
            grep -c . \
            manipvlator-analysis/already-present.txt \
            2>/dev/null || true
          )"

          ERROR_COUNT="$(
            grep -c . \
            manipvlator-analysis/errors.txt \
            2>/dev/null || true
          )"

          {
            echo "## Manipvlator Kernel Comparison"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Target branch | \`16\` |"
            echo "| Start commit | \`$START_COMMIT\` |"
            echo "| Reference branch | \`$MANIP_BRANCH\` |"
            echo "| Reference HEAD | \`$MANIP_HEAD\` |"
            echo "| Commits analyzed | $MANIP_COMMIT_COUNT |"
            echo "| Missing | $MISSING_COUNT |"
            echo "| Already present/equivalent | $PRESENT_COUNT |"
            echo "| Errors | $ERROR_COUNT |"
            echo
            echo "### Range"
            echo
            echo "Analysis begins at:"
            echo
            echo "\`$START_COMMIT\`"
            echo
            echo "The START commit itself is included."
            echo
            echo "Everything before it is ignored."
            echo
            echo "### Safety"
            echo
            echo "- No cherry-pick"
            echo "- No commit"
            echo "- No push"
            echo "- No reset"
            echo "- No source modification"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 12. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Manipvlator Analysis
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: manipvlator-kernel-analysis
          path: manipvlator-analysis/
          if-no-files-found: warn
          retention-days: 30
